<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Coco Chicken</title>
<meta name="theme-color" content="#F5F3EF">
<script>try{if(localStorage.getItem("ccp-tema")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<style>
/* Coco Chicken's desk, laid out like a CRM the owner already trusts: global header,
   app tabs, record-style page header, dense cards and list views. Three branches,
   one screen. Demo data, clearly marked. */
:root{
  --bg:#F3F3F3; --band:#B0C4DF; --card:#FFFFFF; --sunk:#F3F3F3; --th:#F3F3F3; --line:#E5E5E5; --line2:#C9C9C9; --tx:#181818; --tx2:#444444; --tx3:#706E6B;
  --brand:#0176D3; --brand-d:#014486; --brand-bg:#EEF4FF;
  --red:#BA0517; --red-bg:#FEDED8; --ok:#2E844A; --ok-bg:#CDEFC4; --blue:#0176D3; --blue-bg:#EEF4FF; --amber:#8C4B02; --amber-bg:#FEF1CD; --yel:#FE9339; --wa:#2E844A;
  --c1:#0176D3; --c2:#FE9339; --c3:#3BA755;
  --hover:#F3F3F3; --sel:#EEF4FF; --shadow:0 2px 2px 0 rgba(0,0,0,.1);
  --body:"Salesforce Sans",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1B1B1B; --band:#16325C; --card:#242424; --sunk:#2B2B2B; --th:#2B2B2B; --line:#3A3A3A; --line2:#4A4A4A; --tx:#F3F3F3; --tx2:#C9C9C9; --tx3:#A0A0A0;
  --brand:#1B96FF; --brand-d:#78B0FD; --brand-bg:#0B2A4E;
  --red:#FE5C4C; --red-bg:#4A1410; --ok:#45C65A; --ok-bg:#163A1F; --blue:#1B96FF; --blue-bg:#0B2A4E; --amber:#FFBA45; --amber-bg:#3D2A06;
  --c1:#1B96FF; --c2:#FE9339; --c3:#45C65A;
  --hover:#2E2E2E; --sel:#0B2A4E; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--tx);font:400 13px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:0;padding:0;}
a{color:inherit;text-decoration:none;}
svg{display:block;}
:focus-visible{outline:0;box-shadow:0 0 3px var(--brand);border-radius:4px;}
.num{font-variant-numeric:tabular-nums;}
.ic{width:16px;height:16px;flex:none;}

/* global header */
.gh{position:sticky;top:0;z-index:30;background:var(--card);box-shadow:0 2px 3px rgba(0,0,0,.08);}
.gh-top{display:flex;align-items:center;gap:14px;height:50px;padding:0 16px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{width:32px;height:32px;border-radius:4px;object-fit:cover;object-position:50% 32%;background:#000;}
.search{flex:1;max-width:520px;margin:0 auto;position:relative;}
.search input{width:100%;height:32px;border:1px solid var(--line2);border-radius:4px;background:var(--card);padding:0 10px 0 32px;font-size:13px;}
.search svg{position:absolute;left:10px;top:8px;color:var(--tx3);}
.tb-r{display:flex;align-items:center;gap:4px;}
.iconbtn{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;color:var(--tx3);border:1px solid transparent;}
@media (hover:hover) and (pointer:fine){.iconbtn:hover{border-color:var(--line2);color:var(--brand);}}
.theme .sun{display:none;} :root[data-theme="dark"] .theme .sun{display:block;} :root[data-theme="dark"] .theme .moon{display:none;}
.avatar{width:32px;height:32px;border-radius:50%;background:#032D60;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;margin-left:4px;}
.gh-nav{display:flex;align-items:stretch;height:40px;padding:0 16px;border-top:1px solid var(--line);gap:0;overflow-x:auto;scrollbar-width:none;}
.gh-nav::-webkit-scrollbar{display:none;}
.appname{display:flex;align-items:center;gap:10px;padding-right:20px;margin-right:6px;font-size:16px;font-weight:400;white-space:nowrap;}
.appname .grid{width:20px;height:20px;display:grid;grid-template-columns:repeat(3,4px);gap:3px;}
.appname .grid i{width:4px;height:4px;border-radius:50%;background:var(--tx3);}
#nav{display:flex;}
#nav a{display:flex;align-items:center;gap:6px;padding:0 12px;white-space:nowrap;color:var(--tx2);border-bottom:3px solid transparent;border-top:3px solid transparent;position:relative;}
#nav a.on{border-bottom-color:var(--brand);color:var(--tx);font-weight:700;background:var(--sel);}
@media (hover:hover) and (pointer:fine){#nav a:hover{background:var(--hover);color:var(--tx);}}
#nav a .c{font-size:11px;font-weight:700;border-radius:10px;padding:0 6px;background:var(--red);color:#fff;line-height:16px;}
.band{position:absolute;left:0;right:0;top:0;height:170px;background:var(--band);z-index:-1;}
main{position:relative;z-index:0;padding:12px 12px 64px;max-width:1500px;margin:0 auto;}
.app{position:relative;isolation:isolate;}

.results{position:absolute;left:0;right:0;top:36px;background:var(--card);border:1px solid var(--line2);border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.16);padding:4px 0;max-height:60vh;overflow:auto;z-index:40;}
.results a{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;}
.results a:hover{background:var(--hover);}
.results small{color:var(--tx3);}
.results .empty{padding:10px 12px;}
/* demo notice */
.notice{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:4px;padding:8px 12px;margin-bottom:12px;color:var(--tx2);font-size:12px;box-shadow:var(--shadow);}
.notice b{color:var(--tx);}

/* record-style page header */
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);}
.ph .tile{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;color:#fff;flex:none;}
.ph .tile svg{width:22px;height:22px;}
.ph .ey{font-size:12px;color:var(--tx3);line-height:1.2;}
.ph h1{margin:0;font:700 18px/1.25 var(--body);}
.ph .sub{display:none;}
.ph .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.subline{margin:-4px 0 12px 2px;color:var(--tx2);font-size:12px;}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden;background:var(--card);}
.seg button{height:32px;padding:0 12px;font-size:13px;color:var(--brand);border-left:1px solid var(--line2);white-space:nowrap;}
.seg button:first-child{border-left:0;}
.seg button.on{background:var(--brand);color:#fff;}
@media (hover:hover) and (pointer:fine){.seg button:not(.on):hover{background:var(--hover);}}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);min-width:0;}
.card > header{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap;}
.card > header h2{margin:0;font:700 14px var(--body);}
.card > header .r{margin-left:auto;color:var(--tx3);font-size:12px;display:flex;gap:8px;align-items:center;}
.ct{width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:#fff;flex:none;}
.ct svg{width:14px;height:14px;}
.pad{padding:12px 16px 16px;}
.stack{display:grid;gap:12px;}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.status{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:15px;font-size:12px;font-weight:400;white-space:nowrap;background:var(--hover);color:var(--tx);}
.status i{display:none;}
.s-ok{background:var(--ok-bg);color:#056764;} .s-red{background:var(--red-bg);color:var(--red);} .s-amber{background:var(--amber-bg);color:var(--amber);} .s-blue{background:var(--blue-bg);color:var(--blue);} .s-gray{background:var(--hover);color:var(--tx2);}
:root[data-theme="dark"] .s-ok{color:var(--ok);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:4px;font-size:13px;font-weight:400;border:1px solid var(--line2);background:var(--card);color:var(--brand);white-space:nowrap;}
.btn:active{background:var(--hover);}
.btn.pri,.btn.red{background:var(--brand);color:#fff;border-color:var(--brand);}
.btn.wa{color:var(--brand);}
.btn.wa svg{color:#2E844A;}
.btn.sm{height:28px;padding:0 10px;font-size:12px;}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--hover);}.btn.pri:hover,.btn.red:hover{background:var(--brand-d);border-color:var(--brand-d);}}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;}

/* highlights (KPIs) */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);}
.kpi{padding:12px 16px 14px;border-left:1px solid var(--line);}
.kpi:first-child{border-left:0;}
.kpi span{color:var(--tx3);font-size:12px;}
.kpi b{display:block;font:300 28px/1.15 var(--body);margin:2px 0 2px;font-variant-numeric:tabular-nums;}
.kpi small{font-size:12px;color:var(--tx3);}
.up{color:var(--ok);font-weight:700;} .down{color:var(--red);font-weight:700;}

/* recommended actions */
.recs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);}
.rec{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);}
.rec:last-child{border-bottom:0;}
.rec .ico{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;color:#fff!important;}
.rec .ico svg{width:16px;height:16px;}
.rec b{font-weight:400;color:var(--brand);}
.rec p{margin:1px 0 0;color:var(--tx3);font-size:12px;}
.rec.done{opacity:.55;} .rec.done b{text-decoration:line-through;}

/* charts */
.chart{padding:4px 16px 6px;position:relative;border-top:1px solid var(--line);}
.chart svg{width:100%;height:auto;overflow:visible;}
.chart text{fill:var(--tx3);font:400 11px var(--body);}
.chart .gl{stroke:var(--line);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2);padding:0 16px 12px;}
.tip{position:absolute;pointer-events:none;background:#032D60;color:#fff;border-radius:4px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;z-index:5;}
.tip b{display:block;font-size:13px;}
.bars{display:grid;gap:12px;padding:12px 16px 16px;border-top:1px solid var(--line);}
.hb b{display:flex;justify-content:space-between;font-weight:400;margin-bottom:4px;gap:10px;}
.hb b em{font-style:normal;color:var(--tx3);}
.trk{height:8px;border-radius:2px;background:var(--hover);overflow:hidden;display:flex;}
.trk i{display:block;height:100%;}

/* list views */
.tbl{width:100%;border-collapse:collapse;border-top:1px solid var(--line);}
.tbl th{font-size:12px;font-weight:700;color:var(--tx2);text-align:left;padding:6px 16px;background:var(--th);border-bottom:1px solid var(--line);white-space:nowrap;text-transform:none;}
.tbl td{padding:8px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:0;}
@media (hover:hover) and (pointer:fine){.tbl tbody tr:hover td{background:var(--hover);}}
.tbl .r{text-align:right;}
.scrollx{overflow-x:auto;}

/* kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;}
.col{background:var(--card);border:1px solid var(--line);border-radius:4px;min-height:200px;box-shadow:var(--shadow);}
.col h3{margin:0;padding:10px 12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--th);border-radius:4px 4px 0 0;}
.col h3 span{font-weight:400;color:var(--tx3);}
.col > .tk:first-of-type{margin-top:10px;}
.tk{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:0 10px 10px;}
.tk .t{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.tk .t b{font-size:13px;color:var(--brand);font-weight:400;}
.tk ul{margin:6px 0;padding:0;list-style:none;font-size:13px;}
.tk li{display:flex;justify-content:space-between;gap:8px;padding:1px 0;}
.tk .m{font-size:12px;color:var(--tx3);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tk .a{display:flex;gap:8px;margin-top:8px;}
.tk .a .btn{flex:1;}
.late{color:var(--red);font-weight:700;}
.empty{padding:20px 12px;text-align:center;color:var(--tx3);font-size:12px;}
.kmode .board{grid-template-columns:repeat(2,minmax(280px,1fr));}
.kmode .tk .t b{font-size:20px;font-weight:700;color:var(--tx);} .kmode .tk ul{font-size:17px;font-weight:700;}

/* forms */
.form{display:grid;gap:12px;}
.form > *,.f2 > *{min-width:0;}
.form label{display:grid;gap:2px;font-size:12px;color:var(--tx2);}
.form input,.form select,.form textarea{width:100%;min-width:0;height:32px;border-radius:4px;border:1px solid var(--line2);background:var(--card);padding:0 10px;font-size:13px;}
.form textarea{height:96px;padding:8px 10px;resize:vertical;}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 3px var(--brand);}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.res{border-radius:4px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);}
.big{font:300 24px var(--body);font-variant-numeric:tabular-nums;}

.stamps{display:flex;gap:4px;}
.stamps i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line2);}
.stamps i.on{background:var(--brand);border-color:var(--brand);}
.hint{font-size:12px;color:var(--tx3);}
.toasts{position:fixed;left:50%;top:60px;transform:translateX(-50%);display:grid;gap:8px;z-index:90;}
.toast{background:#2E844A;color:#fff;padding:10px 16px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.2);min-width:280px;}

@media (max-width:1100px){.g2{grid-template-columns:1fr;}.g3{grid-template-columns:1fr;}}
@media (max-width:860px){
  .search{display:none;}
  .gh-top{justify-content:space-between;}
  .appname{display:none;}
  .gh-nav{padding:0 4px;}
  .kpis{grid-template-columns:1fr 1fr;}
  .kpi:nth-child(3){border-left:0;} .kpi:nth-child(-n+2){border-bottom:1px solid var(--line);}
  .ph .r{margin-left:0;width:100%;}
  .seg{width:100%;} .seg button{flex:1;padding:0 6px;}
  .board{grid-template-columns:repeat(4,minmax(240px,82vw));}
  .kmode .board{grid-template-columns:repeat(2,minmax(260px,86vw));}
  .f2{grid-template-columns:1fr;}
  .tbl th,.tbl td{padding:8px 10px;}
  .rec{grid-template-columns:28px 1fr;}
  .rec > div:last-child{grid-column:2;}
  main{padding:8px 8px 64px;}
}
</style>
</head>

  <div class="gh-top">
    <div class="brand"><img src="logo.png" alt="Coco Chicken"></div>

    </div>

<script>
"use strict";
// ---------- real facts (from their own TikTok, Facebook, PedidosYa and the Bip Bip sign on their storefront) ----------

const MENU = [{n:"Pierna y tajadas",p:75,pz:1},{n:"Cadera y tajadas",p:85,pz:1},{n:"Ala y tajadas",p:95,pz:1},{n:"Pierna, cadera y tajadas",p:140,pz:2}];

  {t:"¿Pollos A 15 lempiras?",v:871500,code:"POLLO15"},{t:"36 Alitas A 600 Lempiras (con @LaYacuny)",v:933400,code:"ALITAS36"},

const HOURS = "Lunes a domingo, 9:00 am a 10:00 pm";

// ---------- deterministic demo data ----------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = a => a[Math.floor(rnd() * a.length)];
const L = n => "L" + Math.round(n).toLocaleString("en-US");
const PL = d => d.endsWith("s") ? d : d + "s";
const DAYS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const now = new Date(); const today = now.getDay();
const WK = [1.3,.8,.82,.9,.95,1.2,1.4]; // weekday demand
const BASE = {cab:46,sat:58,med:38};    // chickens per day, average
const PZ = 8;                            // pieces per chicken (setting)
const APPS = ["PedidosYa","Bip Bip"]; // delivery apps: they have no riders of their own
const CH = ["Mostrador","PedidosYa","Bip Bip","WhatsApp"];
const CHC = {Mostrador:"--c3",PedidosYa:"--c1","Bip Bip":"--c2",WhatsApp:"--wa"};
// 28 days of history per branch: chickens used and sales
const HIST = {};
BR.forEach(b => { HIST[b.id] = []; for (let d = 28; d >= 1; d--) { const wd = (today - d % 7 + 7) % 7; const ch = Math.round(BASE[b.id] * WK[wd] * (0.9 + rnd() * .2)); HIST[b.id].push({d, wd, ch, ventas: ch * PZ * 0.92 * 86}); } });
// today's sales by hour, branch and channel
const HRS = [...Array(13)].map((_, i) => 9 + i); // 9..21
const curH = 17; // the demo always shows the day at 5 pm
const SHAPE = {9:.3,10:.45,11:.9,12:1.6,13:1.5,14:.9,15:.6,16:.6,17:.9,18:1.4,19:1.5,20:1.1,21:.6};
const SALES = []; // {b, h, ch, item, qty, total}
BR.forEach(b => HRS.filter(h => h <= curH).forEach(h => {
  const n = Math.round(BASE[b.id] * WK[today] * SHAPE[h] / 2.4 * (0.8 + rnd() * .4));
  for (let i = 0; i < n; i++) { const it = pick(MENU), q = rnd() < .3 ? 2 : 1, c = rnd() < .46 ? (rnd() < .62 ? "PedidosYa" : "Bip Bip") : rnd() < .75 ? "Mostrador" : "WhatsApp";
    SALES.push({b: b.id, h, ch: c, item: it.n, qty: q, total: it.p * q, pz: it.pz * q}); }
}));
// stock (chickens) received this morning
const STOCK = {}; BR.forEach(b => { const used = SALES.filter(s => s.b === b.id).reduce((a, s) => a + s.pz, 0) / PZ; const rec = Math.round(BASE[b.id] * WK[today] * (b.id === "sat" ? .85 : 1.02)); STOCK[b.id] = {rec, used, left: Math.max(0, rec - used)}; });
const INS = [ // other supplies per branch: [name, unit, stock, minimum]
  ["Plátano verde (tajadas)","unid.",{cab:180,sat:95,med:140},{cab:120,sat:150,med:100}],
  ["Repollo","unid.",{cab:14,sat:22,med:9},{cab:8,sat:10,med:8}],
  ["Aceite","gal.",{cab:6,sat:3,med:5},{cab:4,sat:5,med:4}],
  ["Papas","lb",{cab:60,sat:85,med:40},{cab:40,sat:50,med:35}]];
// pickup orders (WhatsApp): no riders needed
const NAMES = ["Karla M.","José L.","Dania R.","Kevin A.","Marlon S.","Yessenia P.","Óscar F.","Gabriela T.","Wilmer C.","Ana Lucía B.","Héctor Z.","Sofía H.","Brayan O.","Lourdes E.","Fernando G.","Cindy V.","Mario R.","Paola N."];
const PICK = []; let oid = 4120;
for (let i = 0; i < 11; i++) { const items = []; const k = 1 + Math.floor(rnd() * 3); for (let j = 0; j < k; j++) { const it = pick(MENU); const ex = items.find(x => x.n === it.n); ex ? ex.q++ : items.push({n: it.n, p: it.p, q: 1}); }
  const st = i < 3 ? "nuevo" : i < 6 ? "cocina" : i < 8 ? "listo" : "entregado";
  PICK.push({id: ++oid, who: NAMES[i], tel: "9" + Math.floor(1000000 + rnd() * 8999999), b: pick(BR).id, items, pay: rnd() < .55 ? "Pagado con tarjeta" : "Paga al recoger", min: st === "nuevo" ? 2 + Math.floor(rnd() * 6) : st === "cocina" ? 6 + Math.floor(rnd() * 14) : 18 + Math.floor(rnd() * 30), st}); }
// till closings, last 7 days
const CAJA = []; BR.forEach(b => { for (let d = 0; d < 7; d++) { const ef = Math.round(HIST[b.id][27 - d].ventas * .52 / 5) * 5; const tj = Math.round(HIST[b.id][27 - d].ventas * .2 / 5) * 5;
  let diff = 0; if ((b.id === "cab" && d === 1) || (b.id === "med" && d === 4)) diff = -(220 + Math.round(rnd() * 20) * 10); else if (rnd() < .2) diff = Math.round((rnd() - .5) * 8) * 5;
  CAJA.push({b: b.id, d, ef, tj, cont: ef + diff, diff, who: pick(["Cajera turno tarde","Cajero turno noche","Encargada"])}); } });
// customers with the stamp card
const CLI = []; for (let i = 0; i < 18; i++) { const s = Math.floor(rnd() * 4); CLI.push({n: NAMES[(i + 5) % NAMES.length], b: pick(BR).id, s, last: Math.floor(rnd() * 30), tot: 2 + Math.floor(rnd() * 14)}); }
const TOTAL_CLI = 1284;
// TikTok attribution (demo)
TIKTOKS.forEach((t, i) => { t.ped = Math.round(t.v / 1000 * (0.35 + rnd() * .3) * (i < 3 ? 1 : .6)); t.ven = t.ped * 118; });

// ---------- state ----------
let VIEW = "hoy", SUC = "all", KMODE = false;
const COMM = {PedidosYa:25,"Bip Bip":25}; // % per app; real contracts unknown, the owner sets them
try { Object.assign(COMM, JSON.parse(localStorage.getItem("ccp-com2") || "{}")); } catch (e) {}
const appSum = (s, a) => s.filter(x => x.ch === a).reduce((q, x) => q + x.total, 0);
const commOf = s => APPS.reduce((q, a) => q + appSum(s, a) * COMM[a] / 100, 0);
const DONE = new Set();
const inB = x => SUC === "all" || x.b === SUC;
const bn = id => BR.find(b => b.id === id).n;
const col = v => `var(${v})`;
const $ = s => document.querySelector(s);
const toast = t => { const e = document.createElement("div"); e.className = "toast"; e.textContent = t; $("#toasts").append(e); setTimeout(() => e.remove(), 2600); };
const waLink = (txt, tel) => "https://wa.me/" + (tel ? "504" + tel : "") + "?text=" + encodeURIComponent(txt);
const icon = (id, cls = "ic") => `<svg class="${cls}"><use href="#${id}"/></svg>`;

const NAV = [["hoy","Inicio","i-home"],["recoger","Pedidos","i-bag"],["caja","Caja","i-cash"],["pollo","Inventario","i-box"],["ventas","Ventas","i-chart"],["clientes","Clientes","i-users"],["tiktok","TikTok","i-play"]];
function nav() {
  const waiting = PICK.filter(p => inB(p) && (p.st === "nuevo" || p.st === "listo")).length;
  const badCaja = CAJA.filter(c => inB(c) && c.d < 3 && c.diff < -100).length;
  $("#nav").innerHTML = NAV.map(([id, t, ic]) => { const c = id === "recoger" ? waiting : id === "caja" ? badCaja : 0;
    return `<a href="#${id}" class="${VIEW === id ? "on" : ""}" data-v="${id}">${t}${c ? `<span class="c">${c}</span>` : ""}</a>`; }).join("");
}
const SEG = () => `<div class="seg" role="tablist" aria-label="Sucursal">${[["all","Todas"], ...BR.map(b => [b.id, b.n.replace("Barrio ", "").replace("Colonia ", "")])].map(([id, t]) => `<button class="${SUC === id ? "on" : ""}" data-s="${id}" role="tab" aria-selected="${SUC === id}">${t}</button>`).join("")}</div>`;
const TILE = {hoy:["i-home","#0176D3"],recoger:["i-bag","#FE9339"],caja:["i-cash","#3BA755"],pollo:["i-box","#B78300"],ventas:["i-chart","#0B827C"],clientes:["i-users","#9050E9"],tiktok:["i-play","#181818"]};
const PH = (title, sub, extra = "") => `<div class="notice"><b>Demo</b> Menú, precios y vistas de TikTok son los reales de Coco Chicken. Bip Bip está en el letrero de su local y lo mencionan sus clientes. Ventas, clientes, caja e inventario son datos de ejemplo.</div>
  <div class="ph"><div class="tile" style="background:${TILE[VIEW][1]}">${icon(TILE[VIEW][0])}</div><div><div class="ey">Coco Chicken · ${scope()}</div><h1>${title}</h1></div><div class="r">${extra}${SEG()}</div></div><div class="subline">${sub}</div>`;
const CT = (ic, c) => `<span class="ct" style="background:${c}">${icon(ic)}</span>`;
const scope = () => SUC === "all" ? "las 3 sucursales" : bn(SUC);

// ---------- views ----------
function vHoy() {
  const s = SALES.filter(inB); const tot = s.reduce((a, x) => a + x.total, 0); const ped = s.length;
  const com = commOf(s);
  const pz = s.reduce((a, x) => a + x.pz, 0);
  const prev = BR.filter(inB).reduce((a, b) => a + HIST[b.id][21].ventas * HRS.filter(h => h <= curH).reduce((q, h) => q + SHAPE[h], 0) / 12.95, 0);
  const ch = Math.round((tot / prev - 1) * 100);
  const recs = RECS().filter(r => SUC === "all" || r.b === SUC || !r.b);
  return `${PH(`Hoy, ${DAYS[today]}`, `5:00 pm · ${HOURS}`)}
  <div class="stack">
    <section class="card"><div class="kpis">
      <div class="kpi"><span>Ventas de hoy</span><b class="num">${L(tot)}</b><small><span class="${ch >= 0 ? "up" : "down"}">${ch >= 0 ? "▲" : "▼"} ${Math.abs(ch)}%</span> vs. el ${DAYS[today]} pasado a esta hora</small></div>
      <div class="kpi"><span>Pedidos</span><b class="num">${ped}</b><small>${s.filter(x => x.ch === "WhatsApp").length} por WhatsApp para recoger</small></div>
      <div class="kpi"><span>Pollos vendidos</span><b class="num">${(pz / PZ).toFixed(1)}</b><small>${pz} piezas · ${PZ} piezas por pollo</small></div>
      <div class="kpi"><span>Comisión a las apps hoy</span><b class="num">${L(com)}</b><small>${APPS.map(a => `${a} ${L(appSum(s, a) * COMM[a] / 100)}`).join(" · ")} · <a href="#ventas" data-v="ventas" style="color:var(--blue);font-weight:600">ajustar</a></small></div>
    </div></section>
    <div class="g2">
      <section class="card"><header>${CT("i-warn","#FE9339")}<h2>Acciones recomendadas</h2><div class="r">${recs.filter(r => !DONE.has(r.id)).length} pendientes</div></header>
        <ul class="recs">${recs.map(r => `<li class="rec ${DONE.has(r.id) ? "done" : ""}"><div class="ico" style="background:${{red:"#EA001E",amber:"#FE9339",blue:"#0176D3",ok:"#3BA755"}[r.t]}">${icon(r.i)}</div><div><b>${r.h}</b><p>${r.p}</p></div><div>${r.a}</div></li>`).join("")}</ul></section>
      <section class="card"><header>${CT("i-chart","#0176D3")}<h2>Ventas por hora</h2><div class="r">hasta las ${curH}:00</div></header>${hourChart(s)}
        <div class="legend">${(SUC === "all" ? BR : BR.filter(b => b.id === SUC)).map(b => `<span><i class="dot" style="background:${col(b.c)}"></i>${b.n}</span>`).join("")}</div></section>
    </div>
    <div class="g3">${BR.filter(inB).map(b => { const bs = SALES.filter(x => x.b === b.id), st = STOCK[b.id]; const pend = PICK.filter(p => p.b === b.id && p.st !== "entregado").length; const cj = CAJA.find(c => c.b === b.id && c.d === 1);
      return `<section class="card"><header><h2><i class="dot" style="background:${col(b.c)}"></i>${b.n}</h2></header><div class="pad" style="display:grid;gap:10px">
        <div style="display:flex;justify-content:space-between"><span class="hint">Ventas</span><b class="num">${L(bs.reduce((a, x) => a + x.total, 0))}</b></div>
        <div style="display:flex;justify-content:space-between"><span class="hint">Pollo que queda</span><b class="num ${st.left < BASE[b.id] * .25 ? "late" : ""}">${st.left.toFixed(1)} de ${st.rec}</b></div>
        <div style="display:flex;justify-content:space-between"><span class="hint">Para recoger en curso</span><b>${pend}</b></div>
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="hint">Caja de ayer</span>${cajaTag(cj)}</div></div></section>`; }).join("")}</div>
  </div>`;
}
function cajaTag(c) { return Math.abs(c.diff) < 30 ? `<span class="status s-ok"><i></i>Cuadró</span>` : c.diff < 0 ? `<span class="status s-red"><i></i>Faltan ${L(-c.diff)}</span>` : `<span class="status s-amber"><i></i>Sobran ${L(c.diff)}</span>`; }
function forecast(b) { const wd = (today + 1) % 7; const same = HIST[b].filter(h => h.wd === wd); const avg = same.reduce((a, h) => a + h.ch, 0) / same.length; return {wd, need: Math.ceil(avg * 1.05), avg}; }
function RECS() {
  const r = [];
  BR.forEach(b => { const st = STOCK[b.id]; const rate = st.used / Math.max(1, curH - 8); const hrs = st.left / Math.max(.1, rate);
    if (curH + hrs < 22) r.push({id: "p" + b.id, b: b.id, t: "red", i: "i-warn", h: `${b.n}: el pollo se acaba como a las ${Math.floor(curH + hrs)}:00`, p: `Quedan ${st.left.toFixed(1)} pollos y se venden ${rate.toFixed(1)} por hora.`, a: `<a class="btn sm wa" target="_blank" rel="noopener" data-done="p${b.id}" href="${waLink(`Buenas, para ${b.n} necesitamos ${Math.ceil(rate * (22 - curH) - st.left)} pollos hoy lo antes posible. Gracias. Coco Chicken`)}">${icon("i-wa")}Pedir al proveedor</a>`}); });
  const c = CAJA.find(x => x.d === 1 && x.diff < -100); if (c) r.push({id: "c" + c.b, b: c.b, t: "red", i: "i-cash", h: `${bn(c.b)}: la caja de ayer cerró con ${L(-c.diff)} de menos`, p: `Cerró ${c.who.toLowerCase()}. Efectivo esperado ${L(c.ef)}, contado ${L(c.cont)}.`, a: `<button class="btn sm" data-v="caja">Revisar</button>`});
  const late = PICK.filter(p => p.st === "listo" && p.min > 25); late.forEach(p => r.push({id: "l" + p.id, b: p.b, t: "amber", i: "i-clock", h: `Pedido #${p.id} listo hace ${p.min} min`, p: `${p.who} no ha llegado a ${bn(p.b)}. Recordarle por WhatsApp.`, a: `<a class="btn sm wa" target="_blank" rel="noopener" data-done="l${p.id}" href="${waLink(`Hola ${p.who.split(" ")[0]}, su pedido #${p.id} de Coco Chicken ya está listo en ${bn(p.b)}. ¡Lo esperamos!`, p.tel)}">${icon("i-wa")}Avisar</a>`}));
  const f = forecast("sat"); r.push({id: "m", t: "blue", i: "i-box", h: `Pedido de pollo para mañana ${DAYS[f.wd]}: ${BR.reduce((a, b) => a + forecast(b.id).need, 0)} pollos`, p: `Calculado con los últimos 4 ${PL(DAYS[f.wd])} de cada sucursal, más 5% de colchón.`, a: `<button class="btn sm" data-v="pollo">Ver detalle</button>`});
  const wkApps = BR.reduce((q, b) => q + HIST[b.id].slice(21).reduce((t, h) => t + h.ventas, 0), 0) * APPS.reduce((q, x) => q + appSum(SALES, x), 0) / SALES.reduce((q, x) => q + x.total, 0);
  const wkNet = wkApps - BR.reduce((q, b) => q + HIST[b.id].slice(21).reduce((t, h) => t + h.ventas, 0), 0) * commOf(SALES) / SALES.reduce((q, x) => q + x.total, 0);
  r.push({id: "dep", t: "blue", i: "i-cash", h: `PedidosYa y Bip Bip le deben depositar ${L(wkNet)} de esta semana`, p: `Ventas por las apps ${L(wkApps)} menos comisiones. Revise que cada depósito llegue completo.`, a: `<button class="btn sm" data-v="ventas">Ver por app</button>`});
  const dorm = CLI.filter(c => c.last > 14).length; r.push({id: "promo", t: "ok", i: "i-send", h: `${Math.round(TOTAL_CLI * .31)} clientes no han vuelto en 2 semanas`, p: "Mandarles la promo de la semana por WhatsApp desde Clientes y promos.", a: `<button class="btn sm" data-v="clientes">Preparar</button>`});
  return r;
}
function hourChart(s) {
  const W = 640, H = 220, pl = 36, pb = 24, bw = (W - pl) / HRS.length;
  const bs = SUC === "all" ? BR : BR.filter(b => b.id === SUC);
  const data = HRS.map(h => bs.map(b => s.filter(x => x.h === h && x.b === b.id).reduce((a, x) => a + x.total, 0)));
  const mx = Math.max(1000, ...data.map(d => d.reduce((a, x) => a + x, 0))); const step = Math.ceil(mx / 4 / 500) * 500;
  let g = ""; for (let i = 0; i <= 4; i++) { const y = H - pb - (H - pb - 10) * (i * step) / (step * 4); g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${i ? (i * step / 1000).toFixed(1) + "k" : 0}</text>`; }
  HRS.forEach((h, i) => { let y0 = H - pb; data[i].forEach((v, j) => { const hh = (H - pb - 10) * v / (step * 4); y0 -= hh; g += `<rect x="${pl + i * bw + bw * .18}" y="${y0}" width="${bw * .64}" height="${Math.max(0, hh)}" rx="2" fill="${col(bs[j].c)}" data-tip="${h}:00 · ${bs[j].n}|${L(v)}"/>`; });
    if (i % 2 === 0 || HRS.length < 8) g += `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${h > 12 ? h - 12 + "pm" : h + (h === 12 ? "pm" : "am")}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por hora">${g}</svg></div>`;
}

  <p class="hint" style="margin-top:14px">Cuando un pedido pasa a "Listo", el bot le escribe solo al cliente. El botón "Avisar" es para recordarle si no ha llegado.</p>`;

function vCaja() {
  const bs = BR.filter(inB); const b0 = SUC === "all" ? "cab" : SUC;

  const lbl = d => d === 0 ? "Hoy" : d === 1 ? "Ayer" : DAYS[(today - d + 7) % 7];
  return `${PH("Cierre de caja", "Cada noche el cajero cuenta desde el celular. El panel compara con lo que se vendió y avisa si no cuadra.")}
  <div class="g2">
    <section class="card"><header>${CT("i-cash","#3BA755")}<h2>Últimos 7 días</h2><div class="r">${bs.length === 3 ? "3 sucursales" : bs[0].n}</div></header><div class="scrollx"><table class="tbl">
      <thead><tr><th>Día</th>${SUC === "all" ? "<th>Sucursal</th>" : ""}<th class="r">Efectivo esperado</th><th class="r">Contado</th><th>Resultado</th></tr></thead>
      <tbody>${rows.filter(c => c.d > 0).map(c => `<tr><td>${lbl(c.d)}</td>${SUC === "all" ? `<td>${bn(c.b)}</td>` : ""}<td class="r num">${L(c.ef)}</td><td class="r num">${L(c.cont)}</td><td>${cajaTag(c)}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="card"><header>${CT("i-check","#3BA755")}<h2>Cerrar caja de hoy</h2></header><div class="pad form" id="cform">
      <label>Sucursal<select id="cb">${BR.map(b => `<option value="${b.id}" ${b.id === b0 ? "selected" : ""}>${b.n}</option>`).join("")}</select></label>
      <div class="f2"><label>Efectivo contado (L)<input id="cef" inputmode="decimal" placeholder="0"></label><label>Gastos pagados de caja (L)<input id="cga" inputmode="decimal" placeholder="0"></label></div>
      <div id="cres"></div>
      <button class="btn pri" id="cok">Guardar cierre</button>
      <p class="hint">El efectivo esperado sale de las ventas en mostrador y de los pedidos que se pagan al recoger.</p>
    </div></section>
  </div>`;
}
function cajaCalc() {
  const b = $("#cb").value; const exp = Math.round(SALES.filter(x => x.b === b && !APPS.includes(x.ch)).reduce((a, x) => a + x.total, 0) * .7);
  const ef = +($("#cef").value || 0), ga = +($("#cga").value || 0); const d = ef + ga - exp;
  $("#cres").innerHTML = `<div class="res" style="background:var(--sunk)"><span>Efectivo esperado</span><span class="big">${L(exp)}</span></div>` + (ef ? `<div class="res" style="background:var(--${Math.abs(d) < 30 ? "ok" : d < 0 ? "red" : "amber"}-bg);color:var(--${Math.abs(d) < 30 ? "ok" : d < 0 ? "red" : "amber"})"><span>${Math.abs(d) < 30 ? "Cuadra" : d < 0 ? "Faltan" : "Sobran"}</span><span class="big">${Math.abs(d) < 30 ? "✓" : L(Math.abs(d))}</span></div>` : "");
}

function vPollo() {
  const bs = BR.filter(inB); const f0 = forecast("sat").wd;
  const tot = bs.reduce((a, b) => a + forecast(b.id).need, 0);
  const msg = `Buenas, pedido de Coco Chicken para mañana ${DAYS[f0]}:\n` + bs.map(b => `• ${b.n}: ${forecast(b.id).need} pollos`).join("\n") + `\nTotal: ${tot} pollos. Gracias.`;
  return `${PH("Pollo e insumos", "Cuánto pollo queda hoy, cuánto pedir para mañana y qué insumo está por acabarse.")}
  <div class="stack">
    <div class="g3">${bs.map(b => { const st = STOCK[b.id]; const pct = st.left / st.rec * 100;
      return `<section class="card"><header><h2><i class="dot" style="background:${col(b.c)}"></i>${b.n}</h2></header><div class="pad" style="display:grid;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="hint">Quedan hoy</span><span class="big ${pct < 25 ? "late" : ""}">${st.left.toFixed(1)} <small style="font-size:14px;color:var(--tx3)">pollos</small></span></div>
      <div class="trk"><i style="width:${pct}%;background:${pct < 25 ? "var(--red)" : col(b.c)}"></i></div>
      <div class="hint">Recibidos ${st.rec} esta mañana · vendidos ${st.used.toFixed(1)}</div></div></section>`; }).join("")}</div>
    <div class="g2">
      <section class="card"><header>${CT("i-box","#B78300")}<h2>Pedido para mañana, ${DAYS[f0]}</h2><div class="r">promedio de los últimos 4 ${PL(DAYS[f0])} + 5%</div></header>
        <table class="tbl"><thead><tr><th>Sucursal</th><th class="r">Promedio</th><th class="r">Pedir</th></tr></thead>
        <tbody>${bs.map(b => { const f = forecast(b.id); return `<tr><td>${b.n}</td><td class="r num">${f.avg.toFixed(0)}</td><td class="r num"><b>${f.need}</b></td></tr>`; }).join("")}
        <tr><td><b>Total</b></td><td></td><td class="r num"><b>${tot} pollos</b></td></tr></tbody></table>
        <div class="pad" style="border-top:1px solid var(--line)"><a class="btn wa" target="_blank" rel="noopener" href="${waLink(msg)}">${icon("i-wa")}Mandar pedido al proveedor</a></div></section>
      <section class="card"><header>${CT("i-box","#B78300")}<h2>Insumos</h2><div class="r">en rojo: debajo del mínimo</div></header><div class="scrollx"><table class="tbl">
        <thead><tr><th>Insumo</th>${bs.map(b => `<th class="r">${b.n.split(" ").pop()}</th>`).join("")}</tr></thead>
        <tbody>${INS.map(([n, u, s, m]) => `<tr><td>${n}</td>${bs.map(b => `<td class="r num ${s[b.id] < m[b.id] ? "late" : ""}">${s[b.id]} ${u}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
    </div>
  </div>`;
}

function vVentas() {
  const bs = BR.filter(inB);
  const wk = bs.reduce((a, b) => a + HIST[b.id].slice(21).reduce((q, h) => q + h.ventas, 0), 0);
  const s = SALES.filter(inB); const tot = s.reduce((a, x) => a + x.total, 0) || 1;
  const byCh = CH.map(c => [c, s.filter(x => x.ch === c).reduce((a, x) => a + x.total, 0)]);
  const pyShare = APPS.reduce((q, a) => q + appSum(s, a), 0) / tot; const pyWeek = wk * pyShare; const comWeek = wk * commOf(s) / tot;
  const items = MENU.map(m => [m.n, s.filter(x => x.item === m.n).reduce((a, x) => a + x.qty, 0), s.filter(x => x.item === m.n).reduce((a, x) => a + x.total, 0)]).sort((a, b) => b[2] - a[2]);
  const mxI = Math.max(...items.map(i => i[2]));
  return `${PH("Ventas y comisiones", "Por canal, por producto y cuánto se va en comisión.")}
  <div class="stack">
    <section class="card"><div class="kpis">
      <div class="kpi"><span>Ventas últimos 7 días</span><b class="num">${L(wk)}</b><small>${scope()}</small></div>
      <div class="kpi"><span>Por PedidosYa y Bip Bip (estimado)</span><b class="num">${L(pyWeek)}</b><small>${Math.round(pyShare * 100)}% de las ventas</small></div>
      <div class="kpi"><span>Comisión pagada en 7 días</span><b class="num" style="color:var(--red)">${L(comWeek)}</b><small>${APPS.map(a => `${a} ${COMM[a]}%`).join(" · ")} · al mes ≈ ${L(comWeek * 4.3)}</small></div>
      <div class="kpi"><span>Si 1 de cada 4 pasa a recoger</span><b class="num" style="color:var(--ok)">${L(comWeek * .25 * 4.3)}</b><small>de ahorro al mes</small></div>
    </div></section>
    <div class="g2">
      <section class="card"><header>${CT("i-chart","#0B827C")}<h2>Hoy por canal</h2></header><div class="bars">${byCh.map(([c, v]) => `<div class="hb"><b>${c}<em class="num">${L(v)} · ${Math.round(v / tot * 100)}%</em></b><div class="trk"><i style="width:${v / tot * 100}%;background:${col(CHC[c])}"></i></div></div>`).join("")}</div>
        <div class="pad form" style="border-top:1px solid var(--line)">${APPS.map((a, i) => `<label>Comisión de ${a} según su contrato (%)<input id="com${i}" data-app="${a}" inputmode="decimal" value="${COMM[a]}"></label>`).join("")}<p class="hint">No conocemos sus comisiones reales; póngalas aquí y todo el panel se recalcula.</p></div></section>
      <section class="card"><header>${CT("i-chart","#0B827C")}<h2>Lo más vendido hoy</h2></header><div class="bars">${items.map(([n, q, v]) => `<div class="hb"><b>${n}<em class="num">${q} · ${L(v)}</em></b><div class="trk"><i style="width:${v / mxI * 100}%;background:var(--c1)"></i></div></div>`).join("")}</div></section>
    </div>
  </div>`;
}

function vClientes() {
  const cs = CLI.filter(inB);
  return `${PH("Clientes y promos", "La tarjeta \"Pagas 3, el 4 es gratis\" vive en WhatsApp: cada compra suma un sello y cada cliente queda en su lista.")}
  <div class="stack">
    <section class="card"><div class="kpis">
      <div class="kpi"><span>Clientes en la lista</span><b class="num">${TOTAL_CLI.toLocaleString("en-US")}</b><small>con número de WhatsApp</small></div>
      <div class="kpi"><span>A un sello del gratis</span><b class="num">${Math.round(TOTAL_CLI * .12)}</b><small>3 sellos</small></div>
      <div class="kpi"><span>No vuelven hace 2 semanas</span><b class="num">${Math.round(TOTAL_CLI * .31)}</b><small>buen público para una promo</small></div>
      <div class="kpi"><span>Pollos gratis canjeados</span><b class="num">74</b><small>este mes</small></div>
    </div></section>
    <div class="g2">
      <section class="card"><header>${CT("i-users","#9050E9")}<h2>Clientes</h2><div class="r">muestra</div></header><div class="scrollx"><table class="tbl">
        <thead><tr><th>Cliente</th><th>Sucursal</th><th>Tarjeta</th><th class="r">Compras</th><th class="r">Última</th></tr></thead>
        <tbody>${cs.map(c => `<tr><td>${c.n}</td><td>${bn(c.b)}</td><td><span class="stamps">${[0, 1, 2, 3].map(i => `<i class="${i < c.s ? "on" : ""}"></i>`).join("")}</span></td><td class="r num">${c.tot}</td><td class="r">${c.last ? "hace " + c.last + " d" : "hoy"}</td></tr>`).join("")}</tbody></table></div></section>
      <section class="card"><header>${CT("i-send","#9050E9")}<h2>Mandar una promo</h2></header><div class="pad form">
        <label>A quién<select id="pa"><option value="all">Todos (${TOTAL_CLI.toLocaleString("en-US")})</option><option value="dorm">No vuelven hace 2 semanas (${Math.round(TOTAL_CLI * .31)})</option><option value="near">A un sello del gratis (${Math.round(TOTAL_CLI * .12)})</option></select></label>
        <label>Mensaje<textarea id="pm">¡Hola! Esta semana en Coco Chicken: pagas 3, el 4 es gratis. Pide por aquí y pasa a recoger a tu sucursal. ¡Mmm qué sabroso! 🍗</textarea></label>
        <button class="btn red" id="psend">${icon("i-send")}Programar envío</button>
        <p class="hint">WhatsApp cobra cada mensaje de promoción; el panel muestra el costo antes de enviar. Solo se escribe a quien aceptó recibir promos.</p></div></section>
    </div>
  </div>`;
}

function vTiktok() {
  const ts = TIKTOKS.slice().sort((a, b) => b.ven - a.ven); const mx = ts[0].ven;
  return `${PH("Ventas por video de TikTok", "Cada video lleva su código (\"di POLLO15 al pedir\"). El bot lo anota y aquí se ve cuánto vendió cada uno.")}
  <section class="card"><header>${CT("i-play","#181818")}<h2>Videos de @cocochiken1</h2><div class="r">vistas reales · pedidos de ejemplo</div></header><div class="scrollx"><table class="tbl">
    <thead><tr><th>Video</th><th>Código</th><th class="r">Vistas</th><th class="r">Pedidos</th><th style="min-width:160px">Ventas</th></tr></thead>
    <tbody>${ts.map(t => `<tr><td>${t.t}</td><td><span class="status s-gray">${t.code}</span></td><td class="r num">${t.v >= 1000 ? (t.v / 1000).toFixed(1) + "K" : t.v}</td><td class="r num">${t.ped}</td><td><div style="display:flex;gap:10px;align-items:center"><div class="trk" style="flex:1"><i style="width:${t.ven / mx * 100}%;background:var(--c1)"></i></div><span class="num">${L(t.ven)}</span></div></td></tr>`).join("")}</tbody></table></div></section>
  <p class="hint" style="margin-top:14px">Con esto se sabe qué tipo de video repetir: los de oferta de precio y los de inauguración pasan de 100 mil vistas; los del día a día quedan entre 600 y 10 mil.</p>`;
}

// ---------- render & events ----------
const VIEWS = {hoy: vHoy, recoger: vRecoger, caja: vCaja, pollo: vPollo, ventas: vVentas, clientes: vClientes, tiktok: vTiktok};
function render() { nav(); $("#main").innerHTML = VIEWS[VIEW](); if (VIEW === "caja") cajaCalc(); window.scrollTo(0, 0); }
function go(v) { if (!VIEWS[v]) return; const rs = $("#results"); if (rs) { rs.hidden = true; $("#q").value = ""; } VIEW = v; KMODE = false; history.replaceState(null, "", "#" + v); render(); }
document.addEventListener("click", e => {
  const v = e.target.closest("[data-v]"); if (v) { e.preventDefault(); go(v.dataset.v); return; }
  const s = e.target.closest("[data-s]"); if (s) { SUC = s.dataset.s; render(); return; }
  const d = e.target.closest("[data-done]"); if (d) { DONE.add(d.dataset.done); setTimeout(render, 300); }
  const m = e.target.closest("[data-mv]"); if (m) { const p = PICK.find(x => x.id === +m.dataset.mv); const nx = {nuevo: "cocina", cocina: "listo", listo: "entregado"}[p.st]; p.st = nx; p.min = 0;
    toast(nx === "listo" ? `#${p.id} listo. El bot le avisó a ${p.who.split(" ")[0]} (demo)` : nx === "cocina" ? `#${p.id} pasó a cocina` : `#${p.id} entregado`); render(); }
  if (e.target.closest("#kmode")) { KMODE = !KMODE; render(); }
  if (e.target.closest("#cok")) { if (!$("#cef").value) { toast("Escriba el efectivo contado"); return; } toast(`Cierre de ${bn($("#cb").value)} guardado (demo)`); $("#cef").value = ""; $("#cga").value = ""; cajaCalc(); }
  if (e.target.closest("#psend")) { const n = {all: TOTAL_CLI, dorm: Math.round(TOTAL_CLI * .31), near: Math.round(TOTAL_CLI * .12)}[$("#pa").value]; toast(`Promo programada para ${n.toLocaleString("en-US")} clientes (demo)`); }
  if (e.target.closest("#tema")) { const dk = document.documentElement.dataset.theme === "dark"; if (dk) delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = "dark"; try { localStorage.setItem("ccp-tema", dk ? "light" : "dark"); } catch (er) {} }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { const q = e.target.value.trim().toLowerCase().replace("#", ""); const r = $("#results"); if (!q) { r.hidden = true; return; }
    const hits = [...PICK.filter(p => String(p.id).includes(q) || p.who.toLowerCase().includes(q)).map(p => `<a href="#recoger" data-v="recoger"><span>Pedido #${p.id} · ${p.who}</span><small>${bn(p.b)}</small></a>`),
      ...CLI.filter(c => c.n.toLowerCase().includes(q)).map(c => `<a href="#clientes" data-v="clientes"><span>${c.n}</span><small>Cliente · ${bn(c.b)}</small></a>`)].slice(0, 8);
    r.innerHTML = hits.join("") || `<div class="empty">Sin resultados</div>`; r.hidden = false; }
  if (e.target.id === "cef" || e.target.id === "cga" || e.target.id === "cb") cajaCalc();
  if (e.target.dataset.app) { const v = +e.target.value, id = e.target.id; if (v >= 0 && v <= 60) { COMM[e.target.dataset.app] = v; try { localStorage.setItem("ccp-com2", JSON.stringify(COMM)); } catch (er) {} const pos = e.target.selectionStart; render(); const i = document.getElementById(id); i.focus(); i.setSelectionRange(pos, pos); } }
});
document.addEventListener("change", e => { if (e.target.id === "cb") cajaCalc(); });
// chart tooltips
document.addEventListener("pointerover", e => { const r = e.target.closest("[data-tip]"); const old = document.querySelector(".tip"); if (old) old.remove(); if (!r) return;
  const ch = r.closest(".chart"); const bb = r.getBoundingClientRect(), cb = ch.getBoundingClientRect(); const [a, b] = r.dataset.tip.split("|");
  const t = document.createElement("div"); t.className = "tip"; t.innerHTML = `<b>${b}</b>${a}`; t.style.left = (bb.left + bb.width / 2 - cb.left) + "px"; t.style.top = (bb.top - cb.top) + "px"; ch.append(t); });
const h0 = location.hash.slice(1); if (VIEWS[h0]) VIEW = h0;
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== VIEW) go(h); });
render();
</script>
</body>
</html>
