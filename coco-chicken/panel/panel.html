<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Coco Chicken</title>
<meta name="theme-color" content="#F5F3EF">
<script>try{if(localStorage.getItem("ccp-tema")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<style>
/* Coco Chicken's desk: three branches, one screen. Built for the owner who can't be in
   Cabañas, Satélite and Medina at once: what sold, what the till says, how much chicken
   to order, which pickup orders are waiting, which TikTok sold. Demo data, clearly marked. */
:root{
  --bg:#F5F3EF; --card:#FFFFFF; --sunk:#F8F7F4; --line:#E7E3DD; --line2:#D7D2CA; --tx:#1C1A19; --tx2:#5E5A57; --tx3:#8A8580;
  --red:#C9241A; --red-bg:#FBE8E6; --ok:#1C8C4E; --ok-bg:#E5F4EB; --blue:#2763C9; --blue-bg:#E8EFFC; --amber:#9A660E; --amber-bg:#FBF0DA; --yel:#FFD21F; --wa:#1FA855;
  --c1:#C9241A; --c2:#F28C1B; --c3:#6B5B53;
  --hover:#F1EEE9; --sel:#FBE8E6; --shadow:0 1px 2px rgba(20,20,20,.04);
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121110; --card:#1B1A19; --sunk:#161514; --line:#2C2A28; --line2:#3A3734; --tx:#EEEBE7; --tx2:#A9A49F; --tx3:#7E7974;
  --red:#F2685D; --red-bg:#3A1A17; --ok:#3CC47A; --ok-bg:#16301F; --blue:#6E9CF0; --blue-bg:#1A2742; --amber:#E0A84A; --amber-bg:#33280F;
  --c1:#F2685D; --c2:#F5A04A; --c3:#B8A79C;
  --hover:#242220; --sel:#3A1A17; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:0;padding:0;}
a{color:inherit;text-decoration:none;}
svg{display:block;}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px;}
.num{font-variant-numeric:tabular-nums;}
.ic{width:18px;height:18px;flex:none;}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:60px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);}
.topbar .menu{display:none;}
.menu{width:38px;height:38px;border-radius:9px;place-items:center;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 32%;background:#000;}
.brand small{display:block;font-weight:500;color:var(--tx3);font-size:12px;letter-spacing:0;}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto;}
.seg button{height:32px;padding:0 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--tx2);white-space:nowrap;transition:background-color .15s ease,color .15s ease;}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.tb-r{display:flex;align-items:center;gap:6px;}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);}
@media (hover:hover) and (pointer:fine){.iconbtn:hover{background:var(--hover);color:var(--tx);}}
.theme .sun{display:none;} :root[data-theme="dark"] .theme .sun{display:block;} :root[data-theme="dark"] .theme .moon{display:none;}
.demo-b{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:7px;background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:700;white-space:nowrap;}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100svh - 60px);}
.side{position:sticky;top:60px;height:calc(100svh - 60px);overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px;}
.side nav{display:grid;gap:2px;}
.side nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--tx2);font-weight:500;position:relative;}
.side nav a.on{background:var(--sel);color:var(--tx);}
.side nav a.on::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--red);}
.side nav a .c{margin-left:auto;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--red);color:#fff;}
@media (hover:hover) and (pointer:fine){.side nav a:hover{background:var(--hover);color:var(--tx);}}
.side .note{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--sunk);font-size:12px;color:var(--tx2);}
.side .note b{display:block;color:var(--tx);font-size:13px;margin-bottom:2px;}
main{padding:24px clamp(16px,2.6vw,36px) 64px;min-width:0;}
.scrim{display:none;}

/* headers, cards */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.ph h1{margin:0;font:650 24px/1.2 var(--body);letter-spacing:-.015em;}
.ph .sub{color:var(--tx2);margin-top:3px;}
.ph .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;}
.card > header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.card > header h2{margin:0;font:600 15px var(--body);}
.card > header .r{margin-left:auto;color:var(--tx3);font-size:12px;display:flex;gap:8px;align-items:center;}
.pad{padding:16px 18px;}
.stack{display:grid;gap:16px;}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
.status{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;}
.status i{width:6px;height:6px;border-radius:50%;background:currentColor;}
.s-ok{background:var(--ok-bg);color:var(--ok);} .s-red{background:var(--red-bg);color:var(--red);} .s-amber{background:var(--amber-bg);color:var(--amber);} .s-blue{background:var(--blue-bg);color:var(--blue);} .s-gray{background:var(--hover);color:var(--tx2);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--line2);background:var(--card);white-space:nowrap;transition:transform .12s ease,background-color .15s ease;}
.btn:active{transform:scale(.97);}
.btn.pri{background:var(--tx);color:var(--card);border-color:var(--tx);}
.btn.red{background:var(--red);color:#fff;border-color:var(--red);}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa);}
.btn.sm{height:30px;padding:0 10px;font-size:12px;}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--hover);}.btn.pri:hover{background:var(--tx);opacity:.9}.btn.red:hover{background:var(--red);opacity:.92}.btn.wa:hover{background:var(--wa);opacity:.92}}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0;}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);}
.kpi{padding:18px 20px;border-right:1px solid var(--line);}
.kpi:last-child{border-right:0;}
.kpi span{color:var(--tx2);font-size:13px;}
.kpi b{display:block;font:700 30px/1 var(--body);letter-spacing:-.02em;margin:10px 0 8px;font-variant-numeric:tabular-nums;}
.kpi small{font-size:12px;color:var(--tx3);}
.up{color:var(--ok);font-weight:700;} .down{color:var(--red);font-weight:700;}

/* recommended actions */
.recs{list-style:none;margin:0;padding:0;}
.rec{display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);}
.rec:last-child{border-bottom:0;}
.rec .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;}
.rec b{font-weight:650;}
.rec p{margin:2px 0 0;color:var(--tx2);font-size:13px;}
.rec.done{opacity:.5;} .rec.done b{text-decoration:line-through;}

/* charts */
.chart{padding:14px 18px 10px;position:relative;}
.chart svg{width:100%;height:auto;overflow:visible;}
.chart text{fill:var(--tx3);font:500 11px var(--body);}
.chart .gl{stroke:var(--line);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2);padding:0 18px 14px;}
.tip{position:absolute;pointer-events:none;background:var(--tx);color:var(--card);border-radius:8px;padding:7px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;z-index:5;}
.tip b{display:block;font-size:13px;}
.bars{display:grid;gap:14px;padding:16px 18px;}
.hb b{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px;gap:10px;}
.hb b em{font-style:normal;color:var(--tx2);font-weight:500;}
.trk{height:10px;border-radius:6px;background:var(--hover);overflow:hidden;display:flex;}
.trk i{display:block;height:100%;}

/* tables */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:12px;font-weight:600;color:var(--tx3);text-align:left;padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:0;}
.tbl .r{text-align:right;}
.scrollx{overflow-x:auto;}

/* pickup board */
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:200px;}
.col h3{margin:2px 4px 12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;color:var(--tx2);}
.tk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);}
.tk .t{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.tk .t b{font-size:15px;}
.tk ul{margin:8px 0;padding:0;list-style:none;font-size:13px;}
.tk li{display:flex;justify-content:space-between;gap:8px;padding:2px 0;}
.tk .m{font-size:12px;color:var(--tx2);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tk .a{display:flex;gap:8px;margin-top:10px;}
.tk .a .btn{flex:1;}
.late{color:var(--red);font-weight:700;}
.kmode .board{grid-template-columns:repeat(2,minmax(280px,1fr));}
.kmode .tk b{font-size:20px;} .kmode .tk ul{font-size:17px;font-weight:600;}

/* forms */
.form{display:grid;gap:12px;}
.form label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--tx2);}
.form > *,.f2 > *{min-width:0;}
.form input,.form select,.form textarea{width:100%;min-width:0;height:42px;border-radius:10px;border:1px solid var(--line2);background:var(--card);padding:0 12px;font-size:15px;}
.form textarea{height:110px;padding:10px 12px;resize:vertical;}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--red);}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.res{border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:10px;}
.big{font:700 26px var(--body);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}

/* stamp card */
.stamps{display:flex;gap:6px;}
.stamps i{width:18px;height:18px;border-radius:50%;border:2px dashed var(--line2);}
.stamps i.on{background:var(--yel);border:0;}
.stamps i.free{background:var(--red);border:0;}

.empty{padding:28px 18px;text-align:center;color:var(--tx3);}
.hint{font-size:12px;color:var(--tx3);}
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:grid;gap:8px;z-index:90;}
.toast{background:var(--tx);color:var(--card);padding:11px 16px;border-radius:10px;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.25);}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .25s var(--ease-out);} @keyframes tin{from{opacity:0;transform:translateY(8px)}}}

@media (max-width:1100px){.g2{grid-template-columns:1fr;}.g3{grid-template-columns:1fr;}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;}
  .topbar .menu{display:grid;}
  .side{position:fixed;left:0;top:60px;bottom:0;width:260px;z-index:40;transform:translateX(-102%);transition:transform .25s var(--ease-out);height:auto;}
  .side.open{transform:none;}
  .scrim.open{display:block;position:fixed;inset:60px 0 0;background:rgba(0,0,0,.3);z-index:35;}
  .kpis{grid-template-columns:1fr 1fr;}
  .kpi:nth-child(2){border-right:0;} .kpi:nth-child(-n+2){border-bottom:1px solid var(--line);}
  .brand .bt{display:none;}
  .topbar{gap:8px;padding:0 10px;}
  .seg{overflow-x:auto;max-width:calc(100vw - 150px);}
  .seg button{padding:0 9px;}
  .demo-b{display:none;}
  .board{grid-template-columns:repeat(4,minmax(240px,82vw));}
  .kmode .board{grid-template-columns:repeat(2,minmax(260px,86vw));}
  .f2{grid-template-columns:1fr;}
  .rec{grid-template-columns:38px 1fr;}
  .rec > div:last-child{grid-column:2;}
  .tbl th,.tbl td{padding:10px 12px;}
}
</style>
</head>

<script>
"use strict";
// ---------- real facts (from their own TikTok, Facebook and PedidosYa) ----------
const BR = [{id:"cab",n:"Barrio Cabañas",c:"--c3"},{id:"sat",n:"Colonia Satélite",c:"--c1"},{id:"med",n:"Barrio Medina",c:"--c2"}];
const MENU = [{n:"Pierna y tajadas",p:75,pz:1},{n:"Cadera y tajadas",p:85,pz:1},{n:"Ala y tajadas",p:95,pz:1},{n:"Pierna, cadera y tajadas",p:140,pz:2}];
const TIKTOKS = [ // title and views as shown on @cocochiken1
  {t:"¿Pollos A 15 lempiras?",v:871500,code:"POLLO15"},{t:"Video fijado en el local (con @LaYacuny)",v:933300,code:"YACUNY"},
  {t:"Gracias Por Su Cariño Gente De Choloma",v:169500,code:"CHOLOMA"},{t:"COCO CHICKEN DONDE",v:39100,code:"DONDE"},
  {t:"Al gordito sexy",v:8124,code:"GORDITO"},{t:"¿Ya pediste las tuyas?",v:2236,code:"TUYAS"}];
const HOURS = "Lunes a domingo, 9:00 am a 10:00 pm";

// ---------- deterministic demo data ----------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = a => a[Math.floor(rnd() * a.length)];
const L = n => "L" + Math.round(n).toLocaleString("en-US");
const PL = d => d.endsWith("s") ? d : d + "s";
const DAYS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const now = new Date(); const today = now.getDay();
const WK = [1.3,.8,.82,.9,.95,1.2,1.4]; // weekday demand
const BASE = {cab:46,sat:58,med:38};    // chickens per day, average
const PZ = 8;                            // pieces per chicken (setting)
const CH = ["Mostrador","PedidosYa","WhatsApp"];
const CHC = {Mostrador:"--c3",PedidosYa:"--c1",WhatsApp:"--wa"};
// 28 days of history per branch: chickens used and sales
const HIST = {};

}));

// till closings, last 7 days

function cajaTag(c) { return Math.abs(c.diff) < 30 ? `<span class="status s-ok"><i></i>Cuadró</span>` : c.diff < 0 ? `<span class="status s-red"><i></i>Faltan ${L(-c.diff)}</span>` : `<span class="status s-amber"><i></i>Sobran ${L(c.diff)}</span>`; }
function forecast(b) { const wd = (today + 1) % 7; const same = HIST[b].filter(h => h.wd === wd); const avg = same.reduce((a, h) => a + h.ch, 0) / same.length; return {wd, need: Math.ceil(avg * 1.05), avg}; }

function hourChart(s) {
  const W = 640, H = 220, pl = 36, pb = 24, bw = (W - pl) / HRS.length;
  const bs = SUC === "all" ? BR : BR.filter(b => b.id === SUC);
  const data = HRS.map(h => bs.map(b => s.filter(x => x.h === h && x.b === b.id).reduce((a, x) => a + x.total, 0)));
  const mx = Math.max(1000, ...data.map(d => d.reduce((a, x) => a + x, 0))); const step = Math.ceil(mx / 4 / 500) * 500;
  let g = ""; for (let i = 0; i <= 4; i++) { const y = H - pb - (H - pb - 10) * (i * step) / (step * 4); g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${i ? (i * step / 1000).toFixed(1) + "k" : 0}</text>`; }
  HRS.forEach((h, i) => { let y0 = H - pb; data[i].forEach((v, j) => { const hh = (H - pb - 10) * v / (step * 4); y0 -= hh; g += `<rect x="${pl + i * bw + bw * .18}" y="${y0}" width="${bw * .64}" height="${Math.max(0, hh)}" rx="2" fill="${col(bs[j].c)}" data-tip="${h}:00 · ${bs[j].n}|${L(v)}"/>`; });
    if (i % 2 === 0 || HRS.length < 8) g += `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${h > 12 ? h - 12 + "pm" : h + (h === 12 ? "pm" : "am")}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por hora">${g}</svg></div>`;
}

        <tbody>${bs.map(b => { const f = forecast(b.id); return `<tr><td>${b.n}</td><td class="r num">${f.avg.toFixed(0)}</td><td class="r num"><b>${f.need}</b></td></tr>`; }).join("")}
        <tr><td><b>Total</b></td><td></td><td class="r num"><b>${tot} pollos</b></td></tr></tbody></table>
        <div class="pad" style="border-top:1px solid var(--line)"><a class="btn wa" target="_blank" rel="noopener" href="${waLink(msg)}">${icon("i-wa")}Mandar pedido al proveedor</a></div></section>
      <section class="card"><header><h2>Insumos</h2><div class="r">en rojo: debajo del mínimo</div></header><div class="scrollx"><table class="tbl">
        <thead><tr><th>Insumo</th>${bs.map(b => `<th class="r">${b.n.split(" ").pop()}</th>`).join("")}</tr></thead>
        <tbody>${INS.map(([n, u, s, m]) => `<tr><td>${n}</td>${bs.map(b => `<td class="r num ${s[b.id] < m[b.id] ? "late" : ""}">${s[b.id]} ${u}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
    </div>
  </div>`;
}

function vVentas() {
  const bs = BR.filter(inB);
  const wk = bs.reduce((a, b) => a + HIST[b.id].slice(21).reduce((q, h) => q + h.ventas, 0), 0);
  const s = SALES.filter(inB); const tot = s.reduce((a, x) => a + x.total, 0) || 1;
  const byCh = CH.map(c => [c, s.filter(x => x.ch === c).reduce((a, x) => a + x.total, 0)]);
  const pyShare = byCh[1][1] / tot; const pyWeek = wk * pyShare; const comWeek = pyWeek * COMM / 100;
  const items = MENU.map(m => [m.n, s.filter(x => x.item === m.n).reduce((a, x) => a + x.qty, 0), s.filter(x => x.item === m.n).reduce((a, x) => a + x.total, 0)]).sort((a, b) => b[2] - a[2]);
  const mxI = Math.max(...items.map(i => i[2]));
  return `<div class="ph"><div><h1>Ventas y comisiones</h1><div class="sub">${scope()} · por canal, por producto y cuánto se va en comisión.</div></div></div>
  <div class="stack">
    <section class="card"><div class="kpis">
      <div class="kpi"><span>Ventas últimos 7 días</span><b class="num">${L(wk)}</b><small>${scope()}</small></div>
      <div class="kpi"><span>Por PedidosYa (estimado)</span><b class="num">${L(pyWeek)}</b><small>${Math.round(pyShare * 100)}% de las ventas</small></div>
      <div class="kpi"><span>Comisión pagada en 7 días</span><b class="num" style="color:var(--red)">${L(comWeek)}</b><small>al ${COMM}% · al mes ≈ ${L(comWeek * 4.3)}</small></div>
      <div class="kpi"><span>Si 1 de cada 4 pasa a recoger</span><b class="num" style="color:var(--ok)">${L(comWeek * .25 * 4.3)}</b><small>de ahorro al mes</small></div>
    </div></section>
    <div class="g2">
      <section class="card"><header><h2>Hoy por canal</h2></header><div class="bars">${byCh.map(([c, v]) => `<div class="hb"><b>${c}<em class="num">${L(v)} · ${Math.round(v / tot * 100)}%</em></b><div class="trk"><i style="width:${v / tot * 100}%;background:${col(CHC[c])}"></i></div></div>`).join("")}</div>
        <div class="pad form" style="border-top:1px solid var(--line)"><label>Comisión de PedidosYa según su contrato (%)<input id="com" inputmode="decimal" value="${COMM}"></label><p class="hint">No conocemos su comisión real; póngala aquí y todo el panel se recalcula.</p></div></section>
      <section class="card"><header><h2>Lo más vendido hoy</h2></header><div class="bars">${items.map(([n, q, v]) => `<div class="hb"><b>${n}<em class="num">${q} · ${L(v)}</em></b><div class="trk"><i style="width:${v / mxI * 100}%;background:var(--c1)"></i></div></div>`).join("")}</div></section>
    </div>
  </div>`;
}

function vClientes() {
  const cs = CLI.filter(inB);
  return `<div class="ph"><div><h1>Clientes y promos</h1><div class="sub">La tarjeta "Pagas 3, el 4 es gratis" vive en WhatsApp: cada compra suma un sello y cada cliente queda en su lista.</div></div></div>
  <div class="stack">
    <section class="card"><div class="kpis">
      <div class="kpi"><span>Clientes en la lista</span><b class="num">${TOTAL_CLI.toLocaleString("en-US")}</b><small>con número de WhatsApp</small></div>
      <div class="kpi"><span>A un sello del gratis</span><b class="num">${Math.round(TOTAL_CLI * .12)}</b><small>3 sellos</small></div>
      <div class="kpi"><span>No vuelven hace 2 semanas</span><b class="num">${Math.round(TOTAL_CLI * .31)}</b><small>buen público para una promo</small></div>
      <div class="kpi"><span>Pollos gratis canjeados</span><b class="num">74</b><small>este mes</small></div>
    </div></section>
    <div class="g2">
      <section class="card"><header><h2>Clientes</h2><div class="r">muestra</div></header><div class="scrollx"><table class="tbl">
        <thead><tr><th>Cliente</th><th>Sucursal</th><th>Tarjeta</th><th class="r">Compras</th><th class="r">Última</th></tr></thead>
        <tbody>${cs.map(c => `<tr><td>${c.n}</td><td>${bn(c.b)}</td><td><span class="stamps">${[0, 1, 2, 3].map(i => `<i class="${i < c.s ? "on" : ""}"></i>`).join("")}</span></td><td class="r num">${c.tot}</td><td class="r">${c.last ? "hace " + c.last + " d" : "hoy"}</td></tr>`).join("")}</tbody></table></div></section>
      <section class="card"><header><h2>Mandar una promo</h2></header><div class="pad form">
        <label>A quién<select id="pa"><option value="all">Todos (${TOTAL_CLI.toLocaleString("en-US")})</option><option value="dorm">No vuelven hace 2 semanas (${Math.round(TOTAL_CLI * .31)})</option><option value="near">A un sello del gratis (${Math.round(TOTAL_CLI * .12)})</option></select></label>
        <label>Mensaje<textarea id="pm">¡Hola! Esta semana en Coco Chicken: pagas 3, el 4 es gratis. Pide por aquí y pasa a recoger a tu sucursal. ¡Mmm qué sabroso! 🍗</textarea></label>
        <button class="btn red" id="psend">${icon("i-send")}Programar envío</button>
        <p class="hint">WhatsApp cobra cada mensaje de promoción; el panel muestra el costo antes de enviar. Solo se escribe a quien aceptó recibir promos.</p></div></section>
    </div>
  </div>`;
}

function vTiktok() {
  const ts = TIKTOKS.slice().sort((a, b) => b.ven - a.ven); const mx = ts[0].ven;
  return `<div class="ph"><div><h1>¿Qué video vendió?</h1><div class="sub">Cada video lleva su código ("di POLLO15 al pedir"). El bot lo anota y aquí se ve cuánto vendió cada uno.</div></div></div>
  <section class="card"><header><h2>Videos de @cocochiken1</h2><div class="r">vistas reales · pedidos de ejemplo</div></header><div class="scrollx"><table class="tbl">
    <thead><tr><th>Video</th><th>Código</th><th class="r">Vistas</th><th class="r">Pedidos</th><th style="min-width:160px">Ventas</th></tr></thead>
    <tbody>${ts.map(t => `<tr><td>${t.t}</td><td><span class="status s-gray">${t.code}</span></td><td class="r num">${t.v >= 1000 ? (t.v / 1000).toFixed(1) + "K" : t.v}</td><td class="r num">${t.ped}</td><td><div style="display:flex;gap:10px;align-items:center"><div class="trk" style="flex:1"><i style="width:${t.ven / mx * 100}%;background:var(--c1)"></i></div><span class="num">${L(t.ven)}</span></div></td></tr>`).join("")}</tbody></table></div></section>
  <p class="hint" style="margin-top:14px">Con esto se sabe qué tipo de video repetir: los de oferta de precio y los de inauguración pasan de 100 mil vistas; los del día a día quedan entre 600 y 10 mil.</p>`;
}

// ---------- render & events ----------
const VIEWS = {hoy: vHoy, recoger: vRecoger, caja: vCaja, pollo: vPollo, ventas: vVentas, clientes: vClientes, tiktok: vTiktok};
function render() { nav(); $("#main").innerHTML = VIEWS[VIEW](); if (VIEW === "caja") cajaCalc(); window.scrollTo(0, 0); }
function go(v) { if (!VIEWS[v]) return; VIEW = v; KMODE = false; history.replaceState(null, "", "#" + v); $("#side").classList.remove("open"); $("#scrim").classList.remove("open"); render(); }
document.addEventListener("click", e => {
  const v = e.target.closest("[data-v]"); if (v) { e.preventDefault(); go(v.dataset.v); return; }
  const s = e.target.closest("[data-s]"); if (s) { SUC = s.dataset.s; render(); return; }
  const d = e.target.closest("[data-done]"); if (d) { DONE.add(d.dataset.done); setTimeout(render, 300); }
  const m = e.target.closest("[data-mv]"); if (m) { const p = PICK.find(x => x.id === +m.dataset.mv); const nx = {nuevo: "cocina", cocina: "listo", listo: "entregado"}[p.st]; p.st = nx; p.min = 0;
    toast(nx === "listo" ? `#${p.id} listo. El bot le avisó a ${p.who.split(" ")[0]} (demo)` : nx === "cocina" ? `#${p.id} pasó a cocina` : `#${p.id} entregado`); render(); }
  if (e.target.closest("#kmode")) { KMODE = !KMODE; render(); }
  if (e.target.closest("#cok")) { if (!$("#cef").value) { toast("Escriba el efectivo contado"); return; } toast(`Cierre de ${bn($("#cb").value)} guardado (demo)`); $("#cef").value = ""; $("#cga").value = ""; cajaCalc(); }
  if (e.target.closest("#psend")) { const n = {all: TOTAL_CLI, dorm: Math.round(TOTAL_CLI * .31), near: Math.round(TOTAL_CLI * .12)}[$("#pa").value]; toast(`Promo programada para ${n.toLocaleString("en-US")} clientes (demo)`); }
  if (e.target.closest("#mbtn")) { $("#side").classList.toggle("open"); $("#scrim").classList.toggle("open"); }
  if (e.target.closest("#scrim")) { $("#side").classList.remove("open"); $("#scrim").classList.remove("open"); }
  if (e.target.closest("#tema")) { const dk = document.documentElement.dataset.theme === "dark"; if (dk) delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = "dark"; try { localStorage.setItem("ccp-tema", dk ? "light" : "dark"); } catch (er) {} }
});
document.addEventListener("input", e => {
  if (e.target.id === "cef" || e.target.id === "cga" || e.target.id === "cb") cajaCalc();
  if (e.target.id === "com") { const v = +e.target.value; if (v >= 0 && v <= 60) { COMM = v; try { localStorage.setItem("ccp-com", v); } catch (er) {} const pos = e.target.selectionStart; render(); const i = $("#com"); i.focus(); i.setSelectionRange(pos, pos); } }
});
document.addEventListener("change", e => { if (e.target.id === "cb") cajaCalc(); });
// chart tooltips
document.addEventListener("pointerover", e => { const r = e.target.closest("[data-tip]"); const old = document.querySelector(".tip"); if (old) old.remove(); if (!r) return;
  const ch = r.closest(".chart"); const bb = r.getBoundingClientRect(), cb = ch.getBoundingClientRect(); const [a, b] = r.dataset.tip.split("|");
  const t = document.createElement("div"); t.className = "tip"; t.innerHTML = `<b>${b}</b>${a}`; t.style.left = (bb.left + bb.width / 2 - cb.left) + "px"; t.style.top = (bb.top - cb.top) + "px"; ch.append(t); });
const h0 = location.hash.slice(1); if (VIEWS[h0]) VIEW = h0;
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== VIEW) go(h); });
render();
</script>
</body>
</html>
