<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel del restaurante</title>
<style>
/* Panel del restaurante, estilo Lightning (Salesforce): cabecera blanca, banda azul, tarjetas de 4px, íconos en mosaico */
:root{--bg:#F3F3F3;--band:#B0C4DF;--card:#fff;--line:#E5E5E5;--line2:#C9C9C9;--tx:#181818;--tx2:#444;--tx3:#706E6B;--brand:#0176D3;--brand-d:#014486;--sel:#EEF4FF;--hover:#F3F3F3;--acc:#0176D3;
  --ok:#2E844A;--ok-bg:#CDEFC4;--warn:#8C4B02;--warn-bg:#FEF1CD;--info:#0176D3;--info-bg:#EEF4FF;--red:#BA0517;--red-bg:#FEDED8;--mute-bg:#F3F3F3;--sh:0 2px 2px 0 rgba(0,0,0,.1);color-scheme:light}
:root[data-theme="dark"]{--bg:#1B1B1B;--band:#16325C;--card:#242424;--line:#3A3A3A;--line2:#4A4A4A;--tx:#F3F3F3;--tx2:#C9C9C9;--tx3:#A0A0A0;--brand:#1B96FF;--brand-d:#78B0FD;--sel:#0B2A4E;--hover:#2E2E2E;
  --ok:#45C65A;--ok-bg:#163A1F;--warn:#FFBA45;--warn-bg:#3D2A06;--info:#1B96FF;--info-bg:#0B2A4E;--red:#FE5C4C;--red-bg:#4A1410;--mute-bg:#2B2B2B;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}
svg{display:block}
:focus-visible{outline:0;box-shadow:0 0 3px var(--brand);border-radius:4px}
/* cabecera */
.gh{position:sticky;top:0;z-index:20;background:var(--card);box-shadow:0 2px 3px rgba(0,0,0,.08)}
.gh-top{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px}
.marca{display:flex;align-items:center;gap:10px;min-width:0}.marca .logo{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;background:var(--marca,#032D60);flex:none}
.marca b{display:block;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.marca small{display:block;font-size:12px;color:var(--tx3);line-height:1.2}
.sp{flex:1}
.iconbtn{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;color:var(--tx3);border:1px solid transparent;background:none}
.avatar{border:0;cursor:pointer;font-family:inherit;width:32px;height:32px;border-radius:50%;background:#032D60;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.gh-nav{display:flex;align-items:stretch;height:40px;padding:0 16px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.gh-nav::-webkit-scrollbar{display:none}
.gh-nav .nav{display:flex;align-items:center;gap:6px;border:0;border-top:3px solid transparent;border-bottom:3px solid transparent;background:none;padding:0 14px;white-space:nowrap;color:var(--tx2)}
.gh-nav .nav[aria-current="page"]{border-bottom-color:var(--brand);color:var(--tx);font-weight:700;background:var(--sel)}
.nav .n{min-width:18px;height:16px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;line-height:16px}.nav .n:empty{display:none}
.band{position:absolute;left:0;right:0;top:92px;height:150px;background:var(--band);z-index:-1}
main{position:relative;padding:12px 12px 64px;max-width:1500px;margin:0 auto}
/* encabezado de página, como un registro */
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.tile{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;color:#fff;flex:none;background:var(--brand)}.tile svg{width:22px;height:22px}
.ey{font-size:12px;color:var(--tx3);line-height:1.2}
h1{margin:0;font-size:18px;font-weight:700;line-height:1.25}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.btn{height:32px;border:1px solid var(--line2);background:var(--card);border-radius:4px;padding:0 12px;color:var(--tx);font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--brand);text-decoration:none;white-space:nowrap}.btn:active{background:var(--hover)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--hover)}.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d)}.gh-nav .nav:hover{background:var(--hover);color:var(--tx)}.iconbtn:hover{border-color:var(--line2);color:var(--brand)}}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.vivo{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:6px;white-space:nowrap}.vivo i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}.vivo.off i{background:var(--warn)}
/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--sh);min-width:0}
.card h2{display:flex;align-items:center;gap:10px;font-size:14px;margin:0;padding:12px 16px;font-weight:700;border-bottom:1px solid var(--line)}
.ct{width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:#fff;flex:none}.ct svg{width:14px;height:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{padding:12px 16px;display:flex;flex-direction:column-reverse;gap:2px;border-top:3px solid var(--brand)}
.kpi b{display:block;font-size:24px;font-weight:300;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2}.kpi span{font-size:12px;color:var(--tx3)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:8px 16px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--tx3);font-weight:700;background:var(--mute-bg);text-transform:none}tr:last-child td{border-bottom:0}td.r,th.r{text-align:right}
@media (hover:hover) and (pointer:fine){tr:hover td{background:var(--hover)}}
.vacio{padding:28px 16px;text-align:center;color:var(--tx3)}
.frase{padding:14px 16px;margin-bottom:12px;font-size:16px;line-height:1.5}
.cupos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:12px}.cupos h2 small{font-weight:400;color:var(--tx3);margin-left:auto;font-size:12px}
.tnd{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}.tnd:first-of-type{border-top:0}.tnd i{height:8px;border-radius:4px;background:var(--mute-bg);overflow:hidden}.tnd i b{display:block;height:100%;background:var(--brand)}.tnd.lleno i b{background:var(--tx3)}.tnd span{color:var(--tx2)}
/* tablero de pedidos */
.board{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--sh);padding:0 8px 8px}
.col h3{font-size:13px;font-weight:700;color:var(--tx);margin:0 -8px 8px;padding:10px 12px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--mute-bg);border-radius:4px 4px 0 0}.col h3 span{color:var(--tx3);font-weight:400}
.col .card{box-shadow:none}
.ped{padding:10px 12px;margin-bottom:8px;display:grid;gap:6px}
.ped .l1{display:flex;justify-content:space-between;gap:8px;font-weight:700;color:var(--brand)}.ped .l1 span{color:var(--tx3);font-weight:400;font-size:12px;white-space:nowrap}
.ped ul{margin:0;padding:0;list-style:none;color:var(--tx2)}.ped li{overflow-wrap:anywhere}
.ped .l3{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--tx2);flex-wrap:wrap}
.ped .acc{display:flex;gap:6px;flex-wrap:wrap}.ped .acc .btn{height:28px;padding:0 10px;font-size:12px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:15px;font-size:12px;white-space:nowrap;background:var(--mute-bg);color:var(--tx2)}
.t-nuevo{background:var(--info-bg);color:var(--info)}.t-cocina,.t-por_pagar,.t-por_confirmar,.t-en_espera{background:var(--warn-bg);color:var(--warn)}.t-listo,.t-comp,.t-confirmada{background:var(--ok-bg);color:var(--ok)}.t-entregado,.t-atendido,.t-cancelado,.t-no_vino,.t-sin_cupo{background:var(--mute-bg);color:var(--tx3)}
.ped .aviso{font-size:12px;color:var(--red);font-weight:700}
/* cocina */
.cocina{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cocina .ped{font-size:16px;padding:16px}.cocina .ped ul{color:var(--tx);font-size:17px;font-weight:600}.cocina .ped .l1{font-size:18px;color:var(--tx)}
.cocina .ped.nuevo{border-left:4px solid var(--info)}.cocina .ped.cocina-e{border-left:4px solid var(--warn)}
.cocina .btn{height:44px;font-size:15px;flex:1}
.wa{color:var(--brand);font-weight:700;text-decoration:none}
.fila{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}.fila:last-child{border-bottom:0}.fila div{flex:1;min-width:0}.fila small{display:block;color:var(--tx3)}.fila b{color:var(--brand)}
.ayuda{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:4px;padding:8px 12px;margin:0 0 12px;color:var(--tx2);font-size:12px;box-shadow:var(--sh)}
/* esqueleto mientras carga: nunca una pantalla en blanco */
.sk{background:linear-gradient(90deg,var(--mute-bg) 25%,var(--hover) 50%,var(--mute-bg) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:4px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.tabs{display:none}
.grid-seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px}.solo-cel{display:none}
@media (max-width:900px){
  .gh-nav{display:none}.band{top:52px;height:110px}main{padding:12px 12px 96px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.board{grid-template-columns:1fr}
  .vivo{display:none}.kpi span{min-height:3em}
  .tabs{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -2px 3px rgba(0,0,0,.06)}
  .tabs .nav{display:flex;align-items:center;justify-content:center;gap:3px;border:0;background:none;font-size:12px;padding:10px 2px;white-space:nowrap;color:var(--tx2);border-radius:4px}
  .tabs .nav[aria-current="page"]{color:var(--brand);font-weight:700;background:var(--sel)}
  th,td{padding:8px 12px}
  .fila.res{flex-wrap:wrap}.fila.res div{flex-basis:100%}
  .grid-seg{grid-template-columns:1fr}.solo-pc{display:none}.solo-cel{display:block}
}
</style>
</head>
<body>
<header class="gh">
  <div class="gh-top">
    <div class="marca"><span class="logo" id="logo"></span><div><b id="marca">Panel</b><small id="sub">Casa Digital</small></div></div>
    <span class="sp"></span>
    <span class="vivo" id="vivo"><i></i>Actualizado</span>
    <button class="iconbtn" id="tema" aria-label="Cambiar tema" title="Cambiar tema"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="avatar" id="quien" title="" aria-label="Seguridad y acceso"></button>
    <a class="btn sm" href="/panel/salir">Salir</a>
  </div>
  <nav class="gh-nav" id="nav1"></nav>
</header>
<div class="band"></div>
<main>
  <div class="ph"><span class="tile" id="tile"></span><div><div class="ey" id="ey">Panel</div><h1 id="titulo">Hoy</h1></div>
    <div class="r"><select id="suc" aria-label="Sucursal"><option value="">Todas las sucursales</option></select></div></div>
  <div id="vista"><div class="kpis"><div class="card kpi"><div class="sk" style="height:12px;width:60%"></div><div class="sk" style="height:26px;width:40%;margin-bottom:4px"></div></div><div class="card kpi"><div class="sk" style="height:12px;width:60%"></div><div class="sk" style="height:26px;width:40%;margin-bottom:4px"></div></div><div class="card kpi"><div class="sk" style="height:12px;width:60%"></div><div class="sk" style="height:26px;width:40%;margin-bottom:4px"></div></div><div class="card kpi"><div class="sk" style="height:12px;width:60%"></div><div class="sk" style="height:26px;width:40%;margin-bottom:4px"></div></div></div><div class="grid2"><div class="card"><div class="sk" style="height:180px;margin:12px"></div></div><div class="card"><div class="sk" style="height:180px;margin:12px"></div></div></div></div>
</main>
<nav class="tabs" id="nav2"></nav>
<script>
const VISTAS = [["hoy", "Hoy"], ["pedidos", "Pedidos"], ["cocina", "Cocina"], ["personas", "Por atender"], ["menu", "Menú"]];
const CORTO = { personas: "Atender", reservas: "Mesas" };
// Seguridad va arriba en la compu; en el celular se abre tocando las iniciales
const EXTRA = [["seguridad", "Seguridad"]];
const todas = () => VISTAS.concat(EXTRA);
// íconos en mosaico, como Lightning: [trazo SVG, color]
const ICONO = {
  hoy: ["M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z", "#0176D3"], cupos: ["M4 5h16v15H4zM4 9h16M8 3v4M16 3v4", "#FE9339"],
  pedidos: ["M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6", "#3BA755"], cocina: ["M6 8h12l-1 12H7zM9 8V6a3 3 0 0 1 6 0v2", "#BA0517"],
  personas: ["M4 5h16v11H8l-4 4z", "#7526E3"], menu: ["M5 4h14v16H5zM9 8h6M9 12h6M9 16h4", "#0B827C"], reservas: ["M4 10h16M6 10v9M18 10v9M8 6h8", "#032D60"],
  ventas: ["M4 20V10M10 20V4M16 20v-7M22 20H2", "#0B827C"], seguridad: ["M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4", "#032D60"],
  llave: ["M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4", "#032D60"], actividad: ["M3 12h4l3-8 4 16 3-8h4", "#0176D3"], espera: ["M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z", "#FE9339"],
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONO[k][0]}"/></svg>`;
const H = (t, k, r = "") => `<h2><span class="ct" style="background:${ICONO[k][1]}">${svg(k)}</span>${t}${r}</h2>`;
const ESTADO_TXT = { por_pagar: "Por pagar", nuevo: "Nuevo", cocina: "En cocina", listo: "Listo", entregado: "Entregado", no_vino: "No vino", cancelado: "Cancelado", atendido: "Atendido", por_confirmar: "Por confirmar", confirmada: "Confirmada", sin_cupo: "Sin cupo", en_espera: "Lista de espera" };
let N = null, P = [], vista = "hoy", vistos = null, sonido = false;
// tema claro u oscuro: el que eligió, o el del celular
const ponerTema = t => document.documentElement.setAttribute("data-theme", t);
try { ponerTema(localStorage.getItem("tema") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")); } catch { ponerTema("light"); }
document.getElementById("tema").onclick = () => { const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"; ponerTema(t); try { localStorage.setItem("tema", t); } catch {} };
try { vista = localStorage.getItem("vista") || "hoy"; } catch {}


const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MONEDAS = { HNL: ["L ", "es-HN", 0], GTQ: ["Q", "es-GT", 0], USD: ["$", "en-US", 2] };
const L = n => { const [s, loc, min] = MONEDAS[(N && N.moneda) || "HNL"] || MONEDAS.HNL; return s + (+n || 0).toLocaleString(loc, { minimumFractionDigits: min, maximumFractionDigits: 2 }); };
const hora = iso => new Date(iso).toLocaleTimeString("es-HN", { hour: "numeric", minute: "2-digit", timeZone: "America/Tegucigalpa" });
const dia = iso => new Date(iso).toLocaleDateString("en-CA", { timeZone: "America/Tegucigalpa" });
const hoy = () => dia(new Date().toISOString());
const hace = iso => { const m = Math.round((Date.now() - new Date(iso)) / 6e4); return m < 1 ? "ahora" : m < 60 ? `hace ${m} min` : `hace ${Math.floor(m / 60)} h ${m % 60} min`; };
const wa = tel => `https://wa.me/${String(tel).replace(/\D/g, "")}`;

function filtrados() { const s = $("#suc").value; return P.filter(p => !s || p.sucursalId === s || p.sucursal === (N.sucursales.find(x => x.id === s) || {}).nombre); }
const pedidos = () => filtrados().filter(p => p.tipo === "pedido");

function nav() {
  const pend = pedidos().filter(p => p.estado === "nuevo").length, per = filtrados().filter(p => p.tipo === "persona" && p.estado === "nuevo").length;
  const comp = pedidos().filter(p => p.estado === "por_pagar" && p.comprobante).length;
  const res = filtrados().filter(p => p.tipo === "reservacion" && p.estado === "por_confirmar").length;
  const cuenta = { pedidos: comp || "", cocina: pend || "", personas: per || "", reservas: res || "", cupos: pedidos().filter(p => p.estado === "en_espera").length || "" };
  const html = corto => (corto ? VISTAS : todas()).map(([k, t]) => `<button class="nav" data-v="${k}" ${k === vista ? 'aria-current="page"' : ""}>${corto ? CORTO[k] || t : t}<span class="n">${cuenta[k] || ""}</span></button>`).join("");
  $("#nav1").innerHTML = html(); $("#nav2").innerHTML = html(true); $("#nav2").style.setProperty("--n", VISTAS.length);
  document.querySelectorAll(".nav[data-v]").forEach(b => b.onclick = () => { vista = b.dataset.v; try { localStorage.setItem("vista", vista); } catch {} pintar(); });
}

function tarjeta(p, grande) {
  const sig = { por_pagar: [["nuevo", "Pago recibido"]], nuevo: [["cocina", "A cocina"]], cocina: [["listo", "Listo"]], listo: [["entregado", "Entregado"]] }[p.estado] || [];
  const extra = { por_pagar: [["cancelado", "Cancelar"]], nuevo: [["cancelado", "Cancelar"]], listo: [["no_vino", "No vino"]] }[p.estado] || [];
  return `<div class="card ped ${grande ? (p.estado === "cocina" ? "cocina-e" : p.estado) : ""}">
    <div class="l1">${esc(p.n)} · ${esc(p.nombre || "Sin nombre")}<span>${hora(p.fecha)} · ${hace(p.fecha)}</span></div>
    ${p.faltas ? `<div class="aviso">⚠️ No vino a recoger ${p.faltas === 1 ? "1 vez" : p.faltas + " veces"} antes</div>` : ""}
    ${p.estado === "por_pagar" ? `<div>${p.comprobante ? `<span class="tag t-comp">Comprobante recibido ${hace(p.t_comprobante)}</span> <small>Revise la cuenta antes de confirmar.</small>` : `<span class="tag t-por_pagar">Esperando el pago</span>${p.pagoLink ? ` <small>Link de tarjeta enviado: si paga, entra solo a cocina.</small>` : ""}`}</div>` : p.pagado ? `<div><span class="tag t-comp">${p.metodoPago === "tarjeta" ? "Pagado con tarjeta" : "Pagado"}</span></div>` : ""}
    ${p.tanda ? `<div><span class="tag t-por_confirmar">📅 ${esc(p.dia)} · ${esc(p.tanda)} · ${p.cupos} ${p.cupos === 1 ? "cupo" : "cupos"}</span></div>` : ""}
    <ul>${(p.lineas || []).map(l => `<li>${l.cantidad} × ${esc(l.nombre)}${l.nota ? ` <em>(${esc(l.nota)})</em>` : ""}</li>`).join("")}</ul>
    <div class="l3"><span>${grande ? "" : `<span class="tag t-${p.estado}">${ESTADO_TXT[p.estado]}</span> `}<b>${L(p.total)}</b> · ${esc(p.sucursal)}</span><span>${p.entrega === "domicilio" ? `🛵 ${esc(p.direccion)}` : `Recoge: ${esc(p.hora || "—")}`}</span></div>
    <div class="acc">${sig.concat(extra).map(([e, t], i) => `<button class="btn ${i === 0 ? "pri" : ""}" data-n="${esc(p.n)}" data-e="${e}">${t}</button>`).join("")}${grande ? "" : `<a class="btn" href="${wa(p.tel)}" target="_blank" rel="noopener">WhatsApp</a>`}</div>
  </div>`;
}

function pintar() {
  if (!N) return;
  nav();
  $("#titulo").textContent = todas().find(v => v[0] === vista)[1];
  $("#tile").innerHTML = svg(vista); $("#tile").style.background = ICONO[vista][1];
  const v = $("#vista");
  const ps = pedidos();
  if (vista === "hoy") {
    const h = ps.filter(p => dia(p.fecha) === hoy() && !["cancelado", "por_pagar", "no_vino", "en_espera"].includes(p.estado));
    const total = h.reduce((a, p) => a + p.total, 0);
    const porSuc = N.sucursales.map(s => { const x = h.filter(p => p.sucursal === s.nombre); return [s.nombre, x.length, x.reduce((a, p) => a + p.total, 0)]; });
    const prod = {}; h.forEach(p => (p.lineas || []).forEach(l => { prod[l.nombre] = prod[l.nombre] || [0, 0]; prod[l.nombre][0] += l.cantidad; prod[l.nombre][1] += l.subtotal; }));
    const top = Object.entries(prod).sort((a, b) => b[1][0] - a[1][0]).slice(0, 6);
    const espera = filtrados().filter(p => p.tipo === "persona" && p.estado === "nuevo").length;
    const prep = ps.filter(p => p.estado === "nuevo" || p.estado === "cocina").length;
    const libres = N.cupos ? N.cupos.dias.filter(d => d.abierto).slice(0, 2).map(d => { const u = ps.reduce((a, p) => a + (p.diaFecha === d.fecha && !["cancelado", "en_espera"].includes(p.estado) ? p.cupos || 0 : 0), 0); return `${esc(d.etiqueta)} quedan <b>${N.cupos.tandas.length * N.cupos.porTanda - u} cupos</b>`; }) : [];
    v.innerHTML = `<div class="card frase">Hoy van <b>${h.length} ${h.length === 1 ? "pedido" : "pedidos"}</b> por WhatsApp (${L(total)})${prep ? ` y hay <b>${prep}</b> por preparar` : ""}.${espera ? ` <b>${espera}</b> ${espera === 1 ? "cliente quiere" : "clientes quieren"} hablar con una persona.` : ""}${libres.length ? ` Para ${libres.join(" y para ")}.` : ""}</div>
      <div class="kpis">
      <div class="card kpi"><b>${h.length}</b><span>Pedidos por WhatsApp hoy</span></div>
      <div class="card kpi"><b>${L(total)}</b><span>Vendido por WhatsApp hoy</span></div>
      <div class="card kpi"><b>${ps.filter(p => p.estado === "nuevo" || p.estado === "cocina").length}</b><span>En preparación</span></div>
      <div class="card kpi"><b>${espera}</b><span>Clientes esperando a una persona</span></div></div>
      <div class="grid2">
        <div class="card">${H("Lo más pedido hoy", "ventas")}${top.length ? `<table><tr><th>Producto</th><th class="r">Cantidad</th><th class="r">Venta</th></tr>${top.map(([n, [c, s]]) => `<tr><td>${esc(n)}</td><td class="r">${c}</td><td class="r">${L(s)}</td></tr>`).join("")}</table>` : `<div class="vacio">Todavía no hay pedidos hoy.</div>`}</div>
        ${N.sucursales.length > 1 ? `<div class="card">${H("Por sucursal", "hoy")}<table><tr><th>Sucursal</th><th class="r">Pedidos</th><th class="r">Venta</th></tr>${porSuc.map(([n, c, s]) => `<tr><td>${esc(n)}</td><td class="r">${c}</td><td class="r">${L(s)}</td></tr>`).join("")}</table></div>`
          : `<div class="card">${H("Pedidos por estado", "pedidos")}<table><tr><th>Estado</th><th class="r">Pedidos</th></tr>${["por_pagar", "nuevo", "cocina", "listo", "en_espera"].map(e => [e, ps.filter(p => p.estado === e).length]).filter(([e, c]) => c || e !== "por_pagar" && e !== "en_espera").map(([e, c]) => `<tr><td><span class="tag t-${e}">${ESTADO_TXT[e]}</span></td><td class="r">${c}</td></tr>`).join("")}</table></div>`}
      </div>`;
  } else if (vista === "pedidos") {
    const cols = [["nuevo", "Nuevos"], ["cocina", "En cocina"], ["listo", "Listos para recoger"], ["entregado", "Entregados hoy"]];
    if (N.cobro || ps.some(p => p.estado === "por_pagar")) cols.unshift(["por_pagar", "Esperando pago"]);
    v.innerHTML = `${cols[0][0] === "por_pagar" ? `<p class="ayuda">Los pedidos que se pagan antes esperan aquí y no salen en cocina. Cuando llegue el comprobante, revise que el dinero esté en la cuenta y toque <b>Pago recibido</b>. Si alguien no llega por su pedido, toque <b>No vino</b>: la próxima vez ese número paga antes.</p>` : ""}<div class="board" style="--cols:${cols.length}">${cols.map(([e, t]) => { const x = ps.filter(p => p.estado === e && (e !== "entregado" || dia(p.fecha) === hoy())); return `<div class="col"><h3>${t}<span>${x.length}</span></h3>${x.map(p => tarjeta(p)).join("") || `<div class="card vacio">Nada aquí</div>`}</div>`; }).join("")}</div>`;
  } else if (vista === "cocina") {
    // with cupos the kitchen sees today's batches only, in batch order; orders for later days wait in Pedidos
    const orden = p => (p.diaFecha || "") + String(N.cupos ? N.cupos.tandas.indexOf(p.tanda) + 10 : "") + p.fecha;
    const x = ps.filter(p => (p.estado === "nuevo" || p.estado === "cocina") && (!p.diaFecha || p.diaFecha <= hoy())).sort((a, b) => orden(a) < orden(b) ? -1 : 1);
    v.innerHTML = `<p class="ayuda">Pantalla para la cocina: déjela abierta en una tablet. Al marcar <b>Listo</b>, al cliente le llega un WhatsApp para que pase a recoger. <button class="btn" id="son" style="height:28px;margin-left:6px">${sonido ? "🔔 Sonido activado" : "🔕 Activar sonido"}</button></p>
      <div class="cocina">${x.map(p => tarjeta(p, true)).join("") || `<div class="card vacio" style="grid-column:1/-1">No hay pedidos pendientes.</div>`}</div>`;
    $("#son").onclick = () => { sonido = !sonido; if (sonido) beep(); pintar(); };
  } else if (vista === "cupos") {
    const C = N.cupos, espera = ps.filter(p => p.estado === "en_espera");
    v.innerHTML = `<p class="ayuda">Cupos apartados por WhatsApp en cada tanda (${C.porTanda} por tanda). Cuando una tanda se llena, el bot ofrece otra hora, otro día o la lista de espera. Un pedido cancelado libera sus cupos.</p>
      <div class="cupos">${C.dias.map(d => `<div class="card"><h2><span class="ct" style="background:${ICONO.cupos[1]}">${svg("cupos")}</span>${esc(d.etiqueta.replace(/^\p{L}/u, c => c.toUpperCase()))}<small>${d.abierto ? "abierto" : d.fecha <= hoy() ? "hoy" : "cerrado"}</small></h2>${C.tandas.map((t, i) => { const u = ps.reduce((a, p) => a + (p.diaFecha === d.fecha && p.tanda === t && !["cancelado", "en_espera"].includes(p.estado) ? p.cupos || 0 : 0), 0); return `<div class="tnd ${u >= C.porTanda ? "lleno" : ""}"><b>${esc(t)}</b><i><b style="width:${Math.min(100, Math.round(u / C.porTanda * 100))}%"></b></i><span>${u >= C.porTanda ? "Llena" : `${u} de ${C.porTanda}`}</span></div>`; }).join("")}</div>`).join("") || `<div class="card vacio">No hay días por delante.</div>`}</div>
      <div class="card">${H("Lista de espera", "espera")}${espera.map(p => `<div class="fila"><div><b>${esc(p.n)} · ${esc(p.nombre || "Sin nombre")}</b><small>${p.cupos} ${p.cupos === 1 ? "cupo" : "cupos"} para ${esc(p.dia)} · ${esc(p.resumen)} · ${hace(p.fecha)}</small></div><a class="btn pri" href="${wa(p.tel)}" target="_blank" rel="noopener">Escribirle</a><button class="btn" data-n="${esc(p.n)}" data-e="cancelado">Quitar</button></div>`).join("") || `<div class="vacio">Nadie en lista de espera.</div>`}</div>`;
  } else if (vista === "reservas") {
    const x = filtrados().filter(p => p.tipo === "reservacion").slice(0, 150);
    const pend = x.filter(p => p.estado === "por_confirmar"), resto = x.filter(p => p.estado !== "por_confirmar");
    const fila = p => `<div class="fila res"><div><b>${esc(p.n)} · ${esc(p.nombre || "Sin nombre")}</b>${p.grupo ? ` <span class="tag t-por_pagar">Grupo</span>` : ""}<small>📅 ${esc(p.dia)}, ${esc(p.hora)} · 👥 ${p.personas}${p.ocasion ? ` · 🎉 ${esc(p.ocasion)}` : ""}${N.sucursales.length > 1 ? ` · ${esc(p.sucursal)}` : ""} · pedida ${hace(p.fecha)}</small></div>
      ${p.estado === "por_confirmar" ? `<button class="btn pri" data-n="${esc(p.n)}" data-e="confirmada">Confirmar</button><button class="btn" data-n="${esc(p.n)}" data-e="sin_cupo">Sin cupo</button>` : `<span class="tag t-${p.estado}">${ESTADO_TXT[p.estado] || esc(p.estado)}</span>`}<a class="btn" href="${wa(p.tel)}" target="_blank" rel="noopener">WhatsApp</a></div>`;
    v.innerHTML = `<p class="ayuda">Mesas que pidieron por WhatsApp. Al tocar <b>Confirmar</b> o <b>Sin cupo</b>, al cliente le llega el aviso por WhatsApp.</p>
      <div class="card" style="margin-bottom:12px">${H("Por confirmar", "reservas")}${pend.map(fila).join("") || `<div class="vacio">No hay mesas por confirmar.</div>`}</div>
      ${resto.length ? `<div class="card">${H("Ya respondidas", "reservas")}${resto.map(fila).join("")}</div>` : ""}`;
  } else if (vista === "personas") {
    const x = filtrados().filter(p => p.tipo === "persona").slice(0, 100);
    v.innerHTML = `<p class="ayuda">Clientes que pidieron hablar con una persona. Escríbales desde el WhatsApp del negocio y márquelos como atendidos.</p>
      <div class="card">${x.map(p => `<div class="fila"><div><a class="wa" href="${wa(p.tel)}" target="_blank" rel="noopener">${esc(p.tel)}</a><small>${esc(p.motivo || "Pidió hablar con una persona")} · ${esc(p.sucursal)} · ${hace(p.fecha)}</small></div>${p.estado === "nuevo" ? `<button class="btn" data-n="${esc(p.n)}" data-e="atendido">Atendido</button>` : `<span class="tag t-atendido">Atendido</span>`}</div>`).join("") || `<div class="vacio">Nadie está esperando.</div>`}</div>`;
  } else if (vista === "seguridad") {
    pintarSeguridad(v);
  } else {
    const cats = [...new Set(N.menu.map(i => i.categoria))];
    v.innerHTML = `<p class="ayuda">Esto es lo que el bot ofrece y cobra. Para cambiar un precio o agregar un producto, avísele a Casa Digital y queda actualizado el mismo día.</p>
      <div class="card"><table><tr><th>#</th><th>Producto</th><th>Categoría</th><th class="r">Precio</th></tr>${cats.map(c => N.menu.filter(i => i.categoria === c).map(i => `<tr><td>${N.menu.indexOf(i) + 1}</td><td>${esc(i.nombre)}</td><td>${esc(c)}</td><td class="r">${L(i.precio)}</td></tr>`).join("")).join("")}</table></div>`;
  }
  v.querySelectorAll("button[data-e]").forEach(b => b.onclick = () => cambiar(b.dataset.n, b.dataset.e, b));
}

// ---- Seguridad: cómo está protegido el panel, quién tiene acceso y quién hizo qué ----
let S = null, sCargando = false;
const EVENTO = { entro: "Entró al panel", fallo: "Contraseña equivocada", bloqueado: "Bloqueado 15 min por intentos", codigo_enviado: "Código enviado por WhatsApp", codigo_malo: "Código equivocado", codigo_no_salio: "El código no salió", salio: "Salió del panel", estado: "Cambió un pedido" };
const MALOS = ["fallo", "bloqueado", "codigo_malo"];
const fechaHora = iso => new Date(iso).toLocaleString("es-HN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit", timeZone: "America/Tegucigalpa" });
const equipoCorto = ua => /iPhone|iPad/.test(ua) ? "iPhone" : /Android/.test(ua) ? "Android" : /Mac OS/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : /Linux/.test(ua) ? "Linux" : ua ? "Otro" : "";
const desde = e => [equipoCorto(e.equipo), e.ip].filter(Boolean).map(esc).join(" · ");
async function cargarSeguridad() {
  if (sCargando) return; sCargando = true;
  try { const r = await fetch("/api/seguridad", { cache: "no-store" }); if (r.status === 401) return location.href = "/panel/entrar"; if (r.ok) S = await r.json(); }
  catch {} finally { sCargando = false; }
  if (vista === "seguridad") pintar();
}
function pintarSeguridad(v) {
  if (!S) {
    v.innerHTML = `<div class="kpis">${'<div class="card kpi"><div class="sk" style="height:12px;width:60%"></div><div class="sk" style="height:26px;width:40%;margin-bottom:4px"></div></div>'.repeat(4)}</div><div class="card"><div class="sk" style="height:220px;margin:12px"></div></div>`;
    return cargarSeguridad();
  }
  const semana = Date.now() - 7 * 864e5;
  const malos = S.eventos.filter(e => MALOS.includes(e.evento) && new Date(e.en) > semana).length;
  const que = e => e.evento === "estado" ? `${esc(e.pedido)}: <span class="tag t-${esc(e.de)}">${ESTADO_TXT[e.de] || esc(e.de)}</span> → <span class="tag t-${esc(e.a)}">${ESTADO_TXT[e.a] || esc(e.a)}</span>` : `${MALOS.includes(e.evento) ? `<b style="color:var(--red)">${EVENTO[e.evento]}</b>` : EVENTO[e.evento] || esc(e.evento)}${e.como ? ` <small style="color:var(--tx3)">(${esc(e.como)})</small>` : ""}`;
  v.innerHTML = `<p class="ayuda">Así está protegido el panel. Solo entran los correos de abajo; cada entrada, intento fallido y cambio de pedido queda anotado aquí con la hora y el equipo.</p>
    <div class="kpis">
      <div class="card kpi"><b>${S.cifrado ? "AES-256" : "No"}</b><span>${S.cifrado ? "Datos de clientes cifrados en el servidor" : S.disco ? "Datos sin cifrar: falta la llave" : "Datos solo en memoria"}</span></div>
      <div class="card kpi"><b>${S.dosPasos && S.usuarios.every(u => u.whatsapp) ? "2 pasos" : S.dosPasos ? "Mixto" : "Contraseña"}</b><span>${S.dosPasos ? "Contraseña + código por WhatsApp" : "Entrada solo con contraseña"}</span></div>
      <div class="card kpi"><b>${S.sesionHoras} h</b><span>La sesión se cierra sola</span></div>
      <div class="card kpi" style="${malos ? "border-top-color:var(--red)" : ""}"><b>${malos}</b><span>Intentos fallidos en 7 días</span></div></div>
    <div class="grid-seg">
      <div class="card">${H("Quién tiene acceso", "llave")}<table><tr><th>Persona</th><th>Código a</th></tr>${S.usuarios.map(u => `<tr><td>${esc(u.nombre)}<small style="display:block;color:var(--tx3)">${esc(u.correo)}</small></td><td>${u.whatsapp ? esc(u.whatsapp) : `<span class="tag t-por_pagar">Solo contraseña</span>`}</td></tr>`).join("")}</table>
        <p class="vacio" style="padding:12px 16px;text-align:left;font-size:12px">Para dar o quitar acceso, avísele a Casa Digital. Quitar a alguien cierra su sesión al instante.</p></div>
      <div class="card">${H("Actividad reciente", "actividad")}${S.eventos.length ? `<div class="solo-pc" style="overflow-x:auto"><table><tr><th>Cuándo</th><th>Quién</th><th>Qué pasó</th><th>Desde</th></tr>${S.eventos.slice(0, 80).map(e => `<tr><td style="white-space:nowrap">${fechaHora(e.en)}</td><td>${esc(e.correo || "—")}</td><td>${que(e)}</td><td style="white-space:nowrap;color:var(--tx3)">${desde(e)}</td></tr>`).join("")}</table></div>
        <div class="solo-cel">${S.eventos.slice(0, 50).map(e => `<div class="fila"><div>${que(e)}<small>${esc(e.correo || "—")} · ${fechaHora(e.en)}${desde(e) ? ` · ${desde(e)}` : ""}</small></div></div>`).join("")}</div>` : `<div class="vacio">Todavía no hay actividad.</div>`}</div>
    </div>`;
}

async function cambiar(n, estado, b) {
  b.disabled = true;
  try {
    const r = await fetch(`/api/pedidos/${encodeURIComponent(n)}/estado`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ estado }) });
    if (r.status === 401) return location.href = "/panel/entrar";
    if (!r.ok) throw new Error();
    const p = await r.json(); P = P.map(x => x.n === p.n ? p : x); pintar();
  } catch { b.disabled = false; alert("No se pudo guardar. Revise la conexión e intente otra vez."); }
}

function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.2, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .6); o.start(); o.stop(c.currentTime + .6); } catch {} }

async function cargar() {
  try {
    const r = await fetch("/api/pedidos", { cache: "no-store" });
    if (r.status === 401) return location.href = "/panel/entrar";
    P = await r.json();
    const nuevos = new Set(P.filter(p => p.tipo === "pedido" && p.estado === "nuevo").map(p => p.n));
    if (vistos && sonido && [...nuevos].some(n => !vistos.has(n))) beep();
    vistos = nuevos;
    $("#vivo").className = "vivo"; $("#vivo").lastChild.textContent = "Actualizado " + new Date().toLocaleTimeString("es-HN", { hour: "numeric", minute: "2-digit", timeZone: "America/Tegucigalpa" });
    if (vista === "seguridad") cargarSeguridad();
    pintar();
  } catch { $("#vivo").className = "vivo off"; $("#vivo").lastChild.textContent = "Sin conexión, reintentando"; }
}

(async () => {
  const r = await fetch("/api/negocio", { cache: "no-store" });
  if (r.status === 401) return location.href = "/panel/entrar";
  N = await r.json();
  if (N.reservaciones) VISTAS.splice(3, 0, ["reservas", "Reservaciones"]);
  if (N.cupos) VISTAS.splice(1, 0, ["cupos", "Cupos"]);
  if (!todas().some(v => v[0] === vista)) vista = "hoy";
  $("#quien").onclick = () => { vista = "seguridad"; try { localStorage.setItem("vista", vista); } catch {} pintar(); };
  document.title = `Panel · ${N.nombre}`;
  $("#marca").textContent = N.nombre; $("#ey").textContent = N.nombre;
  $("#sub").textContent = `Panel del dueño${N.modoIA ? " · asistente con IA" : ""}`;
  $("#logo").textContent = (N.nombre || "?").trim()[0].toUpperCase(); $("#logo").style.setProperty("--marca", N.color);
  $("#quien").textContent = String(N.usuario || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(); $("#quien").title = N.usuario || "";
  $("#suc").innerHTML += N.sucursales.map(s => `<option value="${esc(s.id)}">${esc(s.nombre)}</option>`).join("");
  if (N.sucursales.length < 2) $("#suc").style.display = "none";
  try { $("#suc").value = localStorage.getItem("suc") || ""; } catch {}
  $("#suc").onchange = () => { try { localStorage.setItem("suc", $("#suc").value); } catch {} pintar(); };
  await cargar();
  setInterval(cargar, 8000);
  setInterval(() => { if (!document.hidden) pintar(); }, 60000);
})();
</script>
