# Render Blueprint del bot de un restaurante. En Render: New > Blueprint, este repositorio,
# Blueprint path: bot-restaurante/render.yaml
# Para cada cliente nuevo: copie este archivo (render-<cliente>.yaml), cambie "name" y NEGOCIO.
services:
  - type: web
    name: restaurante-bot
    runtime: node
    region: virginia            # el más cercano a Honduras
    plan: 0.5c-512mb            # plan pagado más pequeño. El gratis se duerme y WhatsApp no espera.
    rootDir: bot-restaurante
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    disk:                       # aquí viven pedidos.json, sessions.json y usuarios.json
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Tegucigalpa
      - key: DATA_DIR
        value: /var/data
      - key: NEGOCIO               # archivo con el menú y las sucursales del cliente
        value: negocios/ejemplo.json
      - key: META_TOKEN            # WhatsApp directo con Meta (README, sección 3). Con esto no se usa Twilio
        sync: false
      - key: META_PHONE_ID
        sync: false
      - key: META_NUMERO
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: META_PLANTILLA        # nombre de la plantilla de avisos aprobada (aviso_pedido)
        sync: false
      - key: META_PLANTILLA_CODIGO # plantilla de Autenticación para el código de entrada al panel (codigo_panel)
        sync: false
      - key: TWILIO_SANDBOX
        value: "true"
      - key: SKIP_TWILIO_SIGNATURE
        value: "false"
      - key: LEADS_TOKEN
        generateValue: true
      - key: PANEL_SECRET          # firma las sesiones del panel; cambiarlo cierra todas las sesiones
        generateValue: true
      - key: DATA_KEY              # cifra los datos en el disco. GUARDE UNA COPIA: si se pierde, se pierden los datos
        generateValue: true
      - key: PANEL_USUARIOS        # opcional: "correo|Nombre|hash", una por línea (npm run usuario -- linea ...)
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_ALERT_CONTENT_SID
        sync: false
      - key: OWNER_WHATSAPP
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ANTHROPIC_API_KEY     # modo IA (opcional): vacío = el bot contesta con el menú
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: BOT_IA                # "off" apaga el modo IA sin borrar la clave
        value: "on"
      - key: PAGOS_PASARELA        # "tilopay" para pago con tarjeta que pasa solo a cocina (opcional)
        sync: false
      - key: TILOPAY_API_USER
        sync: false
      - key: TILOPAY_API_PASSWORD
        sync: false
      - key: TILOPAY_KEY
        sync: false
      - key: PAGOS_MONEDA
        value: HNL
