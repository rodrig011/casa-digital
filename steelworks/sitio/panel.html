<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Steel Works</title>
<meta name="theme-color" content="#F4F3F0">
<script>try{if(localStorage.getItem("swp-tema")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<style>
/* The owner's desk: everything the business runs on, one click away.
   Quotes and invoices are real documents (print to PDF), the rest is the day at a glance.
   Light and quiet like the tools people keep open all day; colour marks state, not decoration. */
@font-face{font-family:"Shoulders";src:url("fonts/big-shoulders-display-latin-800-normal.woff2") format("woff2");font-weight:800;font-display:swap;}
@font-face{font-family:"Archivo";src:url("fonts/archivo-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap;}
@font-face{font-family:"Archivo";src:url("fonts/archivo-latin-500-normal.woff2") format("woff2");font-weight:500;font-display:swap;}
@font-face{font-family:"Archivo";src:url("fonts/archivo-latin-600-normal.woff2") format("woff2");font-weight:600;font-display:swap;}
@font-face{font-family:"Archivo";src:url("fonts/archivo-latin-700-normal.woff2") format("woff2");font-weight:700;font-display:swap;}
:root{
  --bg:#F4F3F0; --card:#FFFFFF; --sunk:#F7F6F3; --line:#E6E3DE; --line2:#D6D2CB; --tx:#1B1C1D; --tx2:#5C6166; --tx3:#868B90;
  --ember:#D9601A; --ember-bg:#FCEEE4; --ok:#1C8C4E; --ok-bg:#E5F4EB; --blue:#2763C9; --blue-bg:#E8EFFC; --amber:#9E6A12; --amber-bg:#FBF0DC; --red:#C23A2B; --red-bg:#FBE7E4; --wa:#1FA855;
  --hover:#F1EFEB; --sel:#FCEEE4; --shadow:0 1px 2px rgba(20,20,20,.04);
  --body:"Archivo","Helvetica Neue",Arial,sans-serif; --display:"Shoulders",Impact,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111213; --card:#1A1C1E; --sunk:#151618; --line:#2A2D30; --line2:#383C40; --tx:#ECEAE6; --tx2:#A4A9AE; --tx3:#7A8085;
  --ember:#F07A35; --ember-bg:#3A2418; --ok:#3CC47A; --ok-bg:#16301F; --blue:#6E9CF0; --blue-bg:#1A2742; --amber:#E0A84A; --amber-bg:#33280F; --red:#F0796B; --red-bg:#3A1C18;
  --hover:#222528; --sel:#2E2018; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:0;padding:0;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;max-width:100%;}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:6px;}
.num{font-variant-numeric:tabular-nums;}
.ic{width:18px;height:18px;flex:none;}

/* ===== top bar ===== */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;height:60px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);}
.topbar .menu{display:none;width:38px;height:38px;border-radius:9px;place-items:center;}
.topbar .logo img{height:28px;width:auto;}
.lg-d{display:none!important;}
:root[data-theme="dark"] .lg-n{display:none!important;}
:root[data-theme="dark"] .lg-d{display:block!important;}
.search{position:relative;flex:1;max-width:560px;margin:0 auto;}
.search input{width:100%;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--sunk);padding:0 14px 0 38px;font-size:14px;transition:border-color .15s ease,background-color .15s ease;}
.search input:focus{outline:none;border-color:var(--ember);background:var(--card);}
.search > svg{position:absolute;left:12px;top:10px;color:var(--tx3);}
.results{position:absolute;left:0;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.14);padding:6px;max-height:60vh;overflow:auto;}
.results a{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;}
.results a:hover,.results a.on{background:var(--hover);}
.results small{color:var(--tx3);}
.results .empty{padding:12px;color:var(--tx3);}
.topbar .r{display:flex;align-items:center;gap:6px;}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);position:relative;transition:background-color .15s ease,color .15s ease;}
.iconbtn:active{transform:scale(.96);}
@media (hover:hover) and (pointer:fine){.iconbtn:hover{background:var(--hover);color:var(--tx);}}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 2px var(--card);}
.me{width:34px;height:34px;border-radius:50%;background:var(--tx);color:var(--card);display:grid;place-items:center;font-weight:700;font-size:12px;margin-left:4px;}
.theme .sun{display:none;}
:root[data-theme="dark"] .theme .sun{display:block;}
:root[data-theme="dark"] .theme .moon{display:none;}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--line2);background:var(--card);white-space:nowrap;transition:transform .16s var(--ease-out),background-color .15s ease,border-color .15s ease;}
.btn:active{transform:scale(.97);}
.btn.pri{background:var(--ember);border-color:var(--ember);color:#fff;}
.btn.dark{background:var(--tx);border-color:var(--tx);color:var(--card);}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;}
.btn.sm{height:30px;padding:0 10px;font-size:12px;}
.btn.ghost{border-color:transparent;background:transparent;}
.btn svg{width:16px;height:16px;}
.btn[disabled]{opacity:.5;pointer-events:none;}
@media (hover:hover) and (pointer:fine){.btn:hover{border-color:var(--tx3);}.btn.pri:hover{filter:brightness(1.06);}.btn.ghost:hover{background:var(--hover);border-color:transparent;}}
.newmenu{position:relative;}
.pop{position:absolute;right:0;top:44px;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.14);padding:6px;z-index:40;transform-origin:top right;}
.pop a,.pop button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-align:left;font-weight:500;}
.pop a:hover,.pop button:hover{background:var(--hover);}
.pop small{display:block;color:var(--tx3);font-weight:400;font-size:12px;}
@media (prefers-reduced-motion:no-preference){.pop,.results{transition:opacity .16s ease,transform .18s var(--ease-out);}@starting-style{.pop,.results{opacity:0;transform:scale(.97) translateY(-4px);}}}

/* ===== layout ===== */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100svh - 60px);}
.side{position:sticky;top:60px;height:calc(100svh - 60px);overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:18px;}
.side label{display:block;font-size:12px;color:var(--tx3);margin:0 8px 6px;}
.side select{width:100%;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--card);padding:0 10px;}
.side nav{display:grid;gap:2px;}
.side nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--tx2);font-weight:500;position:relative;transition:background-color .15s ease,color .15s ease;}
.side nav a.on{background:var(--sel);color:var(--tx);}
.side nav a.on::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--ember);}
.side nav a .c{margin-left:auto;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--ember);color:#fff;}
.side nav a .c.soft{background:var(--hover);color:var(--tx2);}
@media (hover:hover) and (pointer:fine){.side nav a:hover{background:var(--hover);color:var(--tx);}}
.side hr{border:0;border-top:1px solid var(--line);margin:0 8px;}
.side .bot{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;background:var(--sunk);}
.side .bot b{display:flex;align-items:center;gap:8px;font-weight:600;}
.side .bot b i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent);}
.side .bot span{font-size:12px;color:var(--tx2);}
main{padding:24px clamp(16px,2.6vw,36px) 64px;min-width:0;}
.scrimside{display:none;}

/* ===== page header ===== */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.ph h1{margin:0;font:600 24px/1.2 var(--body);letter-spacing:-.01em;}
.ph .sub{color:var(--tx2);margin-top:3px;}
.ph .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.crumb{font-size:13px;color:var(--tx2);margin-bottom:6px;display:flex;gap:6px;align-items:center;}
.crumb a:hover{color:var(--tx);text-decoration:underline;}
.status{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;}
.status i{width:6px;height:6px;border-radius:50%;background:currentColor;}
.s-ok{background:var(--ok-bg);color:var(--ok);}
.s-blue{background:var(--blue-bg);color:var(--blue);}
.s-amber{background:var(--amber-bg);color:var(--amber);}
.s-red{background:var(--red-bg);color:var(--red);}
.s-gray{background:var(--hover);color:var(--tx2);}
.s-ember{background:var(--ember-bg);color:var(--ember);}
.demo{background:var(--amber-bg);color:var(--amber);}

/* ===== cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;}
.card > header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);}
.card > header h2{margin:0;font:600 15px var(--body);display:flex;align-items:center;gap:8px;}
.card > header .r{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--tx3);font-size:12px;}
.card > header .r a{color:var(--blue);font-weight:600;font-size:13px;}
.card > header .r a:hover{text-decoration:underline;}
.stack{display:grid;gap:16px;}
.g2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

/* status strip */
.strip{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap;}
.strip b{font-weight:600;font-size:16px;}
.strip .r{margin-left:auto;display:flex;gap:8px;}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);}
.kpi{padding:18px 20px;border-right:1px solid var(--line);}
.kpi:last-child{border-right:0;}
.kpi span{color:var(--tx2);font-size:13px;}
.kpi b{display:block;font:800 38px/1 var(--display);margin:10px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:.01em;}
.kpi small{font-size:12px;color:var(--tx3);}
.kpi small em{font-style:normal;font-weight:700;}
.up{color:var(--ok);} .down{color:var(--red);}

/* recommended actions */
.recs{list-style:none;margin:0;padding:0;}
.rec{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color .15s ease;}
.rec:last-child{border-bottom:0;}
@media (hover:hover) and (pointer:fine){.rec:hover{background:var(--sunk);}.rec:hover .go{transform:translateX(3px);border-color:var(--tx3);}}
.rec .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;}
.rec b{font-weight:600;color:var(--blue);}
.rec p{margin:2px 0 0;color:var(--tx2);font-size:13px;}
.rec .go{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--tx2);transition:transform .2s var(--ease-out),border-color .15s ease;}
.rec .go svg{width:16px;height:16px;}

/* chart */
.chart{padding:16px 18px 12px;position:relative;}
.chart svg{width:100%;height:auto;overflow:visible;}
.chart .grid line{stroke:var(--line);stroke-width:1;}
.chart text{fill:var(--tx3);font:500 11px var(--body);}
.chart .bar{fill:var(--ember);opacity:.9;transition:opacity .15s ease;}
.chart .bar.cur{opacity:1;}
.chart .hit{fill:transparent;cursor:default;}
.chart .hit:hover + .bar,.chart .bar.hov{opacity:1;fill:var(--ember);}
.chart g.col:hover .bar{opacity:1;}
.chart .muted .bar{opacity:.35;}
.tip{position:absolute;pointer-events:none;background:var(--tx);color:var(--card);border-radius:8px;padding:7px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;box-shadow:0 10px 30px rgba(0,0,0,.18);}
.tip b{display:block;font-size:13px;}

/* alerts feed (from v1) */
.feed{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto;}
.al{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);align-items:start;transition:background-color .6s ease;}
.al:last-child{border-bottom:0;}
.al.fresh{background:var(--ember-bg);}
.al .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;}
.al b{font-weight:600;}
.al p{margin:2px 0 0;color:var(--tx2);}
.al .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.al .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.al time{font-size:12px;color:var(--tx3);white-space:nowrap;}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--hover);color:var(--tx2);font-size:12px;font-weight:500;}
.tag.price{background:var(--ember-bg);color:var(--ember);font-weight:600;}
@media (prefers-reduced-motion:no-preference){@starting-style{.al{opacity:0;transform:translateY(-8px);}}.al{transition:background-color .6s ease,opacity .4s var(--ease-out),transform .4s var(--ease-out);}}
.ico.q{background:var(--ember-bg);color:var(--ember);}
.ico.p{background:var(--blue-bg);color:var(--blue);}
.ico.t{background:var(--ok-bg);color:var(--ok);}
.ico.w{background:var(--amber-bg);color:var(--amber);}
.ico.r{background:var(--red-bg);color:var(--red);}
.ico svg{width:18px;height:18px;}

/* agenda */
.day{padding:12px 18px 6px;border-bottom:1px solid var(--line);}
.day:last-child{border-bottom:0;}
.day h3{margin:0 0 6px;font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);}
.vis{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;padding:8px 0;}
.vis .h{font-weight:600;white-space:nowrap;}
.vis .who b{font-weight:600;}
.vis .who span{display:block;color:var(--tx2);font-size:13px;}
.vis.new{animation:flash 2.4s ease;}
@keyframes flash{0%,40%{background:var(--ok-bg);}}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;}

/* ===== tables / lists ===== */
.toolbar{display:flex;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.seg{display:inline-flex;background:var(--hover);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap;}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--tx2);transition:background-color .15s ease,color .15s ease;}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.seg button span{color:var(--tx3);margin-left:4px;}
.toolbar .find{margin-left:auto;position:relative;}
.toolbar .find input{height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--card);padding:0 10px 0 32px;width:230px;}
.toolbar .find svg{position:absolute;left:9px;top:8px;width:16px;height:16px;color:var(--tx3);}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{text-align:left;font-weight:600;font-size:12px;color:var(--tx2);padding:10px 18px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:0;}
.tbl tbody tr{cursor:pointer;transition:background-color .12s ease;}
@media (hover:hover) and (pointer:fine){.tbl tbody tr:hover{background:var(--sunk);}}
.tbl .r{text-align:right;}
.tbl a.lk{color:var(--blue);font-weight:600;}
.tbl small{display:block;color:var(--tx3);font-size:12px;}
.tbl .empty td{text-align:center;color:var(--tx3);padding:36px;cursor:default;}
.foot{display:flex;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);color:var(--tx2);font-size:13px;}

/* ===== document editor ===== */
.editor{display:grid;grid-template-columns:minmax(360px,.9fr) minmax(0,1.1fr);gap:20px;align-items:start;}
.form{display:grid;gap:16px;}
.form .card{padding:16px 18px;}
.form h3{margin:0 0 12px;font:600 14px var(--body);}
.fld{display:grid;gap:5px;}
.fld label{font-size:12px;font-weight:600;color:var(--tx2);}
.fld input,.fld select,.fld textarea{height:38px;border-radius:9px;border:1px solid var(--line2);background:var(--card);padding:0 11px;width:100%;transition:border-color .15s ease;}
.fld textarea{height:auto;min-height:72px;padding:9px 11px;resize:vertical;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--ember);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.items{display:grid;gap:8px;}
.it{display:grid;grid-template-columns:minmax(0,1fr) 64px 110px 30px;gap:6px;align-items:center;}
.it input{height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--card);padding:0 9px;width:100%;min-width:0;}
.it input:focus{outline:none;border-color:var(--ember);}
.it input.q,.it input.p{text-align:right;font-variant-numeric:tabular-nums;}
.it .x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--tx3);font-size:18px;}
.it .x:hover{background:var(--red-bg);color:var(--red);}
.ithead{display:grid;grid-template-columns:minmax(0,1fr) 64px 110px 30px;gap:6px;font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.04em;text-transform:uppercase;}
.ithead span:nth-child(2),.ithead span:nth-child(3){text-align:right;}
.adders{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.adders select{height:30px;border-radius:8px;border:1px dashed var(--line2);background:var(--card);padding:0 8px;font-size:12px;font-weight:600;color:var(--tx2);max-width:100%;}
.totals{display:grid;gap:6px;margin-top:4px;}
.totals div{display:flex;justify-content:space-between;color:var(--tx2);}
.totals div b{color:var(--tx);font-weight:600;}
.totals .t{font-size:16px;color:var(--tx);font-weight:700;padding-top:8px;border-top:1px solid var(--line);}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--tx2);height:38px;}
.fld .check input{width:18px;height:18px;padding:0;accent-color:var(--ember);flex:none;}
.sticky{position:sticky;top:80px;}
.docbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.docbar .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}

/* ===== the paper document (quote / invoice) ===== */
.paperwrap{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,2vw,24px);overflow:auto;}
.paper{background:#fff;color:#1B1C1D;width:100%;max-width:780px;margin:0 auto;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.08);padding:clamp(20px,4vw,48px);font-size:13px;line-height:1.5;position:relative;}
.paper .hd{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;padding-bottom:20px;border-bottom:2px solid #1B1C1D;}
.paper .hd img{height:40px;width:auto;}
.paper .hd .co{margin-top:12px;color:#5C6166;font-size:12px;line-height:1.5;}
.paper .hd .ttl{text-align:right;}
.paper .hd .ttl h2{margin:0;font:800 34px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;}
.paper .hd .ttl .no{font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;}
.paper .hd .ttl dl{margin:10px 0 0;display:grid;grid-template-columns:auto auto;gap:2px 12px;justify-content:end;font-size:12px;color:#5C6166;}
.paper .hd .ttl dd{margin:0;color:#1B1C1D;font-weight:500;text-align:right;}
.paper .to{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:20px 0;}
.paper .to h4{margin:0 0 6px;font:700 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#868B90;}
.paper .to p{margin:0;}
.paper .to b{font-weight:600;font-size:14px;}
.paper table{width:100%;border-collapse:collapse;margin-top:4px;}
.paper th{text-align:left;font:700 10px var(--body);letter-spacing:.12em;text-transform:uppercase;color:#868B90;padding:8px 8px;border-bottom:1px solid #D6D2CB;}
.paper td{padding:10px 8px;border-bottom:1px solid #EEECE8;vertical-align:top;}
.paper .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.paper .sum{display:grid;grid-template-columns:1fr 260px;gap:24px;margin-top:16px;align-items:start;}
.paper .sum dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 16px;}
.paper .sum dt{color:#5C6166;}
.paper .sum dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;}
.paper .sum .tot{font-weight:700;font-size:16px;padding-top:8px;border-top:2px solid #1B1C1D;}
.paper .words{color:#5C6166;font-size:12px;}
.paper .notes{margin-top:24px;padding-top:16px;border-top:1px solid #EEECE8;color:#5C6166;font-size:12px;white-space:pre-line;}
.paper .fiscal{margin-top:20px;padding:12px 14px;border:1px dashed #C9C4BB;border-radius:6px;font-size:11px;color:#5C6166;display:grid;grid-template-columns:repeat(2,1fr);gap:4px 20px;}
.paper .fiscal b{color:#1B1C1D;font-weight:600;}
.paper .stamp{position:absolute;top:28%;right:8%;transform:rotate(-14deg);border:3px solid currentColor;border-radius:8px;padding:6px 14px;font:800 30px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;opacity:.75;}
.paper .stamp.paid{color:#1C8C4E;}
.paper .stamp.ok{color:#2763C9;}
.paper .wm{margin-top:20px;text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#B7791F;}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;}
.paper .sig div{border-top:1px solid #1B1C1D;padding-top:6px;font-size:11px;color:#5C6166;text-align:center;}

/* ===== record (client) ===== */
.rec-hd{display:flex;gap:16px;align-items:center;padding:18px;}
.rec-hd .big{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;flex:none;}
.rec-hd h1{margin:0;font:600 22px var(--body);}
.rec-hd .sub{color:var(--tx2);}
.rec-hd .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);}
.facts div{padding:12px 18px;border-right:1px solid var(--line);}
.facts div:last-child{border-right:0;}
.facts span{display:block;font-size:12px;color:var(--tx3);}
.facts b{font-weight:600;}
.tl{list-style:none;margin:0;padding:8px 18px 14px;}
.tl li{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start;}
.tl li:last-child{border-bottom:0;}
.tl li p{margin:2px 0 0;color:var(--tx2);font-size:13px;}
.tl time{font-size:12px;color:var(--tx3);white-space:nowrap;}
.convo{display:grid;gap:6px;background:#EFEAE2;border-radius:12px;padding:12px;margin:14px 18px 18px;}
:root[data-theme="dark"] .convo{background:#0E1416;}
.convo p{margin:0;max-width:86%;padding:7px 10px;border-radius:8px;font-size:13px;background:#fff;color:#1B1C1D;justify-self:start;}
.convo p.mine{background:#D9FDD3;justify-self:end;}
:root[data-theme="dark"] .convo p{background:#202C33;color:#E9EDEF;}
:root[data-theme="dark"] .convo p.mine{background:#005C4B;}
.dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:0;padding:16px 18px;}
.dl dt{color:var(--tx3);}
.dl dd{margin:0;font-weight:500;}

/* ===== shop board (from v1) ===== */
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;padding:16px;overflow-x:auto;scroll-snap-type:x mandatory;}
.col{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:280px;scroll-snap-align:start;}
.col > h3{margin:2px 4px 4px;font:600 13px var(--body);display:flex;align-items:center;gap:8px;}
.col > h3 span{margin-left:auto;color:var(--tx3);font-weight:500;}
.col > h3 i{width:8px;height:8px;border-radius:50%;}
.job{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;box-shadow:var(--shadow);}
.job b{font-weight:600;}
.job .d{color:var(--tx2);font-size:13px;}
.job .f{display:flex;align-items:center;gap:8px;margin-top:4px;}
.job .f .due{font-size:12px;color:var(--tx3);}
.job .f .due.late{color:var(--red);font-weight:600;}
.job .f .av{width:24px;height:24px;font-size:10px;margin-left:auto;}
.job .bar{height:4px;border-radius:4px;background:var(--hover);overflow:hidden;}
.job .bar i{display:block;height:100%;background:var(--tx);border-radius:4px;}
.job .next{justify-self:start;margin-top:4px;font-size:12px;font-weight:600;color:var(--tx2);display:inline-flex;gap:6px;align-items:center;padding:4px 8px;margin-left:-8px;border-radius:6px;transition:background-color .15s ease,color .15s ease;}
.job .next svg{width:14px;height:14px;}
@media (hover:hover) and (pointer:fine){.job .next:hover{background:var(--hover);color:var(--tx);}}
@media (prefers-reduced-motion:no-preference){.job{transition:opacity .35s var(--ease-out),transform .35s var(--ease-out);}@starting-style{.job{opacity:0;transform:translateY(8px) scale(.98);}}}

/* assistant view */
.mini{display:grid;grid-template-columns:repeat(3,1fr);}
.mini div{padding:16px 18px;border-right:1px solid var(--line);}
.mini div:last-child{border-right:0;}
.mini span{font-size:12px;color:var(--tx2);}
.mini b{display:block;font:800 30px/1 var(--display);margin-top:8px;}
.chats{list-style:none;margin:0;padding:0;}
.chats li{display:grid;grid-template-columns:36px 1fr auto;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;}
.chats li:last-child{border-bottom:0;}
.chats li.on{background:var(--sel);}
.chats li > div{min-width:0;}
@media (hover:hover) and (pointer:fine){.chats li:hover{background:var(--sunk);}}
.chats p{margin:2px 0 0;color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chats time{font-size:12px;color:var(--tx3);white-space:nowrap;}
.how{padding:16px 18px;display:grid;gap:12px;}
.how ol{margin:0;padding-left:18px;display:grid;gap:8px;color:var(--tx2);}
.how ol b{color:var(--tx);}

/* toasts */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:grid;gap:8px;justify-items:center;pointer-events:none;}
.toast{display:flex;align-items:center;gap:10px;background:var(--tx);color:var(--card);border-radius:12px;padding:12px 16px;font-size:13px;box-shadow:0 14px 34px rgba(0,0,0,.2);max-width:min(480px,calc(100vw - 32px));}
.toast svg{width:18px;height:18px;flex:none;color:#2BD46A;}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .3s var(--ease-out),transform .35s var(--ease-out);}@starting-style{.toast{opacity:0;transform:translateY(12px) scale(.97);}}.toast.out{opacity:0;transform:translateY(6px) scale(.98);transition-duration:.2s;}}

/* view enter */
@media (prefers-reduced-motion:no-preference){.view{animation:vin .32s var(--ease-out);}@keyframes vin{from{opacity:0;transform:translateY(6px);}}}

/* ===== responsive ===== */
@media (max-width:1180px){.editor{grid-template-columns:1fr;}.sticky{position:static;}}
@media (max-width:1100px){.g2,.g2e{grid-template-columns:1fr;}.kpis{grid-template-columns:repeat(2,1fr);}.kpi:nth-child(2){border-right:0;}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line);}.facts{grid-template-columns:repeat(2,1fr);}.facts div:nth-child(2){border-right:0;}.facts div:nth-child(-n+2){border-bottom:1px solid var(--line);}}
@media (max-width:860px){
  .topbar{padding:0 12px;gap:8px;}
  .topbar .menu{display:grid;}
  .topbar .logo img{height:24px;}
  .search{display:none;}
  .search.open{display:block;position:absolute;left:12px;right:12px;top:11px;max-width:none;}
  .topbar .r .sbtn{display:grid!important;}
  .app{grid-template-columns:1fr;}
  .side{position:fixed;top:0;left:0;bottom:0;height:100svh;width:min(290px,84vw);z-index:70;transform:translateX(-102%);transition:transform .35s var(--ease-drawer),box-shadow .35s ease;}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.18);}
  .scrimside{display:block;position:fixed;inset:0;z-index:69;background:rgba(20,20,20,.3);opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .scrimside.open{opacity:1;pointer-events:auto;}
  main{padding:18px 14px 80px;}
  .ph h1{font-size:21px;}
  .toolbar .find{margin-left:0;width:100%;}
  .toolbar .find input{width:100%;}
  .tbl.cards thead{display:none;}
  .tbl.cards tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border-bottom:1px solid var(--line);}
  .tbl.cards td{padding:0;border:0;}
  .tbl.cards td.hm{display:none;}
  .tbl.cards td.r{grid-column:2;grid-row:1;}
  .tbl.cards td.st{grid-column:2;grid-row:2;justify-self:end;}
  .mini{grid-template-columns:1fr 1fr 1fr;}
  .mini b{font-size:24px;}
  .board{grid-template-columns:repeat(5,82%);}
  .paper .to,.paper .sum,.paper .fiscal{grid-template-columns:1fr;}
  .paper .hd{flex-direction:column;}
  .paper .hd .ttl{text-align:left;}
  .paper .hd .ttl dl{justify-content:start;}
  .paper .hd .ttl dd{text-align:left;}
  .paper .stamp{font-size:22px;top:12%;}
  .rec-hd{flex-wrap:wrap;}
  .rec-hd .r{margin-left:0;width:100%;}
  .strip .r{margin-left:0;}
}
@media (max-width:520px){
  .kpi b{font-size:30px;}
  .kpi{padding:14px 16px;}
  .it,.ithead{grid-template-columns:minmax(0,1fr) 52px 92px 28px;}
  .row2{grid-template-columns:1fr;}
  .facts{grid-template-columns:1fr 1fr;}
  .paper{font-size:12px;}
  .paper th:nth-child(2),.paper td:nth-child(2){display:none;}
  .topbar .r .hide-s{display:none;}
}

/* ===== print: only the document ===== */
@media print{
  @page{size:letter;margin:12mm;}
  body{background:#fff!important;}
  body *{visibility:hidden!important;}
  .paper,.paper *{visibility:visible!important;}
  .paper{position:absolute;left:0;top:0;width:100%;max-width:none;box-shadow:none;border-radius:0;padding:0;}
  .paper{font-size:12px;}
  .paper .hd{flex-direction:row;}
  .paper .hd .ttl,.paper .hd .ttl dd{text-align:right;}
  .paper .hd .ttl dl{justify-content:end;}
  .paper .to{grid-template-columns:1fr 1fr;padding:14px 0;}
  .paper .sum{grid-template-columns:1fr 260px;}
  .paper .fiscal{grid-template-columns:1fr 1fr;}
  .paper th:nth-child(2),.paper td:nth-child(2){display:table-cell;}
  .paper td{padding:7px 8px;}
  .paper .stamp{font-size:30px;top:24%;}
}

function letras(n) {

  const DEC = ["", "", "", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];
  const C = ["", "ciento", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];
  const cien = x => { if (x === 0) return ""; if (x === 100) return "cien"; const c = Math.floor(x / 100), r = x % 100; let s = C[c]; if (r) s += (s ? " " : "") + (r < 30 ? U[r] : DEC[Math.floor(r / 10)] + (r % 10 ? " y " + U[r % 10] : "")); return s; };
  const ent = Math.floor(n), cts = Math.round((n - ent) * 100);
  const mill = Math.floor(ent / 1e6), miles = Math.floor(ent % 1e6 / 1e3), resto = ent % 1e3;
  let s = "";
  if (mill) s += (mill === 1 ? "un millón" : cien(mill) + " millones") + " ";
  if (miles) s += (miles === 1 ? "mil" : cien(miles) + " mil") + " ";
  s += cien(resto);
  s = (s.trim() || "cero").replace(/uno mil/g, "un mil").replace(/veintiuno mil/g, "veintiún mil");
  return s.charAt(0).toUpperCase() + s.slice(1) + ` lempiras con ${String(cts).padStart(2, "0")}/100`;
}

function drawChart(el) {
  const W = 520, H = 220, pl = 44, pb = 26, pt = 14, max = Math.max(...MESES.map(m => m.v)) * 1.15;
  const step = (W - pl) / MESES.length, bw = Math.min(44, step * .5);
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Facturado por mes, últimos seis meses">
    <g class="grid">${ticks.map(t => `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${t ? Math.round(t / 1000) + "k" : "0"}</text>`).join("")}</g>
    ${MESES.map((m, i) => { const x = pl + step * i + (step - bw) / 2, h = H - pb - y(m.v); return `<g class="col" data-i="${i}"><path class="bar${i === 5 ? " cur" : ""}" d="M${x},${H - pb} v${-(h - 4)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${h - 4} z"/><rect class="hit" x="${pl + step * i}" y="${pt}" width="${step}" height="${H - pt - pb}"/><text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${m.m}${i === 5 ? " (en curso)" : ""}</text></g>`; }).join("")}
  </svg><div class="tip" hidden></div>`;
  const tip = $(".tip", el), svg = $("svg", el);
  $$("g.col", el).forEach(g => {
    g.addEventListener("pointerenter", () => { const i = +g.dataset.i, m = MESES[i], r = $(".bar", g).getBoundingClientRect(), b = el.getBoundingClientRect(); tip.innerHTML = `<b class="num">${L(m.v)}</b>${m.m}${i === 5 ? " · mes en curso" : ""}`; tip.style.left = (r.left - b.left + r.width / 2) + "px"; tip.style.top = (r.top - b.top) + "px"; tip.hidden = false; svg.classList.add("muted"); g.classList.add("on"); $(".bar", g).style.opacity = 1; });
    g.addEventListener("pointerleave", () => { tip.hidden = true; svg.classList.remove("muted"); $(".bar", g).style.opacity = ""; });
  });
}

function setNav(v) { $$(".side nav a").forEach(a => a.classList.toggle("on", a.dataset.v === v)); }
function badges() {
  const n1 = DB.cots.filter(c => estadoCot(c) === "Borrador" || estadoCot(c) === "Enviada").length;
  const n2 = DB.facts.filter(f => estadoFac(f) === "Vencida").length;
  const n3 = DB.pedidos.filter(p => p.estado !== "Enviado" && p.estado !== "Entregado").length;
  $("#nc").textContent = n1; $("#nc").hidden = !n1;
  $("#nf").textContent = n2; $("#nf").hidden = !n2;
  $("#np").textContent = n3; $("#np").hidden = !n3;
}
function route() {
  const [path, qs] = (location.hash.slice(2) || "inicio").split("?");
  const [v, id, sub] = path.split("/");
  const params = new URLSearchParams(qs || "");
  closeSide(); $("#newPop").hidden = true;
  setNav(v);
  if ((v === "cotizaciones" || v === "facturas") && id) {
    const kind = v === "facturas" ? "fac" : "cot";
    if (id === "nueva" || sub === "editar") editor(kind, id, params); else docView(kind, decodeURIComponent(id));
  } else if (v === "clientes" && id) clienteView(id);
  else (V[v] || V.inicio)();
  badges();
  if (!(sub === "editar" || id === "nueva")) window.scrollTo({ top: 0 });
  document.title = "Panel Steel Works · " + (($(".ph h1", main) || {}).textContent || "Inicio").replace(/\s+/g, " ").trim();
}
addEventListener("hashchange", route);

function searchAll(s) {

  const out = [];

  DB.cots.forEach(c => { if ([c.id, cliente(c.cli).n, c.items.map(i => i[0]).join(" ")].join(" ").toLowerCase().includes(s)) out.push({ h: "#/cotizaciones/" + c.id, t: `${c.id} · ${cliente(c.cli).n}`, k: L(tot(c).total), i: "quote" }); });
  DB.facts.forEach(f => { if ([f.id, cliente(f.cli).n, f.items.map(i => i[0]).join(" ")].join(" ").toLowerCase().includes(s)) out.push({ h: "#/facturas/" + f.id, t: `Factura ${f.id.slice(-8)} · ${cliente(f.cli).n}`, k: L(tot(f).total), i: "inv" }); });
  return out.slice(0, 8);
}
let rsel = 0;
function drawRes() {
  const r = searchAll(q.value);
  res.hidden = !q.value.trim();
  res.innerHTML = r.map((x, i) => `<a href="${x.h}" class="${i === rsel ? "on" : ""}">${ico(x.i)}<span>${esc(x.t)}</span><small class="num">${esc(x.k)}</small></a>`).join("") || `<div class="empty">Nada con «${esc(q.value)}».</div>`;
}
q.addEventListener("input", () => { rsel = 0; drawRes(); });
q.addEventListener("keydown", e => {
  const items = $$("a", res);
  if (e.key === "ArrowDown") { rsel = Math.min(items.length - 1, rsel + 1); drawRes(); e.preventDefault(); }
  if (e.key === "ArrowUp") { rsel = Math.max(0, rsel - 1); drawRes(); e.preventDefault(); }
  if (e.key === "Enter" && items[rsel]) { location.hash = items[rsel].getAttribute("href"); q.value = ""; res.hidden = true; q.blur(); $("#search").classList.remove("open"); }
  if (e.key === "Escape") { q.value = ""; res.hidden = true; q.blur(); $("#search").classList.remove("open"); }
});
res.addEventListener("click", e => { if (e.target.closest("a")) { q.value = ""; res.hidden = true; $("#search").classList.remove("open"); } });
document.addEventListener("click", e => { if (!e.target.closest("#search") && !e.target.closest("#sbtn")) { res.hidden = true; $("#search").classList.remove("open"); } if (!e.target.closest(".newmenu")) { $("#newPop").hidden = true; $("#newBtn").setAttribute("aria-expanded", "false"); } });
$("#sbtn").addEventListener("click", () => { $("#search").classList.add("open"); q.focus(); });
addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); } });

// ----- new menu, theme, sidebar on phones, branch filter -----
$("#newBtn").addEventListener("click", () => { const p = $("#newPop"); p.hidden = !p.hidden; $("#newBtn").setAttribute("aria-expanded", String(!p.hidden)); });
const root = document.documentElement, meta = document.querySelector('meta[name="theme-color"]');
const syncTheme = () => { const d = root.dataset.theme === "dark"; $("#themeBtn").setAttribute("aria-label", d ? "Cambiar a modo día" : "Cambiar a modo noche"); meta.content = d ? "#111213" : "#F4F3F0"; };
$("#themeBtn").addEventListener("click", () => { if (root.dataset.theme === "dark") delete root.dataset.theme; else root.dataset.theme = "dark"; try { localStorage.setItem("swp-tema", root.dataset.theme || "light"); } catch (e) {} syncTheme(); });
syncTheme();
const closeSide = () => { $("#side").classList.remove("open"); $("#scrimside").classList.remove("open"); };
$("#menuBtn").addEventListener("click", () => { $("#side").classList.add("open"); $("#scrimside").classList.add("open"); });
$("#scrimside").addEventListener("click", closeSide);
$("#suc").addEventListener("change", e => { curSuc = e.target.value; route(); toast(curSuc ? `Mostrando solo ${SUC[curSuc].n}.` : "Mostrando las dos sucursales."); });

route();

// a new quote arrives from WhatsApp a few seconds in, like it would in the real day
setTimeout(() => {
  if (!alerts) drawFeed();
  alerts.unshift({ k: "q", i: "chat", fresh: true, title: "Nueva cotización de Familia Zelaya", text: "Puerta principal · 2.10 × 1.20 m · Calado CNC", tags: `<span class="tag price num">L 18,900 – 26,400</span><span class="tag">Sábado 9:00 a. m.</span><span class="tag">Tegucigalpa</span>`, t: "ahora" });
  drawFeed();
  if ($("#feed")) toast("Nueva cotización de Familia Zelaya por WhatsApp");
  setTimeout(() => { alerts[0].fresh = false; drawFeed(); }, 5000);
}, MOTION ? 3500 : 0);
})();
</script>
