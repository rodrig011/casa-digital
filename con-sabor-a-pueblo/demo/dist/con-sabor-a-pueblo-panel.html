ass=\"tag t-${esc(e.a)}\">${ESTADO_TXT[e.a] || esc(e.a)}</span>` : `${MALOS.includes(e.evento) ? `<b style=\"color:var(--red)\">${EVENTO[e.evento]}</b>` : EVENTO[e.evento] || esc(e.evento)}${e.como ? ` <small style=\"color:var(--tx3)\">(${esc(e.como)})</small>` : \"\"}`;\n  v.innerHTML = `<p class=\"ayuda\">Así está protegido el panel. Solo entran los correos de abajo; cada entrada, intento fallido y cambio de pedido queda anotado aquí con la hora y el equipo.</p>\n    <div class=\"kpis\">\n      <div class=\"card kpi\"><b>${S.cifrado ? \"AES-256\" : \"No\"}</b><span>${S.cifrado ? \"Datos de clientes cifrados en el servidor\" : S.disco ? \"Datos sin cifrar: falta la llave\" : \"Datos solo en memoria\"}</span></div>\n      <div class=\"card kpi\"><b>${S.dosPasos && S.usuarios.every(u => u.whatsapp) ? \"2 pasos\" : S.dosPasos ? \"Mixto\" : \"Contraseña\"}</b><span>${S.dosPasos ? \"Contraseña + código por WhatsApp\" : \"Entrada solo con contraseña\"}</span></div>\n      <div class=\"card kpi\"><b>${S.sesionHoras} h</b><span>La sesión se cierra sola</span></div>\n      <div class=\"card kpi\" style=\"${malos ? \"border-top-color:var(--red)\" : \"\"}\"><b>${malos}</b><span>Intentos fallidos en 7 días</span></div></div>\n    <div class=\"grid-seg\">\n      <div class=\"card\">${H(\"Quién tiene acceso\", \"llave\")}<table><tr><th>Persona</th><th>Código a</th></tr>${S.usuarios.map(u => `<tr><td>${esc(u.nombre)}<small style=\"display:block;color:var(--tx3)\">${esc(u.correo)}</small></td><td>${u.whatsapp ? esc(u.whatsapp) : `<span class=\"tag t-por_pagar\">Solo contraseña</span>`}</td></tr>`).join(\"\")}</table>\n        <p class=\"vacio\" style=\"padding:12px 16px;text-align:left;font-size:12px\">Para dar o quitar acceso, avísele a Casa Digital. Quitar a alguien cierra su sesión al instante.</p></div>\n      <div class=\"card\">${H(\"Actividad reciente\", \"actividad\")}${S.eventos.length ? `<div class=\"solo-pc\" style=\"overflow-x:auto\"><table><tr><th>Cuándo</th><th>Quién</th><th>Qué pasó</th><th>Desde</th></tr>${S.eventos.slice(0, 80).map(e => `<tr><td style=\"white-space:nowrap\">${fechaHora(e.en)}</td><td>${esc(e.correo || \"—\")}</td><td>${que(e)}</td><td style=\"white-space:nowrap;color:var(--tx3)\">${desde(e)}</td></tr>`).join(\"\")}</table></div>\n        <div class=\"solo-cel\">${S.eventos.slice(0, 50).map(e => `<div class=\"fila\"><div>${que(e)}<small>${esc(e.correo || \"—\")} · ${fechaHora(e.en)}${desde(e) ? ` · ${desde(e)}` : \"\"}</small></div></div>`).join(\"\")}</div>` : `<div class=\"vacio\">Todavía no hay actividad.</div>`}</div>\n    </div>`;\n}\n\nasync function cambiar(n, estado, b) {\n  b.disabled = true;\n  try {\n    const r = await fetch(`/api/pedidos/${encodeURIComponent(n)}/estado`, { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify({ estado }) });\n    if (r.status === 401) return location.href = \"/panel/entrar\";\n    if (!r.ok) throw new Error();\n    const p = await r.json(); P = P.map(x => x.n === p.n ? p : x); pintar();\n  } catch { b.disabled = false; alert(\"No se pudo guardar. Revise la conexión e intente otra vez.\"); }\n}\n\n// the bot passes the order to the next driver (never back to one who said no) and tells him by WhatsApp\nasync function otroRepartidor(n, b) {\n  b.disabled = true;\n  try {\n    const r = await fetch(`/api/pedidos/${encodeURIComponent(n)}/repartidor`, { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: \"{}\" });\n    if (r.status === 401) return location.href = \"/panel/entrar\";\n    if (!r.ok) throw new Error();\n    const p = await r.json(); P = P.map(x => x.n === p.n ? p : x); pintar();\n    if (!p.repartidor) alert(\"No hay otro repartidor disponible para esta sucursal. Escríbale a uno directamente.\");\n  } catch { b.disabled = false; alert(\"No se pudo cambiar el repartidor. Revise la conexión e intente otra vez.\"); }\n}\n\nfunction beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.2, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .6); o.start(); o.stop(c.currentTime + .6); } catch {} }\n\nasync function cargar() {\n  try {\n    const r = await fetch(\"/api/pedidos\", { cache: \"no-store\" });\n    if (r.status === 401) return location.href = \"/panel/entrar\";\n    P = await r.json();\n    const nuevos = new Set(P.filter(p => p.tipo === \"pedido\" && p.estado === \"nuevo\").map(p => p.n));\n    if (vistos && sonido && [...nuevos].some(n => !vistos.has(n))) beep();\n    vistos = nuevos;\n    $(\"#vivo\").className = \"vivo\"; $(\"#vivo\").lastChild.textContent = \"Actualizado \" + new Date().toLocaleTimeString(\"es-HN\", { hour: \"numeric\", minute: \"2-digit\", timeZone: \"America/Tegucigalpa\" });\n    if (vista === \"seguridad\") cargarSeguridad();\n    pintar();\n  } catch { $(\"#vivo\").className = \"vivo off\"; $(\"#vivo\").lastChild.textContent = \"Sin conexión, reintentando\"; }\n}\n\n(async () => {\n  const r = await fetch(\"/api/negocio\", { cache: \"no-store\" });\n  if (r.status === 401) return location.href = \"/panel/entrar\";\n  N = await r.json();\n  if (N.reservaciones) VISTAS.splice(3, 0, [\"reservas\", \"Reservaciones\"]);\n  if (N.cupos) VISTAS.splice(1, 0, [\"cupos\", \"Cupos\"]);\n  if ((N.repartidores && N.repartidores.length) || N.domicilioPropio) VISTAS.splice(VISTAS.findIndex(v => v[0] === \"cocina\") + 1, 0, [\"repartidores\", \"Repartidores\"]);\n  if (N.proveedores) VISTAS.splice(VISTAS.findIndex(v => v[0] === \"menu\"), 0, [\"proveedores\", \"Proveedores\"]);\n  if (!todas().some(v => v[0] === vista)) vista = \"hoy\";\n  $(\"#quien\").onclick = () => { vista = \"seguridad\"; try { localStorage.setItem(\"vista\", vista); } catch {} pintar(); };\n  document.title = `Panel · ${N.nombre}`;\n  $(\"#marca\").textContent = N.nombre; $(\"#ey\").textContent = N.nombre;\n  $(\"#sub\").textContent = `Panel del dueño${N.modoIA ? \" · asistente con IA\" : \"\"}`;\n  if (N.logo) { $(\"#logo\").innerHTML = `<img src=\"${esc(N.logo)}\" alt=\"\">`; $(\"#logo\").classList.add(\"img\"); } else $(\"#logo\").textContent = (N.nombre || \"?\").trim()[0].toUpperCase(); $(\"#logo\").style.setProperty(\"--marca\", N.color);\n  $(\"#quien\").textContent = String(N.usuario || \"?\").split(/\\s+/).map(w => w[0]).join(\"\").slice(0, 2).toUpperCase(); $(\"#quien\").title = N.usuario || \"\";\n  $(\"#suc\").innerHTML += N.sucursales.map(s => `<option value=\"${esc(s.id)}\">${esc(s.nombre)}</option>`).join(\"\");\n  if (N.sucursales.length < 2) $(\"#suc\").style.display = \"none\";\n  try { $(\"#suc\").value = localStorage.getItem(\"suc\") || \"\"; } catch {}\n  $(\"#suc\").onchange = () => { try { localStorage.setItem(\"suc\", $(\"#suc\").value); } catch {} pintar(); };\n  await cargar();\n  setInterval(cargar, 8000);\n  setInterval(() => { if (!document.hidden) pintar(); }, 60000);\n})();\n<\/script>\n</body>\n</html>\n";
const marco = document.getElementById("panel"), espera = document.getElementById("espera");
let canal = null; const pendientes = new Map(); let sig = 1, conectado = false;
try { canal = new BroadcastChannel("con-sabor-a-pueblo-demo"); } catch (e) {}
function pedir(m, ms = 5000) {
  return new Promise((ok, mal) => {
    if (!canal) return mal(new Error("sin canal"));
    const id = "p" + Date.now() + "-" + sig++;
    const t = setTimeout(() => { pendientes.delete(id); mal(new Error("sin demo")); }, ms);
    pendientes.set(id, r => { clearTimeout(t); ok(r); });
    canal.postMessage({ ...m, id });
  });
}
if (canal) canal.onmessage = e => {
  const m = e.data || {};
  if (m.re && pendientes.has(m.re)) { pendientes.get(m.re)(m.r); pendientes.delete(m.re); return; }
  if (m.tipo === "refrescar") { try { const w = marco.contentWindow; if (w && w.cargar) w.cargar(); } catch (x) {} }
};
function mostrar(s) {
  const h = s.k === "panel" ? PANEL_HTML : (ENTRAR[s.k] || ENTRAR.entrar).replace("ERROR_DEMO", s.error || "");
  marco.srcdoc = h.replaceAll("LOGO_DEMO", LOGO);
}
function sinDemo() { conectado = false; marco.hidden = true; espera.hidden = false; }
window.DEMO = {
  api: async (url, o) => { try { return await pedir({ tipo: "api", url, o: { method: o.method, body: o.body } }); } catch (e) { sinDemo(); throw e; } },
  // the demo login is checked here (email and password, no WhatsApp code), so it never depends on the other tab's version
  entrar: d => mostrar(String(d.correo || "").trim().toLowerCase() === "dueno@consaborapueblo.demo" && d.clave === "Sabor-2026-demo" ? { k: "panel" } : { k: "entrarError", error: "Correo o contraseña incorrectos." }),
  salir: () => mostrar({ k: "entrar" }),
};
async function conectar() {
  if (conectado) return;
  try { await pedir({ tipo: "hola" }, 1500); conectado = true; espera.hidden = true; marco.hidden = false; mostrar({ k: "entrar" }); }
  catch (e) { sinDemo(); }
}
conectar();
setInterval(() => { if (canal) canal.postMessage({ tipo: "latido" }); if (!conectado) conectar(); }, 4000);
</script>
