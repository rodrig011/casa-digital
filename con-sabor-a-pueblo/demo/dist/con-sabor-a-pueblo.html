:root{--papel:#F4F1EC;--tinta:#1B1A17;--suave:#6B655C;--linea:#E2DCD2;--marca:#C8102E;--chat:#EFEAE2;--yo:#D9FDD3;--ok:#1F7A4D}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{font-family:"Hanken",system-ui,sans-serif;background:var(--papel);color:var(--tinta);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--linea);background:#fff}
.top img{width:40px;height:40px;border-radius:50%}
.top h1{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.top p{font-size:13px;color:var(--suave)}
.top .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;transition:transform .12s ease,background .15s}
.btn:active{transform:scale(.97)}
.aviso{font-size:12.5px;color:var(--suave);padding:8px 20px;background:#FBF9F5;border-bottom:1px solid var(--linea)}
.aviso b{color:var(--tinta);font-weight:600}
.guia{padding:14px 20px 4px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.guia::-webkit-scrollbar{display:none}
.paso{flex:0 0 auto;max-width:280px;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.35;color:var(--suave);transition:border-color .2s,color .2s}
.paso b{display:block;color:var(--tinta);font-weight:700;font-size:12px;letter-spacing:.02em;margin-bottom:2px}
.paso.ya{opacity:.55}
.paso.ahora{border-color:var(--tinta);color:var(--tinta)}
.tabs{display:none;gap:6px;padding:10px 12px 0;position:sticky;top:0;z-index:5;background:var(--papel)}
.tab{flex:1;border:1px solid var(--linea);background:#fff;border-radius:12px;padding:9px 4px;font-size:13px;font-weight:600;position:relative}
.tab[aria-selected=true]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.tab .n{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--marca);color:#fff;font-size:11px;line-height:18px;padding:0 5px;display:none}
.tab .n.si{display:block}
.escena{flex:1;display:grid;grid-template-columns:repeat(3,minmax(280px,330px)) minmax(440px,1fr);gap:14px;padding:14px 20px 20px;min-height:0;flex-shrink:0}
.tel{display:flex;flex-direction:column;background:var(--chat);border-radius:22px;overflow:hidden;border:1px solid var(--linea);height:calc(100dvh - 200px);min-height:520px}
.cab{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--linea)}
.cab .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:0 0 auto;overflow:hidden}
.cab .av img{width:100%;height:100%}
.cab b{display:block;font-size:14.5px;font-weight:700}
.cab small{font-size:12px;color:var(--suave)}
.msgs{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.vacio{margin:auto;text-align:center;color:var(--suave);font-size:13px;max-width:220px;line-height:1.4}
.m{max-width:86%;padding:7px 9px 5px;border-radius:10px;font-size:14px;line-height:1.38;box-shadow:0 1px .5px rgba(0,0,0,.08);white-space:normal;overflow-wrap:anywhere;animation:entra .22s cubic-bezier(.2,.8,.2,1)}
.m.bot{align-self:flex-start;background:#fff;border-top-left-radius:3px}
.m.yo{align-self:flex-end;background:var(--yo);border-top-right-radius:3px}
.m .h{display:block;text-align:right;font-size:10.5px;color:#8A857C;margin-top:2px}
.m a{color:#0B6BCB;text-decoration:none;font-weight:600}
.m.esc{align-self:center;background:#FFF4C7;font-size:12px;color:#5C5032;box-shadow:none}
@keyframes entra{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 8px}
.chip{border:1px solid #CFE9DA;background:#fff;color:#0E6B45;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;transition:transform .12s ease}
.chip:active{transform:scale(.96)}
.chip.foto{color:var(--tinta);border-color:var(--linea)}
.barra{display:flex;gap:8px;padding:8px 10px;background:#F7F5F1;border-top:1px solid var(--linea)}
.barra input{flex:1;border:1px solid var(--linea);border-radius:999px;padding:10px 14px;font:inherit;font-size:16px;background:#fff;min-width:0}
.barra input:focus{outline:2px solid #B7DCC8;outline-offset:0}
.barra button{width:42px;height:42px;border-radius:50%;border:0;background:var(--ok);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.escribiendo{align-self:flex-start;background:#fff;border-radius:10px;padding:8px 12px;display:none;gap:4px}
.escribiendo.si{display:flex}
.escribiendo i{width:6px;height:6px;border-radius:50%;background:#9A958C;animation:pt 1s infinite}
.escribiendo i:nth-child(2){animation-delay:.15s}.escribiendo i:nth-child(3){animation-delay:.3s}
@keyframes pt{0%,60%,100%{opacity:.3}30%{opacity:1}}
.pan{border-radius:22px;overflow:hidden;border:1px solid var(--linea);background:#fff;height:calc(100dvh - 200px);min-height:520px;display:flex;flex-direction:column}
.pan .cab{border-radius:0}
.pan iframe{flex:1;border:0;width:100%}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1);z-index:9;max-width:92vw;text-align:center}
.toast.si{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pie{font-size:12px;color:var(--suave);text-align:center;padding:0 20px 16px}
@media (max-width:1399px){.escena{grid-template-columns:repeat(3,minmax(0,1fr))}.pan{grid-column:1/-1;height:760px}}
@media (max-width:899px){
  .tabs{display:flex}
  .escena{display:block;padding:10px 12px 12px}
  .tel,.pan{display:none;height:calc(100dvh - 190px);min-height:440px}
  .tel.vis,.pan.vis{display:flex}
  .guia{padding:10px 12px 0}
  .top{padding:12px}
  .aviso{padding:8px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const BOT=(()=>{const defs={"./negocio":function(module,exports,require){// Datos de cada restaurante: negocios/<cliente>.json (menú, precios, sucursales, horario, domicilio).
// El bot nunca inventa: todo lo que dice del negocio sale de este archivo.
// Lo que el cliente no ha confirmado (por ejemplo un horario) se deja vacío y el bot dice que una persona lo confirma.
const fs = require("fs");
const path = require("path");

const norm = s => (s || "").toString().trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
// "moneda" en negocios/<cliente>.json: HNL (lempiras, por defecto), GTQ (quetzales) o USD (dólares, El Salvador)
const MONEDAS = {
  HNL: { simbolo: "L ", locale: "es-HN", min: 0, pais: "Honduras" },
  GTQ: { simbolo: "Q", locale: "es-GT", min: 0, pais: "Guatemala" },
  USD: { simbolo: "$", locale: "en-US", min: 2, pais: "El Salvador" },
};
const dinero = (moneda = "HNL") => {
  const m = MONEDAS[moneda] || MONEDAS.HNL;
  return n => m.simbolo + (+n || 0).toLocaleString(m.locale, { minimumFractionDigits: m.min, maximumFractionDigits: 2 });
};
const L = dinero("HNL");

function preparar(n) {
  const errores = [];
  if (!n || typeof n !== "object") throw new Error("El archivo del negocio no es un objeto JSON.");
  if (!n.nombre) errores.push("falta nombre");
  if (!Array.isArray(n.sucursales) || !n.sucursales.length) errores.push("falta al menos una sucursal");
  if (!Array.isArray(n.menu) || !n.menu.length) errores.push("falta el menú");
  if (n.moneda && !MONEDAS[n.moneda]) errores.push(`moneda desconocida: ${n.moneda} (use ${Object.keys(MONEDAS).join(", ")})`);
  const items = [];
  const ids = new Set();
  for (const c of n.menu || []) for (const it of c.items || []) {
    if (!it.id || !it.nombre || !(+it.precio >= 0)) { errores.push(`producto incompleto en ${c.categoria}: ${JSON.stringify(it)}`); continue; }
    if (ids.has(it.id)) errores.push(`id repetido: ${it.id}`);
    ids.add(it.id);
    items.push({ ...it, precio: +it.precio, cupos: Math.max(0, Math.round(+it.cupos || 0)), categoria: c.categoria, num: items.length + 1,
      minimo: Math.max(1, Math.round(+it.minimo || 1)), sucursales: Array.isArray(it.sucursales) ? it.sucursales.map(String) : null,

  }
  function domicilioTexto() {
    if (PROPIO) return `¡Sí! 🛵 Llevamos a domicilio${N.domicilio.zona ? ` ${N.domicilio.zona}` : ""}. El costo del envío depende de la distancia: ${N.repartidores && N.repartidores.length ? "el repartidor se lo dice por aquí y usted lo acepta antes de que preparemos su pedido" : "se lo confirmamos al tomar su pedido"}.`;
    const apps = (N.domicilio.apps || []).filter(a => a.nombre);
    const lista = apps.map(a => `• ${a.nombre}${a.url ? `: ${a.url}` : ""}`).join("\n");
    return `Por ahora no tenemos envío propio.${apps.length ? ` A domicilio puede pedirnos por:\n${lista}` : ""}\n\nTambién puede hacer su pedido aquí y pasar a recogerlo sin hacer fila.`;
  }

  // "1 x2, 4", "2 del 3", "2 combos 3 piezas", "papas grandes y un refresco", "el combo 1 con 4 papas"
  // one piece of the order -> { it, cantidad, n } (n = list number the customer used, if any)
  const RELLENO = new Set(["x", "numero", "no", "orden", "pedido", "porcion", "solo", "nada", "mas", "tambien", "regaleme", "mandeme", "das", "mi", "favor", "y", "con"]);
  // every word the customer wrote is explained by the product, the quantity or the list number
  const completo = (p, r) => {
    const nombre = new Set(N.tokens(r.it.nombre));
    return N.tokens(p).every(w => nombre.has(w) || RELLENO.has(w) || w === String(r.cantidad) || w === r.n);
  };
  function uno(p) {
    const l = p.replace(/^(?:(?:quiero|me da|me das|deme|dame|regaleme|mandeme|para mi|y|con)\s+)+/, "");
    let m, r = null;
    if ((m = l.match(/^(?:el |la |numero |#)?(\d+)\s*(?:x|×|\*|por)\s*(\d+)$/))) r = { it: item(m[1]), n: m[1], cantidad: +m[2] };
    else if ((m = l.match(/^(\d+)\s*(?:del?|de la)\s*(?:numero |#)?(\d+)$/))) r = { it: item(m[2]), n: m[2], cantidad: +m[1] };
    else if ((m = l.match(/^(?:el |la |numero |#)(\d+)$/)) || (m = p.match(/^(\d+)$/))) r = { it: item(m[1]), n: m[1], cantidad: 1 };
    if (r) return r.it ? r : null;
    // a quantity in front wins over a number that is part of the name ("2 refrescos" = two Refresco 2 litros)
    const ops = [];
    let it;
    if ((m = l.match(/^(\d+)\s+(.+)$/)) && (it = item(m[2]))) ops.push({ it, cantidad: +m[1], n: null });
    // "combo 1", "2 combo numero 1": a word of the product plus its number in the list
    if ((m = l.match(/^(?:(\d+)\s+)?([a-z][a-z\s]*?)\s*(?:del? )?(?:numero |no |#)?(\d+)$/)) && (it = item(m[3]))) {
      const w = N.tokens(m[2]), nombre = N.tokens(it.nombre);
      // unless the number belongs to a product's name: "la marea de 4" is Marea x4, not number 4 on the list
      const porNombre = item(m[2] + " " + m[3]);
      if (w.length && w.every(x => nombre.includes(x)) && !(porNombre && porNombre !== it && N.tokens(porNombre.nombre).includes(m[3]))) ops.push({ it, cantidad: m[1] ? +m[1] : 1, n: m[3] });
    }
    if ((m = l.match(/^(.+?)\s*(?:x|×)\s*(\d+)$/)) && (it = item(m[1]))) ops.push({ it, cantidad: +m[2], n: null });
    if ((it = item(l))) ops.push({ it, cantidad: 1, n: null });
    return ops.find(o => completo(p, o)) || ops[0] || null;
  }
  const conectores = s => s.replace(/^(?:con|y|mas|tambien|ademas)\s+/, "").trim();
  // a piece with two products and no comma ("el combo 1 con 4 papas") is cut where both halves make sense,
  // trying the longest first half first
  function partir(p, hondo) {
    const r = uno(p);
    if (r && completo(p, r)) return [r];
    const w = p.split(/\s+/);
    if (hondo < 3) for (let i = w.length - 1; i >= 1; i--) {
      const a = conectores(w.slice(0, i).join(" ")), b = conectores(w.slice(i).join(" "));
      if (!a || !b) continue;
      const ra = uno(a);
      if (!ra || !completo(a, ra)) continue;
      const rb = partir(b, hondo + 1);
      if (rb) return [ra, ...rb];
    }
    return hondo ? null : r ? [r] : null;
  }
  // last try: "pizza con papas" -> papas, and pizza is asked about
  const porConector = p => p.split(/\s+(?:con|y)\s+/).map(conectores).filter(Boolean);
  const NUMEROS = ["dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez"];
  function leerPedido(text) {
    const encontrados = [], dudas = [];
    const partes = norm(text).replace(/\bun[oa]?\s+(?=[a-z])/g, "1 ").replace(/\b(dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\b/g, w => String(NUMEROS.indexOf(w) + 2)).split(/,|;|\n|\+|\by\b|\btambien\b|\bmas\b|\b(?:quiero|dame|deme|me das?|regaleme|mandeme|ponme|agregue|agregame)\b/).map(p => p.replace(/[^\w\s#×*]/g, " ").replace(/\s+/g, " ").trim()).filter(Boolean);
    for (const p of partes) {
      let rs = partir(p, 0);
      if (rs && rs.length === 1 && !completo(p, rs[0]) && porConector(p).length > 1) {
        rs = [];
        for (const q of porConector(p)) { const r = partir(q, 0); if (r) rs.push(...r); else if (q.length > 1) dudas.push(q); }
      }
      if (rs) rs.forEach(r => encontrados.push({ id: r.it.id, cantidad: r.cantidad }));
      else if (p.length > 1) dudas.push(p);
    }
    return { encontrados, dudas };
  }

  function fresh() { return { step: "inicio", data: {}, seq: 1000 }; }

  // match a reply against the buttons we offered: by number or label
  function pick(text, options) {
    const t = norm(text).replace(/[^\w\s]/g, "").trim();
    if (/^\d+$/.test(t)) return options[+t - 1] || null;
    return options.find(o => norm(o) === norm(text)) || options.find(o => t.length > 2 && norm(o).startsWith(t)) || null;
  }

  function handle(state, input, now, ctx = {}) {
    const s = state ? JSON.parse(JSON.stringify(state)) : fresh();
    const text = (input || "").toString();
    const t = norm(text);
    const out = [];
    const offered = s.offer || [];
    s.offer = null;
    const say = m => { m = typeof m === "string" ? { text: m } : m; if (m.buttons) s.offer = m.buttons; out.push(m); };
    const go = step => { s.step = step; };
    let d = s.data;
    SUC = d.sucursal || null;
    const reset = o => { s.data = d = o || {}; SUC = d.sucursal || null; };
    const done = () => ({ state: s, messages: out });

    const menuInicio = pre => say({ text: (pre ? pre + "\n\n" : "") + "¿En qué le ayudo?", buttons: MENU });
    const carritoTexto = () => { const c = cuenta(N, d.carrito); return c.lineas.map(l => lineaTexto(l, N.L)).join("\n") + `\n\n*Total: ${N.L(c.total)}*`; };
    const pedirSucursal = (siguiente, pregunta) => {
      if (!N.variasSucursales) { d.sucursal = SUC = N.sucursales[0].id; return false; }
      d.despues = siguiente; go("sucursal");
      say({ text: pregunta, buttons: N.sucursales.map(x => x.nombre) });
      return true;
    };
    const pedirProductos = () => {
      go("carrito");
      say(`¿Qué le preparamos? Escriba el número y la cantidad, por ejemplo *1 x2* (dos del número 1). Puede pedir varios separados por coma.\n\n${menuTexto(true)}`);
    };
    const mostrarCarrito = pre => {
      go("carrito_ok");
      say({ text: `${pre ? pre + "\n\n" : ""}🧾 *Su pedido*\n${carritoTexto()}`, buttons: ["Confirmar pedido", "Agregar algo más", "Empezar de nuevo"] });
    };
    const empezarPedido = (encontrados = [], domicilio = null) => {
      reset({ carrito: encontrados, domicilio });
      if (pedirSucursal("pedido", domicilio ? "¿De qué sucursal se lo mandamos?" : "¿En qué sucursal lo recoge?")) return;
      encontrados.length ? mostrarCarrito() : pedirProductos();
    };
    const pasarPersona = () => {
      reset();
      if (pedirSucursal("persona", "Claro. ¿Con qué sucursal le comunico?")) return;
      handoff();
    };
    // cupos: day and batch
    const libre = (fecha, tanda) => CUP.porTanda - ((ctx.ocupados && ctx.ocupados(fecha, tanda, d.sucursal)) || 0);
    const unaTanda = CUP && CUP.tandas.length === 1;
    const tandasCon = fecha => CUP.tandas.filter(x => libre(fecha, x) >= d.cupos);
    const cupTxt = n => `${n} ${n === 1 ? "cupo" : "cupos"}`;
    const mayus = x => x.replace(/^\p{L}/u, c => c.toUpperCase());
    const pedirFecha = pre => {
      d.cupos = cuposDe(N, d.carrito);
      const fs = fechasCupos(N, now);
      d.fechas = fs.map(f => ({ ...f, lleno: !tandasCon(f.fecha).length }));
      go("dia_cupo");
      if (!fs.length) { say({ text: `${pre ? pre + "\n\n" : ""}Por ahora no hay días abiertos para pedir. ¿Lo anoto en la lista de espera?`, buttons: [ESPERA, "Volver al inicio"] }); return; }
      const abiertos = d.fechas.filter(f => !f.lleno);
      say({ text: `${pre ? pre + "\n\n" : ""}📅 ¿Para qué día?${CUP.porPedido ? (CUP.nota && !CUP.salsas.length ? ` ${CUP.nota}` : "") : ` Su pedido usa ${cupTxt(d.cupos)}.`}${d.fechas.some(f => f.lleno) ? `\nYa se llenó: ${d.fechas.filter(f => f.lleno).map(f => f.etiqueta).join(", ")}.` : ""}`, buttons: [...abiertos.map(f => mayus(f.etiqueta)), ESPERA] });
    };
    const pedirTanda = pre => {
      const f = d.fechas.find(x => x.fecha === d.fecha);
      const ts = tandasCon(d.fecha);
      if (!ts.length) { f.lleno = true; d.fecha = null; pedirFechaOtra(`${pre ? pre + " " : ""}${lleno(f)}`); return; }
      if (unaTanda) { d.tanda = ts[0]; go("nombre"); say(`${pre ? pre + "\n\n" : ""}📅 ${mayus(f.etiqueta)}.\n\n¿A nombre de quién lo dejo?`); return; }
      go("tanda");
      say({ text: `${pre ? pre + "\n\n" : ""}🕒 ¿En qué tanda? (${f.etiqueta})`, buttons: ts.map(x => `${x} · quedan ${libre(d.fecha, x)}`) });
    };
    const lleno = f => CUP.porPedido || unaTanda ? `El ${f.etiqueta} ya se llenaron los apartados.` : `El ${f.etiqueta} ya no tiene ${cupTxt(d.cupos)} libres en ninguna tanda.`;
    const pedirFechaOtra = pre => {
      const abiertos = d.fechas.filter(f => !f.lleno && tandasCon(f.fecha).length);
      go("dia_cupo");
      say({ text: `${pre}\n\n${abiertos.length ? "¿Otro día, o lo anoto en la lista de espera?" : "¿Lo anoto en la lista de espera? Si alguien cancela, le escribimos."}`, buttons: [...abiertos.map(f => mayus(f.etiqueta)), ESPERA] });
    };
    // an encargo has its own date: no day, batch or hour to ask
    const porEncargo = () => {
      const e = encargoDe(N, d.carrito);
      if (!e) return false;
      d.encargo = e; d.dia = e.etiqueta; go("nombre"); say(`🗓️ Es para el *${e.etiqueta}*. ¿A nombre de quién lo dejo?`);
      return true;
    };
    const despuesDeEntrega = () => {
      if (porEncargo()) return;
      if (CUP) { pedirFecha(); return; }
      go("hora"); say({ text: `¿Para cuándo lo quiere?${N.tiempoPreparacion ? ` Lo tenemos listo en unos ${N.tiempoPreparacion}.` : ""}`, buttons: HORAS });
    };
    const handoff = () => {
      const b = N.sucursales.find(x => x.id === d.sucursal) || N.sucursales[0];
      say({ text: `Listo, le pasé la conversación a una persona de *${b.nombre}*. Le escribe por aquí mismo. 🙌${b.telefono ? `\n\nSi es urgente: ${b.telefono}` : ""}`, buttons: ["Volver al inicio"] });
      s.handoff = b.nombre; go("post");
    };

    const empezarReserva = () => {
      reset({});
      if (pedirSucursal("reserva", "¿En qué sucursal quiere la mesa?")) return;
      pedirDia();
    };
    const pedirDia = () => { go("res_dia"); say({ text: `📅 Con gusto le apartamos mesa${N.variasSucursales ? "" : ` en *${N.nombre}*`}. ¿Para qué día?`, buttons: ["Hoy", "Mañana", "Otro día"] }); };
    const cerrarReserva = () => {
      const b = N.sucursales.find(x => x.id === d.sucursal) || N.sucursales[0];
      const n = "RES-" + (++s.seq);
      const grupo = RES.grupoDesde && d.personas >= RES.grupoDesde;
      s.lead = { tipo: "reservacion", n, nombre: d.nombre, sucursal: b.nombre, sucursalId: b.id, dia: d.dia, hora: d.hora, personas: d.personas, ocasion: d.ocasion || "", estado: "por_confirmar", ...(grupo ? { grupo: true } : {}),
        resumen: `${d.dia} · ${d.hora} · ${d.personas} ${d.personas === 1 ? "persona" : "personas"}${d.ocasion ? " · " + d.ocasion : ""}` };
      say({ text: `📝 *Reservación ${n} recibida, ${d.nombre.split(" ")[0]}.*\n\n📅 ${d.dia}, ${d.hora}\n👥 ${d.personas} ${d.personas === 1 ? "persona" : "personas"}${d.ocasion ? `\n🎉 ${d.ocasion}` : ""}\n📍 ${b.nombre}\n\n${grupo ? "Como es un grupo grande, una persona del restaurante le escribe por aquí para afinar los detalles." : "En un momento le confirmamos por aquí que la mesa queda apartada."}${RES.nota ? `\n${RES.nota}` : ""}`, buttons: ["Ver el menú y precios", "Volver al inicio"] });
      go("post");
    };

    // "cancelen mi pedido": the bot never cancels an order that is already in the kitchen; it tells the branch of
    // the customer's last order (ctx.ultimo, from server.js) so a person confirms. Orders waiting for payment cancel in "pago".
    if (quiereCancelar(t) && (!state || ["inicio", "post", "menu"].includes(s.step))) {
      const u = ctx.ultimo;
      reset(u ? { sucursal: u.sucursalId } : {});
      if (!u) { s.handoffMotivo = "Quiere cancelar un pedido"; if (pedirSucursal("persona", "Claro. ¿En qué sucursal hizo el pedido?")) return done(); handoff(); return done(); }
      const b = N.sucursales.find(x => x.id === u.sucursalId) || N.sucursales[0];
      s.handoff = b.nombre; s.handoffMotivo = `Quiere cancelar el pedido ${u.n}`; go("post");
      say({ text: `Le avisé a *${b.nombre}* que quiere cancelar el pedido *${u.n}*. Una persona le confirma por aquí mismo.${b.telefono ? `\n\nSi es urgente: ${b.telefono}` : ""}`, buttons: ["Volver al inicio"] });
      return done();
    }

    if (!state || SALUDO.test(t)) {
      reset(); go("inicio");
      if (!/^(menu principal|inicio|0)$/.test(t)) say(`¡Hola! 👋 Gracias por escribirle a *${N.nombre}*. Le atiendo a cualquier hora: menú y precios, ${PROPIO ? "pedidos para recoger o a domicilio" : "pedidos para recoger"}${RES ? ", reservaciones" : ""} y ${N.variasSucursales ? "sucursales" : "ubicación"}.`);
      menuInicio();
      return done();
    }

    switch (s.step) {
      case "inicio": {
        const o = pick(text, MENU);
        if (o === OP.persona || (!o && quierePersona(t))) { pasarPersona(); break; }
        if (RES && (o === OP.reservar || (!o && quiereReservar(t)))) { empezarReserva(); break; }
        if (o === OP.domicilio && PROPIO) { empezarPedido([], true); break; }
        if (o === OP.domicilio || (!o && quiereDomicilio(t))) { reset(); go("post"); say({ text: domicilioTexto(), buttons: [PROPIO ? OP.domicilio : OP.pedido, OP.menu] }); break; }
        if (o === OP.sucursales || (!o && quiereSucursal(t))) { reset(); go("post"); say(sucursalesTexto()); say({ text: "¿Algo más?", buttons: [OP.pedido, OP.menu] }); break; }
        if (o === OP.menu || (!o && quiereMenu(t) && !quierePedir(t))) { reset(); go("menu"); say({ text: `🍽️ *Menú de ${N.nombre}*\n\n${menuTexto(false)}`, buttons: [OP.pedido, "Volver al inicio"] }); break; }
        const leido = o ? { encontrados: [] } : leerPedido(text);
        if (o === OP.pedido || quierePedir(t) || leido.encontrados.length) { empezarPedido(leido.encontrados); break; }
        menuInicio("Disculpe, no le entendí bien. Puede tocar una opción o escribirme con sus palabras, por ejemplo «quiero 2 combos de 3 piezas».");
        break;
      }

      case "menu": {
        const o = pick(text, offered);
        if (o === "Volver al inicio") { reset(); go("inicio"); menuInicio(); break; }
        const leido = o ? { encontrados: [] } : leerPedido(text);
        if (o === OP.pedido || leido.encontrados.length || quierePedir(t)) { empezarPedido(leido.encontrados); break; }
        go("inicio"); return handle(s, text, now, ctx);
      }

      case "sucursal": {
        const b = N.sucursal(pick(text, N.sucursales.map(x => x.nombre)) || text);
        if (!b) { say({ text: "¿Cuál de estas sucursales?", buttons: N.sucursales.map(x => x.nombre) }); break; }
        d.sucursal = SUC = b.id;
        if (d.despues === "persona") { handoff(); break; }
        if (d.despues === "reserva") { pedirDia(); break; }
        say(`Perfecto, sucursal *${b.nombre}*.`);
        d.carrito && d.carrito.length ? mostrarCarrito() : pedirProductos();
        break;
      }

      case "carrito": {
        if (quierePersona(t)) { pasarPersona(); break; }
        const { encontrados, dudas } = leerPedido(text);
        if (!encontrados.length) { say(`No encontré eso en el menú. Escriba el número del producto y la cantidad, por ejemplo *1 x2*.\n\n${menuTexto(true)}`); break; }
        d.carrito = (d.carrito || []).concat(encontrados);
        mostrarCarrito(dudas.length ? `No encontré en el menú: «${dudas.join("», «")}». Una persona puede ayudarle con eso.` : "");
        break;
      }

      case "carrito_ok": {
        const o = pick(text, offered);
        if (o === "Confirmar pedido" || /^(si|listo|confirmo|confirmar|eso es todo|es todo|nada mas|ya)\b/.test(t)) {
          const mal = revisarPedido(N, d.carrito, d.sucursal, now);
          if (mal) { mostrarCarrito(`${mal} Puede agregar algo más o empezar de nuevo.`); break; }
          if (CUP && !encargoDe(N, d.carrito) && !cuposDe(N, d.carrito)) { pedirProductos(); out[out.length - 1].text = "Los adicionales van con un combo. ¿Qué combo le preparamos?\n\n" + out[out.length - 1].text; break; }
          if (CUP && CUP.salsas.length && !encargoDe(N, d.carrito)) {
            const i = d.carrito.findIndex(l => !l.nota && (N.items.find(x => x.id === l.id) || {}).cupos);
            if (i >= 0) { d.salsaDe = i; go("salsa"); say({ text: `🌶️ ¿Qué salsa para ${d.carrito[i].cantidad > 1 ? `los ${d.carrito[i].cantidad} ` : "el "}*${N.items.find(x => x.id === d.carrito[i].id).nombre}*?${CUP.nota ? ` ${CUP.nota}` : ""}`, buttons: CUP.salsas }); break; }
          }
          if (PROPIO && d.domicilio === null) { go("entrega"); say({ text: "¿Lo recoge o se lo llevamos?", buttons: ENTREGA }); break; }
          if (d.domicilio) { go("direccion"); say("🛵 ¿A qué dirección se lo llevamos? Colonia, calle o pasaje y una seña para encontrar la casa."); break; }
          despuesDeEntrega(); break;
        }
        if (o === "Agregar algo más") { pedirProductos(); break; }
        if (o === "Empezar de nuevo") { d.carrito = []; pedirProductos(); break; }
        const { encontrados } = leerPedido(text);
        if (encontrados.length) { d.carrito = d.carrito.concat(encontrados); mostrarCarrito(); break; }
        mostrarCarrito("Toque una opción, o escriba otro producto para agregarlo.");
        break;
      }

      case "entrega": {
        const o = pick(text, ENTREGA) || (/domicilio|lleven|llevar a|envi|casa/.test(t) ? ENTREGA[1] : /recog|paso|pasar|llevar$/.test(t) ? ENTREGA[0] : null);
        if (!o) { say({ text: "¿Lo recoge o se lo llevamos?", buttons: ENTREGA }); break; }
        d.domicilio = o === ENTREGA[1];
        s.step = "carrito_ok"; return handle({ ...s, offer: ["Confirmar pedido"] }, "Confirmar pedido", now, ctx);
      }
      case "direccion": {
        if (t.length < 6) { say("Para que el repartidor llegue bien, escríbame la colonia, la calle o pasaje y una seña. Por ejemplo: Col. Trejo, 5 calle, casa blanca frente a la pulpería."); break; }
        d.direccion = text.trim().slice(0, 200); d.hora = "A domicilio, lo antes posible";
        if (porEncargo()) break;
        if (CUP) { pedirFecha(); break; }
        go("nombre"); say("¿A nombre de quién lo dejo?");
        break;
      }
      case "salsa": {
        const o = pick(text, CUP.salsas) || CUP.salsas.find(x => norm(x).split(" ").some(w => w.length > 3 && t.includes(w)));
        if (!o) { say({ text: "¿Cuál de estas salsas?", buttons: CUP.salsas }); break; }
        d.carrito[d.salsaDe].nota = "Salsa " + o;
        s.step = "carrito_ok"; return handle({ ...s, offer: ["Confirmar pedido"] }, "Confirmar pedido", now, ctx);
      }
      case "dia_cupo": {
        const o = pick(text, offered.length ? offered : [ESPERA]);
        if (o === "Volver al inicio") { reset(); go("inicio"); menuInicio(); break; }
        if (o === ESPERA || /espera|anot/.test(t)) {
          d.espera = true;
          const llenos = (d.fechas || []).filter(f => f.lleno);
          d.dia = llenos.length === 1 ? llenos[0].etiqueta : "el próximo día con cupo";
          go("nombre"); say("Con gusto. ¿A nombre de quién lo anoto?");
          break;
        }
        const f = (d.fechas || []).find(x => o ? norm(x.etiqueta) === norm(o) : t.length > 2 && norm(x.etiqueta).startsWith(t));
        if (!f) { pedirFechaOtra("¿Cuál de estos días?"); break; }
        if (f.lleno) { pedirFechaOtra(lleno(f)); break; }
        d.fecha = f.fecha; d.dia = f.etiqueta;
        pedirTanda();
        break;
      }
      case "tanda": {

      `👤 ${p.nombre || "Sin nombre"} · +${digits(p.tel)}`,
      `📍 ${p.direccion}`,
      ...(p.lineas || []).map(l => lineaTexto(l, negocio.L)),
      `💰 Comida ${negocio.L(p.total)}${p.envio != null ? ` + envío ${negocio.L(p.envio)} = cobrar ${negocio.L(p.total + p.envio)}` : ""}${p.pagado ? " (la comida ya está pagada)" : ""}`,
      `Mapa: ${mapa(p, negocio)}`,
      `Cliente: https://wa.me/${digits(p.tel)}`,
    ];
    const pide = cotiza
      ? `¿Cuánto es el envío? Conteste *ENVÍO* y el precio, por ejemplo *ENVÍO 60*. El cliente lo acepta y entonces pasa a cocina. Si no puede llevarlo, conteste *NO PUEDO*.`
      : `Conteste *SALGO* cuando salga, *ENTREGADO* cuando lo entregue o *NO PUEDO* para pasárselo a otro.`;
    const body = `🛵 *${r.nombre}, ${cotiza ? "nuevo envío" : "tiene una entrega"}: ${p.n}*\n\n${lineas.join("\n")}\n\n${pide}`;
    return { titulo, lineas: [...lineas, cotiza ? "Conteste ENVÍO y el precio (ENVÍO 60) o NO PUEDO" : "Conteste SALGO, ENTREGADO o NO PUEDO"], body };
  }

  // the free-est driver of the order's branch; ties go to whoever waited longest for a delivery
  function escoger(p, excluir = []) {
    const b = negocio.sucursales.find(s => s.nombre === p.sucursal);
    const ok = lista.filter(r => !excluir.includes(r.id) && (!r.sucursal || (b && r.sucursal === b.id)));
    const ultima = r => Math.max(0, ...store.pedidos.filter(x => x.repartidor && x.repartidor.id === r.id).map(x => new Date(x.t_asignado || 0).getTime()));
    return ok.map(r => [r, enCalle(r).length, ultima(r)]).sort((a, b) => a[1] - b[1] || a[2] - b[2])[0]?.[0] || null;
  }

  // a new delivery order (estado por_envio: the driver quotes the delivery first), a ready one without a driver,
  // or the owner / a driver asking for another driver
  function asignar(n, { excluir = [], por = "bot" } = {}) {
    const p = store.getPedido(n);
    if (!p || p.entrega !== "domicilio" || !activo) return null;
    const r = escoger(p, excluir);
    if (!r) {
      store.updatePedido(n, { repartidor: null });
      log(`[${n}] sin repartidor disponible`);
      track(aDueno(p, `${p.n} no tiene repartidor`, [`📍 ${p.direccion}`, p.estado === "por_envio" ? `Nadie ha dicho el precio del envío. Escríbale a un repartidor, o conteste *ENVÍO 60 ${num(p)}* con el precio.` : "Ningún repartidor lo pudo llevar. Escríbale a uno o asígnelo desde el panel."]));
      return null;
    }
    const antes = p.repartidor;
    const q = store.updatePedido(n, { repartidor: { id: r.id, nombre: r.nombre, tel: "+" + r.tel }, t_asignado: now().toISOString(), rechazos: excluir, asignadoPor: por });
    const f = fichaRepartidor(q, r);
    log(`[${n}] asignado a ${r.nombre}${antes ? ` (antes ${antes.nombre})` : ""}`);
    track(avisos.enviar(waAddr(r.tel), f.body, f));
    const previo = antes && antes.id !== r.id && por !== "repartidor:" + antes.id && lista.find(x => x.id === antes.id);
    if (previo) aRep(previo, `ℹ️ ${previo.nombre}, la entrega *${q.n}* se le pasó a ${r.nombre}. Ya no tiene que llevarla.`);
    if (!antes && q.estado === "listo") track(avisos.enviar(waAddr(q.tel), `✅ ¡${nom(q)}, su pedido *${q.n}* ya está listo! Lo lleva *${r.nombre}*; le avisamos por aquí cuando salga.`));
    track(aDueno(q, q.estado === "por_envio" ? `${q.n}: ${r.nombre} cotiza el envío` : `${q.n} asignado a ${r.nombre}`, [`📍 ${q.direccion}`, `💰 Comida ${negocio.L(q.total)}`,
      antes ? `${antes.nombre} no lo pudo llevar.` : q.estado === "por_envio" ? "Cuando el cliente acepte el precio del envío, le llega el pedido para cocina." : "Se le avisó por WhatsApp."]));
    return q;
  }

  // the price of the delivery, from the driver ("ENVÍO 60") or the owner ("ENVÍO 60 1004"): the customer accepts it before cooking
  function fijarEnvio(p, precio, por) {
    const cotiza = p.estado === "por_envio";
    const q = store.updatePedido(p.n, { envio: precio, envioPor: por, t_envio: now().toISOString() });
    const total = negocio.L(q.total + precio);
    track(avisos.enviar(waAddr(q.tel), cotiza
      ? `🛵 ${nom(q)}, el envío de su pedido *${q.n}* a ${q.direccion} cuesta *${negocio.L(precio)}*.\nTotal: *${total}* (comida ${negocio.L(q.total)} + envío), se paga al recibir.\n\n¿Lo confirmamos? Conteste *SÍ* para mandarlo a cocina, *RECOGER* si prefiere pasar por él, o *CANCELAR*.`
      : `🛵 ${nom(q)}, el envío de su pedido *${q.n}* cuesta *${negocio.L(precio)}*. Total a pagarle al repartidor: *${total}*.`));
    log(`[${q.n}] envío ${precio} (${por})`);
    return q;
  }

  // the customer's answer to the delivery price -> the reply, or null if this number has no quote waiting
  function respuestaCliente(from, text) {
    const p = store.pedidos.findLast(x => x.estado === "por_envio" && x.envio != null && digits(x.tel) === digits(from));
    if (!p) return null;
    const t = norm(text), r = deRep(p);
    const si = /^(si|sí|ok|okey|okay|dale|va|esta bien|confirm|de acuerdo|claro|perfecto|listo)\b/.test(t) || t === "1";
    const recoger = /recog|recoj|paso yo|yo paso|voy yo|yo voy|paso por|pasar por/.test(t) || t === "2";
    const cancelar = /cancel|no gracias|muy caro|caro|^no\b/.test(t) || t === "3";
    const t0 = now().toISOString();
    if (si && !recoger && !cancelar) {
      const q = store.updatePedido(p.n, { estado: "nuevo", t_nuevo: t0, envioAceptado: true });
      track(avisos.ficha(q));
      aRep(r, `✅ El cliente aceptó el envío de *${q.n}* (${negocio.L(q.envio)}). Ya va a cocina; le avisamos cuando esté listo para recoger.`);
      log(`[${q.n}] envío aceptado`);
      return `✅ Listo, ${nom(q)}. Su pedido *${q.n}* ya va a cocina. Total: *${negocio.L(q.total + q.envio)}* con envío. Le avisamos por aquí cuando salga.`;
    }
    if (recoger) {
      const b = negocio.sucursales.find(s => s.nombre === p.sucursal);
      const q = store.updatePedido(p.n, { estado: "nuevo", t_nuevo: t0, entrega: "recoger", envio: null, repartidor: null, hora: p.diaFecha ? p.hora : "Lo antes posible" });
      track(avisos.ficha(q));
      aRep(r, `ℹ️ ${r ? r.nombre : ""}, el cliente de *${q.n}* mejor pasa a recogerlo. Ya no tiene que llevarlo.`);
      return `✅ Listo, ${nom(q)}. Su pedido *${q.n}* ya va a cocina y lo recoge en *${q.sucursal}*${b && b.direccion ? ` (${b.direccion})` : ""}. Total: *${negocio.L(q.total)}*. Le avisamos cuando esté listo.`;
    }
    if (cancelar) {
      const q = store.updatePedido(p.n, { estado: "cancelado", t_cancelado: t0, por: "cliente:envio" });
      aRep(r, `ℹ️ El cliente de *${q.n}* canceló el pedido. Ya no tiene que llevarlo.`);
      track(aDueno(q, `${q.n} cancelado por el cliente`, [`No aceptó el envío de ${negocio.L(q.envio)}.`, `Responder: https://wa.me/${digits(q.tel)}`]));
      return `Listo, cancelamos su pedido *${q.n}*. Si quiere, puede pedir para recoger. ¡Gracias por escribirnos!`;
    }
    return `¿Confirmamos su pedido *${p.n}* con envío de ${negocio.L(p.envio)} (total ${negocio.L(p.total + p.envio)})? Conteste *SÍ*, *RECOGER* si prefiere pasar por él, o *CANCELAR*.`;
  }

  // the kitchen marked it ready: the driver who quoted it goes for it (or one is picked now)
  function listo(p) {
    const r = deRep(p);
    if (!r) return asignar(p.n, { por: "cocina" });
    aRep(r, `🍽️ *${p.n} ya está listo* en ${p.sucursal}. Pase a recogerlo.\n📍 Para: ${p.nombre || "el cliente"}, ${p.direccion}\n💰 Cobrar ${negocio.L(p.total + (p.envio || 0))}${p.pagado ? " (la comida ya está pagada: cobre solo el envío)" : ""}\n\nCuando salga, conteste *SALGO*.`);
    track(avisos.enviar(waAddr(p.tel), `✅ ¡${nom(p)}, su pedido *${p.n}* ya está listo! Lo lleva *${r.nombre}*; le avisamos por aquí cuando salga.`));
    return p;
  }

  // what the customer hears when the order leaves or arrives (from the driver's WhatsApp or the panel)
  function enCamino(p) {
    const quien = p.repartidor ? ` con *${p.repartidor.nombre}*` : "";
    return avisos.enviar(waAddr(p.tel), `🛵 ¡${nom(p)}, su pedido *${p.n}* ya va en camino${quien}! Total: ${negocio.L(p.total + (p.envio || 0))}${p.envio ? ` (con envío de ${negocio.L(p.envio)})` : ""}.`);
  }
  function entregado(p) {
    return avisos.enviar(waAddr(p.tel), `✅ ${nom(p)}, su pedido *${p.n}* fue entregado. ¡Gracias por su compra en *${negocio.nombre}*!`);
  }

  // "ENVÍO 60 1004" from the owner or a branch
  function envioNegocio(text, por) {
    const m = norm(text).match(/^envio\s*(?:de\s*)?(?:l\.?\s*)?(\d{1,4})\s+(?:ped-?\s*)?(\d{3,})$/);
    if (!m) return null;
    const p = store.pedidos.findLast(x => x.n.replace(/\D/g, "").endsWith(m[2]));
    if (!p || p.entrega !== "domicilio" || ["entregado", "cancelado"].includes(p.estado)) return `No encuentro un envío abierto con el número ${m[2]}.`;
    fijarEnvio(p, +m[1], por);
    return `👍 Le avisamos al cliente que el envío de ${p.n} es ${negocio.L(+m[1])}.`;
  }

  // a message from a driver's number -> the bot's replies, or null if it is not a driver
  function mensaje(from, text) {
    const r = deTel(from);
    if (!r) return null;
    const t = norm(text);
    const mios = enCalle(r).sort((a, b) => new Date(a.t_asignado) - new Date(b.t_asignado));
    const lista = () => mios.map(p => `• *${p.n}* · ${ESTADO[p.estado]} · ${p.nombre || "Sin nombre"} · ${p.direccion}`).join("\n");
    if (!mios.length) return [{ text: `Hola, ${r.nombre}. No tiene entregas pendientes. Cuando haya una, le llega por aquí.` }];
    // "ENVÍO 60" (or "envío 60 1004" with several)
    const env = t.match(/^envio\s*(?:de\s*)?(?:l\.?\s*)?(\d{1,4})(?:\s+(?:ped-?\s*)?(\d{3,}))?$/);
    if (/^envio\b/.test(t) && !env) return [{ text: `Escriba *ENVÍO* y el precio en números, por ejemplo *ENVÍO 60*.` }];
    if (env) {
      const precio = +env[1], porCotizar = mios.filter(x => x.estado === "por_envio" && x.envio == null);
      const cual = env[2] ? mios.filter(x => num(x).endsWith(env[2])) : porCotizar.length === 1 ? porCotizar : mios.length === 1 ? mios : [];
      if (cual.length !== 1) return [{ text: `${r.nombre}, ¿de cuál entrega? Escriba el precio y el número, por ejemplo *ENVÍO ${precio} ${num(mios[0])}*:\n${lista()}` }];
      const q = fijarEnvio(cual[0], precio, "repartidor:" + r.id);
      return [{ text: q.estado === "por_envio"
        ? `👍 Le preguntamos al cliente si acepta el envío de ${negocio.L(precio)} para *${q.n}*. Si dice que sí, le avisamos y pasa a cocina.`
        : `👍 Le avisamos al cliente que el envío de *${q.n}* es ${negocio.L(precio)}: en total cobra ${negocio.L(q.total + precio)}.` }];
    }
    const accion = t === "1" || /\bsalgo\b|\bsali\b|\bvoy\b|en camino/.test(t) ? "salgo"
      : t === "2" || /entregad|\bentregue\b|\blisto\b/.test(t) ? "entregado"
      : t === "3" || /no puedo|no lo puedo|no voy|otro/.test(t) ? "nopuedo" : null;
    if (!accion) return [{ text: `${r.nombre}, sus entregas:\n${lista()}`, buttons: BOTONES }];
    // which order: the number in the message, else the only one that fits. SALGO with several ready takes them all.
    const numero = (text.match(/\d{3,}/) || [])[0];
    const listos = mios.filter(x => x.estado === "listo"), saliendo = mios.filter(x => x.estado === "en_camino");
    const ps = numero ? mios.filter(x => num(x).endsWith(numero))
      : accion === "salgo" ? listos
      : accion === "entregado" ? (saliendo.length === 1 ? saliendo : saliendo.length ? [] : listos.length === 1 ? listos : [])
      : mios.length === 1 ? mios : listos.length === 1 ? listos : [];
    if (accion === "salgo" && !numero && !ps.length) return [{ text: `${r.nombre}, todavía no hay ninguna lista para salir. Le avisamos por aquí cuando la cocina la tenga.\n${lista()}` }];
    if (ps.length !== 1 && !(accion === "salgo" && ps.length)) {
      const verbo = accion === "entregado" ? "ENTREGADO" : accion === "salgo" ? "SALGO" : "NO PUEDO";
      return [{ text: `${r.nombre}, ${numero ? `no encuentro la entrega ${numero} entre las suyas` : "tiene varias entregas"}. Escriba el número, por ejemplo *${verbo} ${num(mios[0])}*:\n${lista()}` }];
    }
    const t0 = now().toISOString();
    const p = ps[0];
    if (accion === "salgo") {
      const van = ps.filter(x => x.estado === "listo");
      if (!van.length) return [{ text: p.estado === "en_camino" ? `${p.n} ya estaba en camino. Cuando lo entregue, conteste *ENTREGADO*.` : `${p.n} todavía no está listo. Le avisamos por aquí cuando lo esté.`, buttons: p.estado === "en_camino" ? ["Entregado"] : undefined }];
      for (const x of van) {
        const q = store.updatePedido(x.n, { estado: "en_camino", t_en_camino: t0, por: "repartidor:" + r.id });
        track(enCamino(q));
        log(`[${x.n}] en camino con ${r.nombre}`);
      }
      const det = van.map(x => `*${x.n}* · ${x.nombre || "Sin nombre"}\n📍 ${x.direccion}\nMapa: ${mapa(x, negocio)}`).join("\n\n");
      return [{ text: `👍 Listo, ${r.nombre}. Le avisamos ${van.length > 1 ? "a los clientes" : "al cliente"} que va en camino.\n\n${det}\n\nCuando ${van.length > 1 ? "entregue cada uno, conteste *ENTREGADO* con el número" : "lo entregue, conteste *ENTREGADO*"}.`, buttons: ["Entregado"] }];
    }
    if (accion === "entregado") {
      if (!["listo", "en_camino"].includes(p.estado)) return [{ text: `${p.n} todavía no ha salido. Le avisamos cuando esté listo.` }];
      const q = store.updatePedido(p.n, { estado: "entregado", t_entregado: t0, por: "repartidor:" + r.id });
      track(entregado(q));
      track(aDueno(q, `${q.n} entregado por ${r.nombre}`, [`💰 ${negocio.L(q.total + (q.envio || 0))}${q.envio ? ` (con envío de ${negocio.L(q.envio)})` : ""}`, `📍 ${q.direccion}`]));
      log(`[${p.n}] entregado por ${r.nombre}`);
      const quedan = mios.filter(x => x.n !== p.n);
      return [{ text: `✅ Gracias, ${r.nombre}. *${p.n}* quedó entregado.${quedan.length ? `\n\nLe quedan:\n${quedan.map(x => `• *${x.n}* · ${ESTADO[x.estado]} · ${x.direccion}`).join("\n")}` : ""}` }];
    }
    // can't take it: next driver, never back to the ones who already said no
    if (p.estado === "en_camino") return [{ text: `${p.n} ya salió con usted. Si hay un problema, llame a la sucursal.` }];
    const q = asignar(p.n, { excluir: [...(p.rechazos || []), r.id], por: "repartidor:" + r.id });
    return [{ text: q ? `Entendido. *${p.n}* se le pasó a ${q.repartidor.nombre}.` : `Entendido. Le avisamos al negocio que *${p.n}* necesita otro repartidor.` }];
  }

  return { activo, lista, asignar, listo, mensaje, respuestaCliente, envioNegocio, enCamino, entregado, deTel, enCalle };
}

const ESTADO = { por_envio: "esperando su precio de envío", nuevo: "en cocina", cocina: "en cocina", listo: "lista para recoger", en_camino: "en camino" };

module.exports = { createRepartos, prepararRepartidores };

},"./store":function(module,exports,require){// Memoria del bot: conversaciones en curso y pedidos, guardados en archivos JSON.
// dir = carpeta de datos (DATA_DIR). Sin dir todo queda solo en memoria (pruebas).
// pedidos.json se escribe al instante (es lo que el dueño no puede perder);
// sessions.json se escribe agrupado cada 300 ms (si se pierde, el cliente solo vuelve a empezar).
// Pedidos cerrados con más de archivoDias pasan a archivo/pedidos-AAAA-MM.json, así pedidos.json no crece
// para siempre; resumen.json guarda el último número y las faltas ("No vino") de lo archivado.
// Con DATA_KEY los archivos quedan cifrados (cifrado.js).
const fs = require("fs");
const path = require("path");
const { leerJSON, escribirJSON } = require("./cifrado");

const ABIERTOS = ["por_pagar", "nuevo", "cocina"];
const tel = t => String(t || "").replace(/\D/g, "");

function createStore(dir, { ttlHours = 24, archivoDias = 30, now = () => Date.now(), cifra = null } = {}) {
  const f = dir ? { pedidos: path.join(dir, "pedidos.json"), sessions: path.join(dir, "sessions.json"), resumen: path.join(dir, "resumen.json"), archivo: path.join(dir, "archivo") } : null;
  const read = (file, empty) => leerJSON(file, empty, cifra);
  const write = (file, data) => escribirJSON(file, data, cifra, 1);

  const pedidos = f ? read(f.pedidos, []) : [];
  const sessions = new Map(Object.entries(f ? read(f.sessions, {}) : {}));
  // next order number: global, so two customers never get the same PED number
  const resumen = { seq: 0, faltas: {}, ...(f ? read(f.resumen, {}) : {}) };
  let seq = pedidos.reduce((m, l) => Math.max(m, +String(l.n || "").replace(/\D/g, "") || 0), Math.max(1000, resumen.seq));
  let timer = null, archivadoEl = 0;

  // move closed orders older than archivoDias to one file per month (at most once an hour)
  function archivar() {
    if (!f || now() - archivadoEl < 3600e3) return;
    archivadoEl = now();
    const limite = now() - archivoDias * 86400e3;
    const viejos = pedidos.filter(p => !ABIERTOS.includes(p.estado) && new Date(p.fecha).getTime() < limite);
    if (!viejos.length) return;
    fs.mkdirSync(f.archivo, { recursive: true });
    const porMes = {};
    for (const p of viejos) (porMes[String(p.fecha).slice(0, 7)] ||= []).push(p);
    for (const [mes, ls] of Object.entries(porMes)) {
      const file = path.join(f.archivo, `pedidos-${mes}.json`);
      write(file, read(file, []).concat(ls));
    }
    for (const p of viejos) if (p.estado === "no_vino") resumen.faltas[tel(p.tel)] = (resumen.faltas[tel(p.tel)] || 0) + 1;
    resumen.seq = seq;
    write(f.resumen, resumen);
    const quedan = pedidos.filter(p => !viejos.includes(p));
    pedidos.length = 0; pedidos.push(...quedan);
  }

  function flush() {
    clearTimeout(timer); timer = null;
    if (!f) return;
    fs.mkdirSync(dir, { recursive: true });
    const old = Date.now() - ttlHours * 2 * 3600e3;          // drop conversations idle for two TTLs
    for (const [k, v] of sessions) if ((v.updated || 0) < old) sessions.delete(k);
    write(f.sessions, Object.fromEntries(sessions));
    archivar();
    write(f.pedidos, pedidos);
  }
  const later = () => { if (f && !timer) timer = setTimeout(flush, 300); };

  return {
    pedidos,
    get seq() { return seq; },
    set seq(n) { seq = Math.max(seq, n); },
    // a conversation idle longer than the TTL starts over with a greeting
    getSession(key) {
      const s = sessions.get(key);
      if (s && Date.now() - (s.updated || 0) > ttlHours * 3600e3) { sessions.delete(key); return null; }
      return s || null;
    },
    setSession(key, s) { s.updated = Date.now(); sessions.set(key, s); later(); },
    deleteSession(key) { sessions.delete(key); later(); },
    addPedido(p) { pedidos.push(p); flush(); return p; },
    getPedido: n => pedidos.find(p => p.n === n) || null,
    // "No vino" of this number, counting the archived months too
    faltas: t => (resumen.faltas[tel(t)] || 0) + pedidos.filter(p => p.estado === "no_vino" && tel(p.tel) === tel(t)).length,
    updatePedido(n, cambios) { const p = pedidos.find(x => x.n === n); if (!p) return null; Object.assign(p, cambios); flush(); return p; },
    flush,
  };
}

module.exports = { createStore };

},"./ia":function(module,exports,require){// Modo IA (Claude): entiende mensajes libres ("me da 2 combos de 3 piezas para las 7, a nombre de Ana").

- Mensajes cortos de WhatsApp: 1 a 5 líneas. Una pregunta a la vez.

Lo que sabe del restaurante (no afirme nada más):
- Menú, precios, sucursales, direcciones, teléfonos y horarios: solo lo que devuelven las herramientas ver_menu y sucursales. Si un horario viene vacío, diga que una persona de la sucursal se lo confirma.

- ${N.pago ? "Pago: " + N.pago : "La forma de pago la confirma una persona de la sucursal."}
${N.tiempoPreparacion ? `- Tiempo aproximado de preparación: ${N.tiempoPreparacion}.\n` : ""}

- Necesita: los productos y cantidades, ${N.variasSucursales ? "la sucursal, " : ""}${N.cupos ? `${N.cupos.salsas.length ? "la salsa de cada combo, " : ""}el día y la tanda (de ver_cupos), si lo recoge o se lo llevan (y la dirección completa con una seña; el costo del envío lo confirma una persona)` : N.domicilio.propio ? "si lo recoge (y a qué hora pasa) o se lo llevan (y la dirección completa con una seña; el costo del envío lo confirma una persona)" : "la hora en que pasa"} y el nombre.

${N.items.some(i => i.sucursales) ? "- Algunos productos solo se venden en una sucursal (solo_en en ver_menu): ofrezca solo los de la sucursal del cliente.\n" : ""}${N.items.some(i => i.minimo > 1) ? "- Respete el pedido mínimo de cada producto (minimo en ver_menu).\n" : ""}${N.items.some(i => i.encargo) ? "- Los productos con encargo en ver_menu son para una fecha fija, se piden en un pedido aparte y solo hasta la fecha que dice. En crear_pedido ponga esa fecha.\n" : ""}${N.cobro.activo && !N.cobro.domicilio ? "- Los pedidos a domicilio no pagan antes: se le paga al repartidor al recibir.\n" : ""}${N.cupos ? `

// keep the last MAX_TURNOS customer messages, starting at a customer message (never at a tool_result)
function recortar(h) {
  const inicios = h.map((m, i) => (m.role === "user" && (typeof m.content === "string" || m.content.some(b => b.type === "text")) ? i : -1)).filter(i => i >= 0);
  return inicios.length > MAX_TURNOS ? h.slice(inicios[inicios.length - MAX_TURNOS]) : h;
}
// thinking blocks only matter inside the turn that produced them; dropping them lets us trim history safely
const sinPensar = m => (m.role === "assistant" && Array.isArray(m.content) ? { ...m, content: m.content.filter(b => b.type !== "thinking" && b.type !== "redacted_thinking") } : m);

function fecha(now) {
  return new Date(now || Date.now()).toLocaleString("es-HN", { timeZone: "America/Tegucigalpa", weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit" });
}

function createIA({ negocio, apiKey, model, client, timeoutMs = 11000, maxTokens = 2048 } = {}) {
  if (!client) {
    const Anthropic = require("@anthropic-ai/sdk");
    client = new Anthropic({ apiKey, maxRetries: 1, timeout: timeoutMs });
  }
  model = model || MODELO;
  const SYSTEM = system(negocio), TOOLS = tools(negocio);

  async function turn(history, text, now, { numero, faltas = 0, ocupados, duplicado } = {}) {
    const ctx = { numero, faltas, ocupados, duplicado, now, pedido: null, persona: null, reservacion: null };
    const base = recortar((history || []).map(sinPensar));
    const nuevo = [{ role: "user", content: [{ type: "text", text: String(text || "").slice(0, 2000) || "(mensaje vacío)" }, { type: "text", text: `[Fecha y hora en ${negocio.pais}: ${fecha(now)}]` }] }];
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), timeoutMs);
    try {
      for (let vuelta = 0; vuelta < MAX_VUELTAS; vuelta++) {
        const r = await client.messages.create({
          model,
          max_tokens: maxTokens,
          output_config: { effort: "low" },
          system: [{ type: "text", text: SYSTEM, cache_control: { type: "ephemeral" } }],   // caches tools + system
          tools: TOOLS,
          cache_control: { type: "ephemeral" },                                               // and the conversation so far
          messages: base.concat(nuevo),
        }, { signal: ac.signal });
        if (r.stop_reason === "refusal") throw new Error("Claude declinó responder (refusal)");
        nuevo.push({ role: "assistant", content: r.content });
        const usos = r.content.filter(b => b.type === "tool_use");
        if (r.stop_reason === "tool_use" && usos.length) {
          nuevo.push({ role: "user", content: usos.map(u => {
            let out;
            try { out = ejecutar(negocio, u.name, u.input || {}, ctx); } catch (e) { out = { error: e.message }; }
            return { type: "tool_result", tool_use_id: u.id, content: JSON.stringify(out), ...(out && out.error ? { is_error: true } : {}) };
          }) });
          continue;
        }
        if (r.stop_reason === "pause_turn") continue;
        const reply = r.content.filter(b => b.type === "text").map(b => b.text).join("\n").trim();
        if (!reply) throw new Error(`respuesta vacía (stop_reason ${r.stop_reason})`);
        return { reply, history: recortar(base.concat(nuevo).map(sinPensar)), pedido: ctx.pedido, persona: ctx.persona, reservacion: ctx.reservacion, usage: r.usage };
      }
      throw new Error(`más de ${MAX_VUELTAS} llamadas a la API en un mensaje`);
    } catch (e) {
      // an order already created in this message must not be lost: server.js saves it anyway
      e.pedido = ctx.pedido; e.persona = ctx.persona; e.reservacion = ctx.reservacion;
      throw e;
    } finally { clearTimeout(timer); }
  }

  return { model, turn, SYSTEM, TOOLS };
}

module.exports = { createIA, MODELO, ejecutar, system, tools };

{k === vista ? 'aria-current=\"page\"' : \"\"}>${corto ? CORTO[k] || t : t}<span class=\"n\">${cuenta[k] || \"\"}</span></button>`).join(\"\");\n  $(\"#nav1\").innerHTML = html(); $(\"#nav2\").innerHTML = html(true); $(\"#nav2\").style.setProperty(\"--n\", VISTAS.length);\n  document.querySelectorAll(\".nav[data-v]\").forEach(b => b.onclick = () => { vista = b.dataset.v; try { localStorage.setItem(\"vista\", vista); } catch {} pintar(); });\n}\n\nfunction tarjeta(p, grande) {\n  const reparto = p.entrega === \"domicilio\" && N.repartidores && N.repartidores.length;\n  const sig = { por_pagar: [[\"nuevo\", \"Pago recibido\"]], nuevo: [[\"cocina\", \"A cocina\"]], cocina: [[\"listo\", \"Listo\"]], listo: [reparto ? [\"en_camino\", \"En camino\"] : [\"entregado\", \"Entregado\"]], en_camino: [[\"entregado\", \"Entregado\"]], por_envio: [[\"nuevo\", \"Pasar a cocina\"]] }[p.estado] || [];\n  const extra = { por_pagar: [[\"cancelado\", \"Cancelar\"]], por_envio: [[\"cancelado\", \"Cancelar\"]], nuevo: [[\"cancelado\", \"Cancelar\"]], listo: [[\"no_vino\", \"No vino\"]] }[p.estado] || [];\n  return `<div class=\"card ped ${grande ? (p.estado === \"cocina\" ? \"cocina-e\" : p.estado) : \"\"}\">\n    <div class=\"l1\">${esc(p.n)} · ${esc(p.nombre || \"Sin nombre\")}<span>${hora(p.fecha)} · ${hace(p.fecha)}</span></div>\n    ${p.faltas ? `<div class=\"aviso\">⚠️ No vino a recoger ${p.faltas === 1 ? \"1 vez\" : p.faltas + \" veces\"} antes</div>` : \"\"}\n    ${p.estado === \"por_pagar\" ? `<div>${p.comprobante ? `<span class=\"tag t-comp\">Comprobante recibido ${hace(p.t_comprobante)}</span> <small>Revise la cuenta antes de confirmar.</small>` : `<span class=\"tag t-por_pagar\">${p.anticipo ? `Esperando anticipo de ${L(p.anticipo)}` : \"Esperando el pago\"}</span>${p.pagoLink ? ` <small>Link de tarjeta enviado: si paga, entra solo a cocina.</small>` : \"\"}`}</div>` : p.pagado ? `<div><span class=\"tag t-comp\">${p.metodoPago === \"tarjeta\" ? \"Pagado con tarjeta\" : \"Paga  = pedidos();\n  if (vista === \"hoy\") {\n    const h = ps.filter(p => dia(p.fecha) === hoy() && ![\"cancelado\", \"por_pagar\", \"por_envio\", \"no_vino\", \"en_espera\"].includes(p.estado));\n    const total = h.reduce((a, p) => a + p.total, 0);\n    const porSuc = N.sucursales.map(s => { const x = h.filter(p => p.sucursal === s.nombre); return [s.nombre, x.length, x.reduce((a, p) => a + p.total, 0)]; });\n    const prod = {}; h.forEach(p => (p.lineas || []).forEach(l => { prod[l.nombre] = prod[l.nombre] || [0, 0]; prod[l.nombre][0] += l.cantidad; prod[l.nombre][1] += l.subtotal; }));\n    const top = Object.entries(prod).sort((a, b) => b[1][0] - a[1][0]).slice(0, 6);\n    const espera = filtrados().filter(p => p.tipo === \"persona\" && p.estado === \"nuevo\").length;\n    const prep = ps.filter(p => p.estado === \"nuevo\" || p.estado === \"cocina\").length;\n    const libres = N.cupos ? N.cupos.dias.filter(d => d.abierto).slice(0, 2).map(d => { const u = ps.reduce((a, p) => a + (p.diaFecha === d.fecha && ![\"cancelado\", \"en_espera\"].includes(p.estado) ? p.cupos || 0 : 0), 0); return `${esc(d.etiqueta)} quedan <b>${N.cupos.tandas.length * N.cupos.porTanda - u} cupos</b>`; }) : [];\n    v.innerHTML = `<div class=\"card frase\">Hoy van <b>${h.length} ${h.length === 1 ? \"pedido\" : \"pedidos\"}</b> por WhatsApp (${L(total)})${prep ? ` y hay <b>${prep}</b> por preparar` : \"\"}.${espera ? ` <b>${espera}</b> ${espera === 1 ? \"cliente quiere\" : \"clientes quieren\"} hablar con una persona.` : \"\"}${libres.length ? ` Para ${libres.join(\" y para \")}.` : \"\"}</div>\n      <div class=\"kpis\">\n      <div class=\"card kpi\"><b>${h.length}</b><span>Pedidos por WhatsApp hoy</span></div>\n      <div class=\"card kpi\"><b>${L(total)}</b><span>Vendido por WhatsApp hoy</span></div>\n      <div class=\"card kpi\"><b>${ps.filter(p => p.estado === \"nuevo\" || p.estado === \"cocina\").length}</b><span>En preparación</span></div>\n      <div class=\"card kpi\"><b>${espera} vise que el dinero esté en la cuenta y toque <b>Pago recibido</b>. Si alguien no llega por su pedido, toque <b>No vino</b>: la próxima vez ese número paga antes.</p>` : \"\"}<div class=\"board\" style=\"--cols:${cols.length}\">${cols.map(([e, t]) => { const x = ps.filter(p => p.estado === e && (e !== \"entregado\" || dia(p.fecha) === hoy())); return `<div class=\"col\"><h3>${t}<span>${x.length}</span></h3>${x.map(p => tarjeta(p)).join(\"\") || `<div class=\"card vacio\">Nada aquí</div>`}</div>`; }).join(\"\")}</div>`;\n  } else if (vista === \"cocina\") {\n    // with cupos the kitchen sees today's batches only, in batch order; orders for later days wait in Pedidos\n    const orden = p => (p.diaFecha || \"\") + String(N.cupos ? N.cupos.tandas.indexOf(p.tanda) + 10 : \"\") + p.fecha;\n    const x = ps.filter(p => (p.estado === \"nuevo\" || p.estado === \"cocina\") && (!p.diaFecha || p.diaFecha <= hoy())).sort((a, b) => orden(a) < orden(b) ? -1 : 1);\n    v.innerHTML = `<p class=\"ayuda\">Pantalla para la cocina: déjela abierta en una tablet. Al marcar <b>Listo</b>, al cliente le llega un WhatsApp para que pase a recoger. <button class=\"btn\" id=\"son\" style=\"height:28px;margin-left:6px\">${sonido ? \"🔔 Sonido activado\" : \"🔕 Activar sonido\"}</button></p>\n      <div class=\"cocina\">${x.map(p => tarjeta(p, true)).join(\"\") || `<div class=\"card vacio\" style=\"grid-column:1/-1\">No hay pedidos pendientes.</div>`}</div>`;\n    $(\"#son\").onclick = () => { sonido = !sonido; if (sonido) beep(); pintar(); };\n  } else if (vista === \"cupos\") {\n    const C = N.cupos, espera = ps.filter(p => p.estado === \"en_espera\");\n    v.innerHTML = `<p class=\"ayuda\">Cupos apartados por WhatsApp en cada tanda (${C.porTanda} por tanda). Cuando una tanda se llena, el bot ofrece otra hora, otro día o la lista de espera. Un pedido cancelado libera sus cupos.</p>\n      <div class=\"cupos\">${C.dias.map(d => `<div class=\"card\"><h2><span class=\"ct\" style=\"background:${ICONO irmar</button><button class=\"btn\" data-n=\"${esc(p.n)}\" data-e=\"sin_cupo\">Sin cupo</button>` : `<span class=\"tag t-${p.estado}\">${ESTADO_TXT[p.estado] || esc(p.estado)}</span>`}<a class=\"btn\" href=\"${wa(p.tel)}\" target=\"_blank\" rel=\"noopener\">WhatsApp</a></div>`;\n    v.innerHTML = `<p class=\"ayuda\">Mesas que pidieron por WhatsApp. Al tocar <b>Confirmar</b> o <b>Sin cupo</b>, al cliente le llega el aviso por WhatsApp.</p>\n      <div class=\"card\" style=\"margin-bottom:12px\">${H(\"Por confirmar\", \"reservas\")}${pend.map(fila).join(\"\") || `<div class=\"vacio\">No hay mesas por confirmar.</div>`}</div>\n      ${resto.length ? `<div class=\"card\">${H(\"Ya respondidas\", \"reservas\")}${resto.map(fila).join(\"\")}</div>` : \"\"}`;\n  } else if (vista === \"personas\") {\n    const x = filtrados().filter(p => p.tipo === \"persona\").slice(0, 100);\n    v.innerHTML = `<p class=\"ayuda\">Clientes que pidieron hablar con una persona. Escríbales desde el WhatsApp del negocio y márquelos como atendidos.</p>\n      <div class=\"card\">${x.map(p => `<div class=\"fila\"><div><a class=\"wa\" href=\"${wa(p.tel)}\" target=\"_blank\" rel=\"noopener\">${esc(p.tel)}</a><small>${esc(p.motivo || \"Pidió hablar con una persona\")} · ${esc(p.sucursal)} · ${hace(p.fecha)}</small></div>${p.estado === \"nuevo\" ? `<button class=\"btn\" data-n=\"${esc(p.n)}\" data-e=\"atendido\">Atendido</button>` : `<span class=\"tag t-atendido\">Atendido</span>`}</div>`).join(\"\") || `<div class=\"vacio\">Nadie está esperando.</div>`}</div>`;\n  } else if (vista === \"seguridad\") {\n    pintarSeguridad(v);\n  } else {\n    const cats = [...new Set(N.menu.map(i => i.categoria))];\n    v.innerHTML = `<p class=\"ayuda\">Esto es lo que el bot ofrece y cobra. Para cambiar un precio o agregar un producto, avísele a Casa Digital y queda actualizado el mismo día.</p>\n      <div class=\"card\"><table><tr><th>#</th><th>Producto</th><th>Categoría</th><th class=\"r\">Precio</th></tr>${cats.ma </div></div>'.repeat(4)}</div><div class=\"card\"><div class=\"sk\" style=\"height:220px;margin:12px\"></div></div>`;\n    return cargarSeguridad();\n  }\n  const semana = Date.now() - 7 * 864e5;\n  const malos = S.eventos.filter(e => MALOS.includes(e.evento) && new Date(e.en) > semana).length;\n  const que = e => e.evento === \"estado\" ? `${esc(e.pedido)}: <span class=\"tag t-${esc(e.de)}\">${ESTADO_TXT[e.de] || esc(e.de)}</span> → <span class=\"tag t-${esc(e.a)}\">${ESTADO_TXT[e.a] || esc(e.a)}</span>` : `${MALOS.includes(e.evento) ? `<b style=\"color:var(--red)\">${EVENTO[e.evento]}</b>` : EVENTO[e.evento] || esc(e.evento)}${e.como ? ` <small style=\"color:var(--tx3)\">(${esc(e.como)})</small>` : \"\"}`;\n  v.innerHTML = `<p class=\"ayuda\">Así está protegido el panel. Solo entran los correos de abajo; cada entrada, intento fallido y cambio de pedido queda anotado aquí con la hora y el equipo.</p>\n    <div class=\"kpis\">\n      <div class=\"card kpi\"><b>${S.cifrado ? \"AES-256\" : \"No\"}</b><span>${S.cifrado ? \"Datos de clientes cifrados en el servidor\" : S.disco ? \"Datos sin cifrar: falta la llave\" : \"Datos solo en memoria\"}</span></div>\n      <div class=\"card kpi\"><b>${S.dosPasos && S.usuarios.every(u => u.whatsapp) ? \"2 pasos\" : S.dosPasos ? \"Mixto\" : \"Contraseña\"}</b><span>${S.dosPasos ? \"Contraseña + código por WhatsApp\" : \"Entrada solo con contraseña\"}</span></div>\n      <div class=\"card kpi\"><b>${S.sesionHoras} h</b><span>La sesión se cierra sola</span></div>\n      <div class=\"card kpi\" style=\"${malos ? \"border-top-color:var(--red)\" : \"\"}\"><b>${malos}</b><span>Intentos fallidos en 7 días</span></div></div>\n    <div class=\"grid-seg\">\n      <div class=\"card\">${H(\"Quién tiene acceso\", \"llave\")}<table><tr><th>Persona</th><th>Código a</th></tr>${S.usuarios.map(u => `<tr><td>${esc(u.nombre)}<small style=\"display:block;color:var(--tx3)\">${esc(u.correo)}</small></td><td>${u.whatsapp ? esc(u.whatsapp) : `<span class=\"tag t-por_pagar\">Solo contraseña</span>`}</td></tr>`).join(\"\")}</table>\n        <p class=\"vacio\" style=\"padding:12px 16px;text-align:left;font-size:12px\">Para dar o quitar acceso, avísele a Casa Digital. Quitar a alguien cierra su sesión al instante.</p></div>\n      <div class=\"card\">${H(\"Actividad reciente\", \"actividad\")}${S.eventos.length ? `<div class=\"solo-pc\" style=\"overflow-x:auto\"><table><tr><th>Cuándo</th><th>Quién</th><th>Qué pasó</th><th>Desde</th></tr>${S.eventos.slice(0, 80).map(e => `<tr><td style=\"white-space:nowrap\">${fechaHora(e.en)}</td><td>${esc(e.correo || \"—\")}</td><td>${que(e)}</td><td style=\"white-space:nowrap;color:var(--tx3)\">${desde(e)}</td></tr>`).join(\"\")}</table></div>\n        <div class=\"solo-cel\">${S.eventos.slice(0, 50).map(e => `<div class=\"fila\"><div>${que(e)}<small>${esc(e.correo || \"—\")} · ${fechaHora(e.en)}${desde(e) ? ` · ${desde(e)}` : \"\"}</small></div></div>`).join(\"\")}</div>` : `<div class=\"vacio\">Todavía no hay actividad.</div>`}</div>\n    </div>`;\n}\n\nasync function cambiar(n, estado, b) {\n  b.disabled = true;\n  try {\n    const r = await fetch(`/api/pedidos/${encodeURIComponent(n)}/estado`, { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify({ estado }) });\n    if (r.status === 401) return location.href = \"/panel/entrar\";\n    if (!r.ok) throw new Error();\n    const p = await r.json(); P = P.map(x => x.n === p.n ? p : x); pintar();\n  } catch { b.disabled = false; alert(\"No se pudo guardar. Revise la conexión e intente otra vez.\"); }\n}\n\n// the bot passes the order to the next driver (never back to one who said no) and tells him by WhatsApp\nasync function otroRepartidor(n, b) {\n  b.disabled = true;\n  try {\n    const r = await fetch(`/api/pedidos/${encodeURIComponent(n)}/repartidor`, { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: \"{}\" });\n    if (r.status === 401) return location.href = \"/panel/entrar\";\n    if (!r.ok) throw new Error();\n    const p = await r.json(); P = P.map(x => x.n === p.n ? p : x); pintar();\n    if (!p.repartidor) alert(\"No hay otro repartidor disponible para esta sucursal. Escríbale a uno directamente.\");\n  } catch { b.disabled = false; alert(\"No se pudo cambiar el repartidor. Revise la conexión e intente otra vez.\"); }\n}\n\nfunction beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.2, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .6); o.start(); o.stop(c.currentTime + .6); } catch {} }\n\nasync function cargar() {\n  try {\n    const r = await fetch(\"/api/pedidos\", { cache: \"no-store\" });\n    if (r.status === 401) return location.href = \"/panel/entrar\";\n    P = await r.json();\n    const nuevos = new Set(P.filter(p => p.tipo === \"pedido\" && p.estado === \"nuevo\").map(p => p.n));\n    if (vistos && sonido && [...nuevos].some(n => !vistos.has(n))) beep();\n    vistos = nuevos;\n    $(\"#vivo\").className = \"vivo\"; $(\"#vivo\").lastChild.textContent = \"Actualizado \" + new Date().toLocaleTimeString(\"es-HN\", { hour: \"numeric\", minute: \"2-digit\", timeZone: \"America/Tegucigalpa\" });\n    if (vista === \"seguridad\") cargarSeguridad();\n    pintar();\n  } catch { $(\"#vivo\").className = \"vivo off\"; $(\"#vivo\").lastChild.textContent = \"Sin conexión, reintentando\"; }\n}\n\n(async () => {\n  const r = await fetch(\"/api/negocio\", { cache: \"no-store\" });\n  if (r.status === 401) return location.href = \"/panel/entrar\";\n  N = await r.json();\n  if (N.reservaciones) VISTAS.splice(3, 0, [\"reservas\", \"Reservaciones\"]);\n  if (N.cupos) VISTAS.splice(1, 0, [\"cupos\", \"Cupos\"]);\n  if (!todas().some(v => v[0] === vista)) vista = \"hoy\";\n  $(\"#quien\").onclick = () => { vista = \"seguridad\"; try { localStorage.setItem(\"vista\", vista); } catch {} pintar(); };\n  document.title = `Panel · ${N.nombre}`;\n  $(\"#marca\").textContent = N.nombre; $(\"#ey\").textContent = N.nombre;\n  $(\"#sub\").textContent = `Panel del dueño${N.modoIA ? \" · asistente con IA\" : \"\"}`;\n  $(\"#logo\").textContent = (N.nombre || \"?\").trim()[0].toUpperCase(); $(\"#logo\").style.setProperty(\"--marca\", N.color);\n  $(\"#quien\").textContent = String(N.usuario || \"?\").split(/\\s+/).map(w => w[0]).join(\"\").slice(0, 2).toUpperCase(); $(\"#quien\").title = N.usuario || \"\";\n  $(\"#suc\").innerHTML += N.sucursales.map(s => `<option value=\"${esc(s.id)}\">${esc(s.nombre)}</option>`).join(\"\");\n  if (N.sucursales.length < 2) $(\"#suc\").style.display = \"none\";\n  try { $(\"#suc\").value = localStorage.getItem(\"suc\") || \"\"; } catch {}\n  $(\"#suc\").onchange = () => { try { localStorage.setItem(\"suc\", $(\"#suc\").value); } catch {} pintar(); };\n  await cargar();\n  setInterval(cargar, 8000);\n  setInterval(() => { if (!document.hidden) pintar(); }, 60000);\n})();\n<\/script>\n</body>\n</html>\n";
  $("#tabs").innerHTML = [...CHATS.map(c => [c.k, c.tab]), ["panel", "Panel"]].map(([k, t]) => `<button class="tab" role="tab" data-k="${k}" aria-selected="${k === activa}">${t}<span class="n" id="n-${k}"></span></button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => ver(b.dataset.k));
  document.querySelectorAll(".barra").forEach(f => f.onsubmit = e => { e.preventDefault(); const i = f.querySelector("input"); const t = i.value.trim(); if (!t) return; i.value = ""; mandar(f.dataset.k, t); });
  CHATS.forEach(c => chips(c.k));
  ver(activa);
  guia();
}
function ver(k) {
  activa = k; SIN_LEER[k] = 0;
  document.querySelectorAll(".tel,.pan").forEach(s => s.classList.toggle("vis", s.dataset.k === k));
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.k === k));
  marcas();
  if (k === "panel") refrescarPanel();
}
function marcas() { for (const k in SIN_LEER) { const n = $("#n-" + k); if (n) { n.textContent = SIN_LEER[k]; n.classList.toggle("si", SIN_LEER[k] > 0); } } }
const movil = () => matchMedia("(max-width:899px)").matches;
let tt;
function toast(t, k) {
  const el = $("#toast"); el.textContent = t; el.classList.add("si"); el.onclick = () => ver(k);
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove("si"), 2600);
}
function burbuja(k, de, texto) {
  const box = $("#m-" + k), v = box.querySelector(".vacio"); if (v) v.remove();
  const d = document.createElement("div"); d.className = "m " + de; d.innerHTML = `${formato(texto)}<span class="h">${hora()}</span>`;
  box.insertBefore(d, $("#e-" + k)); box.scrollTop = box.scrollHeight;
}
// a message that the bot sends to a phone on its own (avisos)
function recibir(k, texto) {
  setTimeout(() => {
    burbuja(k, "bot", texto);
    if (k !== "cliente") BOTONES[k] = [];
    chips(k);
    if (movil() && k !== activa) { SIN_LEER[k]++; marcas(); toast(`Nuevo mensaje para ${CHATS.find(c => c.k === k).tab === "Dueño" ? "el dueño" : CHATS.find(c => c.k === k).tab}`, k); }
    avanzar(); refrescarPanel();
  }, 450);
}
async function mandar(k, texto, foto = false) {
  burbuja(k, "yo", foto ? "📷 Foto del comprobante" : texto);
  BOTONES[k] = []; chips(k);
  $("#e-" + k).classList.add("si"); $("#m-" + k).scrollTop = 1e9;
  let out;
  try { out = await turno(TEL[k], foto ? "📷 foto" : texto, foto); } catch (e) { out = [{ text: "Disculpe, hubo un problema. Intente otra vez." }]; console.error(e); }
  await new Promise(r => setTimeout(r, 350));
  $("#e-" + k).classList.remove("si");
  for (const m of out) { burbuja(k, "bot", m.text); if (m.buttons) BOTONES[k] = m.buttons; }
  chips(k); avanzar(); refrescarPanel();
}
function chips(k) {
  let ls = BOTONES[k].slice(0, 6);
  const extra = [];
  if (k === "kevin") {
    const mios = repartos.enCalle(repartos.lista[0]);
    if (mios.some(p => p.estado === "por_envio" && p.envio == null)) extra.push("ENVÍO 60");
    if (mios.some(p => p.estado === "listo")) extra.push("SALGO");
    if (mios.some(p => p.estado === "en_camino")) extra.push("ENTREGADO");
    if (mios.some(p => ["por_envio", "nuevo", "cocina", "listo"].includes(p.estado))) extra.push("NO PUEDO");
  }
  if (k === "cliente") {
    if (store.pedidos.some(p => p.estado === "por_envio" && p.envio != null && digits(p.tel) === digits(TEL.cliente))) ls = ["SÍ", "RECOGER", "CANCELAR"];
    if (porPagar(TEL.cliente) && !porPagar(TEL.cliente).comprobante) extra.push("📷 Mandar comprobante");
  }
  if (k === "dueno") {
    const p = store.pedidos.findLast(x => x.estado === "por_pagar" && x.comprobante);
    if (p) extra.push("OK " + p.n.replace(/\D/g, ""));
    extra.push("pedidos");
  }
  ls = [...new Set(ls.concat(extra))];
  $("#c-" + k).innerHTML = ls.map(b => `<button class="chip${b.startsWith("📷") ? " foto" : ""}" type="button">${esc(b)}</button>`).join("");
  $("#c-" + k).querySelectorAll(".chip").forEach(b => b.onclick = () => b.textContent.startsWith("📷") ? mandar(k, "", true) : mandar(k, b.textContent));
}
function refrescarPanel() {
  for (const c of CHATS) chips(c.k);
  try { const w = $("#panel").contentWindow; if (w && w.cargar) w.cargar(); } catch (e) {}
}
// the guide follows what has happened
function avanzar() {
  const ps = store.pedidos.filter(p => p.tipo === "pedido");
  const dom = ps.find(p => p.entrega === "domicilio" || p.repartidor);
  const hechos = [!!dom, !!(dom && dom.envio != null), !!(dom && !["por_envio"].includes(dom.estado)), !!(dom && ["listo", "en_camino", "entregado"].includes(dom.estado)), !!(dom && dom.estado === "entregado"), ps.some(p => p.pagado && p.metodoPago === "manual")];
  const nuevo = hechos.findIndex(x => !x);
  paso = nuevo < 0 ? PASOS.length : nuevo;
  guia();
}
function guia() {
  $("#guia").innerHTML = PASOS.map(([t, d], i) => `<div class="paso ${i < paso ? "ya" : i === paso ? "ahora" : ""}"><b>${i + 1}. ${t}${i < paso ? " ✓" : ""}</b>${esc(d)}</div>`).join("");
  const a = $("#guia .ahora"); if (a) a.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
}
$("#reiniciar").onclick = () => location.reload();
armar();
</script>
