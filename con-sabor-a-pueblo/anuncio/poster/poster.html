<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Con Sabor a Pueblo · póster pedidos por WhatsApp</title>
<!-- Tercera versión (21 nov): como los anuncios de comida de Burger King y McDonald's.
     La foto manda, de borde a borde y a su tamaño real; un solo titular; el número; nada más.
     Las versiones anteriores (Fraunces, rótulo, letrero) están en el historial de git. -->
<style>
@font-face{font-family:"Archivo";src:url(fuentes/archivo.woff2) format("woff2-variations");font-weight:100 900;font-stretch:62% 125%;}
@font-face{font-family:"Barlow Condensed";src:url(fuentes/barlow-condensed-800.woff2) format("woff2");font-weight:800;}
@font-face{font-family:"Jakarta";src:url(fuentes/jakarta.woff2) format("woff2-variations");font-weight:200 800;}
@font-face{font-family:"Figtree";src:url(fuentes/figtree.woff2) format("woff2-variations");font-weight:300 900;}
:root{--sol:#FEBE29;--cafe:#3A1D0E;--crema:#FFF3DC;--wa:#25D366;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1080px;height:1920px;overflow:hidden;}
body{background:var(--sol);font-family:"Figtree",sans-serif;color:var(--cafe);-webkit-font-smoothing:antialiased;position:relative;}
.foto{position:absolute;left:0;top:0;width:1080px;height:1000px;overflow:hidden;}
.foto img{width:1080px;height:1000px;display:block;}
/* borde de abajo de la foto en curva suave, como mordida al pan */
.foto{clip-path:ellipse(120% 100% at 50% 0%);}
.sello{position:absolute;left:56px;top:56px;width:170px;height:170px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));}
.sello img{width:100%;height:100%;display:block;}
h1{position:absolute;left:72px;right:40px;top:1080px;font-size:128px;line-height:.98;color:var(--cafe);white-space:nowrap;}
h1 span{display:block;}
.num{position:absolute;left:66px;top:1380px;display:flex;align-items:center;gap:26px;background:var(--cafe);border-radius:999px;padding:22px 52px 26px 24px;}
.num i{flex:none;width:104px;height:104px;border-radius:50%;background:var(--wa);display:grid;place-items:center;}
.num b{font-size:112px;line-height:1;color:var(--sol);}
.info{position:absolute;left:78px;right:60px;top:1600px;font-size:38px;font-weight:600;line-height:1.32;}
.pie{position:absolute;left:78px;right:60px;bottom:64px;display:flex;align-items:center;gap:16px;font-size:36px;font-weight:700;color:var(--cafe);}
.pie .c{width:52px;height:52px;border-radius:50%;background:var(--cafe);display:grid;place-items:center;}
.pie .c img{width:23px;height:27px;}
.pie .x{font-weight:500;opacity:.6;}
/* A · sans limpia y gruesa, como Speedee de McDonald's */
.jakarta h1,.jakarta .num b{font-family:"Jakarta";font-weight:800;letter-spacing:-.045em;}
.jakarta h1{font-size:136px;line-height:.95;}
/* B · condensada en mayúsculas, como los carteles de comida callejera */
.barlow h1,.barlow .num b{font-family:"Barlow Condensed";font-weight:800;text-transform:uppercase;letter-spacing:-.01em;}
.barlow h1{font-size:164px;line-height:.86;}
.barlow .num b{font-size:130px;}
.barlow .num{top:1400px;}
/* C · grotesca ancha y pesada, como Chicken Sans de Popeyes */
.archivo h1,.archivo .num b{font-family:"Archivo";font-weight:900;font-stretch:112%;letter-spacing:-.04em;}
.archivo h1{font-size:118px;line-height:.95;}
</style>
</head>
<body>
<div class="foto"><img src="foto-chicharron.jpg" alt=""></div>
<div class="sello"><img src="../src/logo.svg" alt=""></div>
<h1><span>Haz tu pedido</span><span>por WhatsApp</span></h1>
<div class="num"><i><svg width="60" height="60" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.5 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1.1.1-1.7-.1-1.6-.5-3.5-1.5-5.3-4.2-1.3-1.9-1.3-3.3-.4-4.3.3-.4.7-.5 1-.5h.7c.2 0 .5 0 .7.6l.9 2.2c.1.2.1.4 0 .6l-.8 1c.7 1.3 1.8 2.3 3.2 2.9l.9-1.1c.2-.3.4-.3.7-.2l2.1 1c.3.1.4.3.4.4 0 .2 0 .4-.1.5z"/></svg></i><b>3169-9031</b></div>
<div class="info">Sábados en Col. Palmira, Tegucigalpa.<br>A domicilio o para recoger.</div>
<div class="pie"><span>Con Sabor a Pueblo</span><span class="x">×</span><span class="c"><img src="../src/clientia.svg" alt=""></span><span>Clientia Tech</span></div>
<script>document.body.className = new URLSearchParams(location.search).get("v") || "jakarta";</script>
</body>
</html>
