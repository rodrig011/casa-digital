<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Libby's Cajun</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F3EF">
<script>try{if(localStorage.getItem("lc-tema")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<style>
/* Libby's Cajun's desk, the same CRM-style layout as the other restaurant panels: global header,
   app tabs, record-style page header, dense cards and list views. One Louisiana-style seafood restaurant in San Pedro Sula
   with a dining room, orders by WhatsApp 9309-9296 and a big TikTok, so WhatsApp orders, the kitchen, reservations,
   seafood stock and TikTok get their own place. Demo data, clearly marked. */
:root{
  --bg:#F3F3F3; --band:#B0C4DF; --card:#FFFFFF; --sunk:#F3F3F3; --th:#F3F3F3; --line:#E5E5E5; --line2:#C9C9C9; --tx:#181818; --tx2:#444444; --tx3:#706E6B;
  --brand:#0176D3; --brand-d:#014486; --brand-bg:#EEF4FF;
  --red:#BA0517; --red-bg:#FEDED8; --ok:#2E844A; --ok-bg:#CDEFC4; --blue:#0176D3; --blue-bg:#EEF4FF; --amber:#8C4B02; --amber-bg:#FEF1CD; --yel:#FE9339; --wa:#2E844A;
  --c1:#0176D3; --c2:#FE9339; --c3:#3BA755;
  --hover:#F3F3F3; --sel:#EEF4FF; --shadow:0 2px 2px 0 rgba(0,0,0,.1);
  --body:"Salesforce Sans",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1B1B1B; --band:#16325C; --card:#242424; --sunk:#2B2B2B; --th:#2B2B2B; --line:#3A3A3A; --line2:#4A4A4A; --tx:#F3F3F3; --tx2:#C9C9C9; --tx3:#A0A0A0;
  --brand:#1B96FF; --brand-d:#78B0FD; --brand-bg:#0B2A4E;
  --red:#FE5C4C; --red-bg:#4A1410; --ok:#45C65A; --ok-bg:#163A1F; --blue:#1B96FF; --blue-bg:#0B2A4E; --amber:#FFBA45; --amber-bg:#3D2A06;
  --c1:#1B96FF; --c2:#FE9339; --c3:#45C65A;
  --hover:#2E2E2E; --sel:#0B2A4E; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--tx);font:400 13px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:0;padding:0;}
a{color:inherit;text-decoration:none;}
svg{display:block;}
:focus-visible{outline:0;box-shadow:0 0 3px var(--brand);border-radius:4px;}
.num{font-variant-numeric:tabular-nums;}
.ic{width:16px;height:16px;flex:none;}

/* global header */
.gh{position:sticky;top:0;z-index:30;background:var(--card);box-shadow:0 2px 3px rgba(0,0,0,.08);}
.gh-top{display:flex;align-items:center;gap:14px;height:50px;padding:0 16px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{width:32px;height:32px;border-radius:4px;object-fit:cover;background:#2a1a12;}
.search{flex:1;max-width:520px;margin:0 auto;position:relative;}
.search input{width:100%;height:32px;border:1px solid var(--line2);border-radius:4px;background:var(--card);padding:0 10px 0 32px;font-size:13px;}
.search svg{position:absolute;left:10px;top:8px;color:var(--tx3);}
.tb-r{display:flex;align-items:center;gap:4px;}
.iconbtn{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;color:var(--tx3);border:1px solid transparent;}
@media (hover:hover) and (pointer:fine){.iconbtn:hover{border-color:var(--line2);color:var(--brand);}}
.theme .sun{display:none;} :root[data-theme="dark"] .theme .sun{display:block;} :root[data-theme="dark"] .theme .moon{display:none;}
.avatar{width:32px;height:32px;border-radius:50%;background:#032D60;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;margin-left:4px;}
.gh-nav{display:flex;align-items:stretch;height:40px;padding:0 16px;border-top:1px solid var(--line);gap:0;overflow-x:auto;scrollbar-width:none;}
.gh-nav::-webkit-scrollbar{display:none;}
.appname{display:flex;align-items:center;gap:10px;padding-right:20px;margin-right:6px;font-size:16px;font-weight:400;white-space:nowrap;}
.appname .grid{width:20px;height:20px;display:grid;grid-template-columns:repeat(3,4px);gap:3px;}
.appname .grid i{width:4px;height:4px;border-radius:50%;background:var(--tx3);}
#nav{display:flex;}
#nav a{display:flex;align-items:center;gap:6px;padding:0 12px;white-space:nowrap;color:var(--tx2);border-bottom:3px solid transparent;border-top:3px solid transparent;position:relative;}
#nav a.on{border-bottom-color:var(--brand);color:var(--tx);font-weight:700;background:var(--sel);}
@media (hover:hover) and (pointer:fine){#nav a:hover{background:var(--hover);color:var(--tx);}}
#nav a .c{font-size:11px;font-weight:700;border-radius:10px;padding:0 6px;background:var(--red);color:#fff;line-height:16px;}
.band{position:absolute;left:0;right:0;top:0;height:170px;background:var(--band);z-index:-1;}
main{position:relative;z-index:0;padding:12px 12px 64px;max-width:1500px;margin:0 auto;}
.app{position:relative;isolation:isolate;}

.results{position:absolute;left:0;right:0;top:36px;background:var(--card);border:1px solid var(--line2);border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.16);padding:4px 0;max-height:60vh;overflow:auto;z-index:40;}
.results a{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;}
.results a:hover{background:var(--hover);}
.results small{color:var(--tx3);}
.results .empty{padding:10px 12px;}
/* demo notice */
.notice{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:4px;padding:8px 12px;margin-bottom:12px;color:var(--tx2);font-size:12px;box-shadow:var(--shadow);}
.notice b{color:var(--tx);}

/* record-style page header */
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);}
.ph .tile{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;color:#fff;flex:none;}
.ph .tile svg{width:22px;height:22px;}
.ph .ey{font-size:12px;color:var(--tx3);line-height:1.2;}
.ph h1{margin:0;font:700 18px/1.25 var(--body);}
.ph .sub{display:none;}
.ph .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.subline{margin:-4px 0 12px 2px;color:var(--tx2);font-size:12px;}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden;background:var(--card);}
.seg button{height:32px;padding:0 12px;font-size:13px;color:var(--brand);border-left:1px solid var(--line2);white-space:nowrap;}
.seg button:first-child{border-left:0;}
.seg button.on{background:var(--brand);color:#fff;}
@media (hover:hover) and (pointer:fine){.seg button:not(.on):hover{background:var(--hover);}}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);min-width:0;}
.card > header{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap;}
.card > header h2{margin:0;font:700 14px var(--body);}
.card > header .r{margin-left:auto;color:var(--tx3);font-size:12px;display:flex;gap:8px;align-items:center;}
.ct{width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:#fff;flex:none;}
.ct svg{width:14px;height:14px;}
.pad{padding:12px 16px 16px;}
.stack{display:grid;gap:12px;}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.status{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:15px;font-size:12px;font-weight:400;white-space:nowrap;background:var(--hover);color:var(--tx);}
.status i{display:none;}
.s-ok{background:var(--ok-bg);color:#056764;} .s-red{background:var(--red-bg);color:var(--red);} .s-amber{background:var(--amber-bg);color:var(--amber);} .s-blue{background:var(--blue-bg);color:var(--blue);} .s-gray{background:var(--hover);color:var(--tx2);}
:root[data-theme="dark"] .s-ok{color:var(--ok);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:4px;font-size:13px;font-weight:400;border:1px solid var(--line2);background:var(--card);color:var(--brand);white-space:nowrap;}
.btn:active{background:var(--hover);}
.btn.pri,.btn.red{background:var(--brand);color:#fff;border-color:var(--brand);}
.btn.wa{color:var(--brand);}
.btn.wa svg{color:#2E844A;}
.btn.sm{height:28px;padding:0 10px;font-size:12px;}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--hover);}.btn.pri:hover,.btn.red:hover{background:var(--brand-d);border-color:var(--brand-d);}}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;}

/* highlights (KPIs) */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);}
.kpi{padding:12px 16px 14px;border-left:1px solid var(--line);}
.kpi:first-child{border-left:0;}
.kpi span{color:var(--tx3);font-size:12px;}
.kpi b{display:block;font:300 28px/1.15 var(--body);margin:2px 0 2px;font-variant-numeric:tabular-nums;}
.kpi small{font-size:12px;color:var(--tx3);}
.up{color:var(--ok);font-weight:700;} .down{color:var(--red);font-weight:700;}

/* recommended actions */
.recs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);}
.rec{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);}
.rec:last-child{border-bottom:0;}
.rec .ico{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;color:#fff!important;}
.rec .ico svg{width:16px;height:16px;}
.rec b{font-weight:400;color:var(--brand);}
.rec p{margin:1px 0 0;color:var(--tx3);font-size:12px;}
.rec.done{opacity:.55;} .rec.done b{text-decoration:line-through;}

/* charts */
.chart{padding:4px 16px 6px;position:relative;border-top:1px solid var(--line);}
.chart svg{width:100%;height:auto;overflow:visible;}
.chart text{fill:var(--tx3);font:400 11px var(--body);}
.chart .gl{stroke:var(--line);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2);padding:0 16px 12px;}
.tip{position:absolute;pointer-events:none;background:#032D60;color:#fff;border-radius:4px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;z-index:5;}
.tip b{display:block;font-size:13px;}
.bars{display:grid;gap:12px;padding:12px 16px 16px;border-top:1px solid var(--line);}
.hb b{display:flex;justify-content:space-between;font-weight:400;margin-bottom:4px;gap:10px;}
.hb b em{font-style:normal;color:var(--tx3);}
.trk{height:8px;border-radius:2px;background:var(--hover);overflow:hidden;display:flex;}
.trk i{display:block;height:100%;}

/* list views */
.tbl{width:100%;border-collapse:collapse;border-top:1px solid var(--line);}
.tbl th{font-size:12px;font-weight:700;color:var(--tx2);text-align:left;padding:6px 16px;background:var(--th);border-bottom:1px solid var(--line);white-space:nowrap;text-transform:none;}
.tbl td{padding:8px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:0;}
@media (hover:hover) and (pointer:fine){.tbl tbody tr:hover td{background:var(--hover);}}
.tbl .r{text-align:right;}
.scrollx{overflow-x:auto;}

/* kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;}
.col{background:var(--card);border:1px solid var(--line);border-radius:4px;min-height:200px;box-shadow:var(--shadow);}
.col h3{margin:0;padding:10px 12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--th);border-radius:4px 4px 0 0;}
.col h3 span{font-weight:400;color:var(--tx3);}
.col > .tk:first-of-type{margin-top:10px;}
.tk{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:0 10px 10px;}
.tk .t{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.tk .t b{font-size:13px;color:var(--brand);font-weight:400;}
.tk ul{margin:6px 0;padding:0;list-style:none;font-size:13px;}
.tk li{display:flex;justify-content:space-between;gap:8px;padding:1px 0;}
.tk .m{font-size:12px;color:var(--tx3);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tk .a{display:flex;gap:8px;margin-top:8px;}
.tk .a .btn{flex:1;}
.late{color:var(--red);font-weight:700;}
.empty{padding:20px 12px;text-align:center;color:var(--tx3);font-size:12px;}
.kmode .board{grid-template-columns:repeat(2,minmax(280px,1fr));}
.kmode .tk .t b{font-size:20px;font-weight:700;color:var(--tx);} .kmode .tk ul{font-size:17px;font-weight:700;}

/* forms */
.form{display:grid;gap:12px;}
.tin{width:130px;height:28px;border-radius:4px;border:1px solid var(--line2);background:var(--card);color:var(--tx);padding:0 8px;font-size:13px;}
.tin:focus{outline:none;border-color:var(--brand);box-shadow:0 0 3px var(--brand);}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;white-space:nowrap;}
.sw input{position:absolute;opacity:0;width:1px;height:1px;}
.sw i{width:34px;height:20px;border-radius:10px;background:var(--line2);position:relative;transition:background .15s;flex:none;}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s;}
.sw input:checked + i{background:var(--brand);}
.sw input:checked + i::after{transform:translateX(14px);}
.sw input:focus-visible + i{box-shadow:0 0 0 2px var(--brand);}
@media (max-width:640px){.prov thead{display:none;}.prov,.prov tbody,.prov tr,.prov td{display:block;width:100%;}
.prov tr{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;}
.prov tr:last-child{border-bottom:0;}.prov td{padding:0;border:0;}.prov td.r{text-align:left;}
.prov td:nth-child(2){grid-column:1/-1;color:var(--tx2);margin-top:-6px;}.prov .tin{width:100%;}
.avi td:nth-child(1){grid-column:2;grid-row:1;color:var(--tx3);}.avi td:nth-child(2){grid-column:1;grid-row:1;margin:0;color:var(--tx);font-weight:700;}
.avi td:nth-child(3),.avi td:nth-child(4){grid-column:1/-1;}.avi .status{white-space:normal;height:auto;padding:2px 8px;}}
.mo{display:none;}
@media (max-width:640px){.resv thead{display:none;}.resv,.resv tbody{display:block;width:100%;}
.resv tr{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center;}
.resv tr:last-child{border-bottom:0;}.tbl.resv td{padding:0;border:0;}.resv td:nth-child(2){font-weight:700;}
.resv td:nth-child(4),.resv td:nth-child(5){grid-column:1/-1;color:var(--tx2);}.resv td:nth-child(6){grid-column:1/3;}.resv .mo{display:inline;}.resv td:nth-child(5){display:none;}}
.form > *,.f2 > *{min-width:0;}
.form label{display:grid;gap:2px;font-size:12px;color:var(--tx2);}
.form input,.form select,.form textarea{width:100%;min-width:0;height:32px;border-radius:4px;border:1px solid var(--line2);background:var(--card);padding:0 10px;font-size:13px;}
.form textarea{height:96px;padding:8px 10px;resize:vertical;}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 3px var(--brand);}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.res{border-radius:4px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);}
.big{font:300 24px var(--body);font-variant-numeric:tabular-nums;}

.stamps{display:flex;gap:4px;}
.stamps i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line2);}
.stamps i.on{background:var(--brand);border-color:var(--brand);}
.hint{font-size:12px;color:var(--tx3);}
.toasts{position:fixed;left:50%;top:60px;transform:translateX(-50%);display:grid;gap:8px;z-index:90;}
.toast{background:#2E844A;color:#fff;padding:10px 16px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.2);min-width:280px;}

@media (max-width:1100px){.g2{grid-template-columns:1fr;}.g3{grid-template-columns:1fr;}}
@media (max-width:860px){
  .search{display:none;}
  .gh-top{justify-content:space-between;}
  .appname{display:none;}
  .gh-nav{padding:0 4px;}
  .kpis{grid-template-columns:1fr 1fr;}
  .kpi:nth-child(3){border-left:0;} .kpi:nth-child(-n+2){border-bottom:1px solid var(--line);}
  .ph .r{margin-left:0;width:100%;}
  .seg{width:100%;} .seg button{flex:1;padding:0 6px;}
  .board{grid-template-columns:repeat(4,minmax(240px,82vw));}
  .kmode .board{grid-template-columns:repeat(2,minmax(260px,86vw));}
  .f2{grid-template-columns:1fr;}
  .tbl th,.tbl td{padding:8px 10px;}
  .rec{grid-template-columns:28px 1fr;}
  .rec > div:last-child{grid-column:2;}
  main{padding:8px 8px 64px;}
}
.chat{display:grid;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--sunk);}
.msg{max-width:88%;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.4;white-space:pre-line;box-shadow:0 1px 1px rgba(0,0,0,.08);}
.msg.in{background:var(--card);justify-self:start;border-top-left-radius:2px;}
.msg.out{background:#D9FDD3;color:#111;justify-self:end;border-top-right-radius:2px;}
:root[data-theme="dark"] .msg.out{background:#144D37;color:#E9EDEF;}
.msg small{display:block;font-size:11px;color:var(--tx3);margin-top:2px;text-align:right;}
.msg.out small{color:#55705A;}
:root[data-theme="dark"] .msg.out small{color:#9FC4AE;}
.convs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);}
.conv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
.conv:last-child{border-bottom:0;}
.conv.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--brand);}
@media (hover:hover) and (pointer:fine){.conv:hover{background:var(--hover);}}
.conv b{font-weight:700;} .conv p{margin:0;color:var(--tx3);font-size:12px;grid-column:1/-1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tbl input.tin{width:90px;text-align:right;}
.city{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 16px;border-bottom:1px solid var(--line);}
.city:last-child{border-bottom:0;}
.city .trk{grid-column:1/-1;}
@media (max-width:640px){.tbl .sw span{display:none;}}
.brand img{width:auto;height:30px;object-fit:contain;background:#fff;border-radius:3px;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/></symbol>
  <symbol id="i-cash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></symbol>

function ticket(p) {
  const out = p.src === "Domicilio";
  const nx = {nuevo: ["cocina","Pasar a cocina"], cocina: ["revision","Listo, a revisar"], revision: [out ? "camino" : "entregado", out ? "Todo completo, sale" : p.src === "Mesa" ? "Servir" : "Entregado"], camino: ["entregado","Entregado"]}[p.st];
  const checks = [["mar","Mariscos completos"],["salsa","Salsa y mantequilla"],["acomp","Elote, papa y tajadas"],["cambio", p.pay === "Paga en efectivo" ? "Cambio listo" : p.src === "Mesa" ? "Cubiertos y servilletas" : "Pago confirmado"]];
  const allOk = checks.every(([k]) => p.chk[k]);
  return `<div class="tk"><div class="t"><b>#${p.id}</b><span class="hint ${p.late ? "late" : ""}">${p.st === "camino" ? "en camino" : `hace ${p.min} min`}${p.prom ? ` · prometido ${p.prom}` : ""}</span></div>
    <ul>${p.items.map(i => `<li><span>${i.q} × ${i.n}</span>${KMODE ? "" : `<span class="num">${L(i.p * i.q)}</span>`}</li>`).join("")}</ul>
    ${p.nota ? `<div class="hint" style="margin:2px 0 6px;color:var(--amber);font-weight:700">${p.nota}</div>` : ""}
    ${p.st === "revision" ? `<ul class="chk">${checks.map(([k, n]) => `<li><label><input type="checkbox" data-ck="${p.id}:${k}" ${p.chk[k] ? "checked" : ""}><span class="${p.chk[k] ? "ok" : ""}">${n}</span></label></li>`).join("")}</ul>` : ""}
    <div class="m"><span class="status ${out ? "s-blue" : p.src === "Llevar" ? "s-ok" : "s-gray"}"><i></i>${where(p)}</span>${p.src !== "Mesa" ? chn("wa") : ""}${KMODE ? "" : `<span>${p.who}</span><b class="num" style="margin-left:auto">${L(tot(p.items))}</b>`}</div>
    ${nx ? `<div class="a"><button class="btn sm ${p.st === "nuevo" ? "red" : ""}" data-mv="${p.id}" ${p.st === "revision" && !allOk ? "disabled style='opacity:.5'" : ""}>${nx[1]}</button></div>` : ""}</div>`;
}
function vPedidos() {
  const cols = [["nuevo","Comandas nuevas"],["cocina","En preparación"],["revision","Revisar antes de servir o salir"],["camino","Domicilio en camino"]];
  return `${PH("Cocina", "Mesas, para llevar y domicilios de WhatsApp en la misma pantalla, con lo que pidió, la nota del cliente y la hora prometida.", `<button class="btn ${KMODE ? "pri" : ""}" id="kmode">${KMODE ? "Salir de pantalla de cocina" : "Pantalla de cocina"}</button>`)}
  <div class="${KMODE ? "kmode" : ""}"><div class="board">${cols.filter(c => !KMODE || c[0] === "nuevo" || c[0] === "cocina").map(([k, t]) => { const list = PICK.filter(p => p.st === k);
    return `<div class="col"><h3>${t}<span>${list.length}</span></h3>${list.map(ticket).join("") || `<div class="empty">Nada aquí</div>`}</div>`; }).join("")}</div></div>
  <p class="hint" style="margin-top:14px">Antes de servir o de que salga un pedido se marca lo que lleva: mariscos, salsa, acompañantes y el cambio si paga en efectivo. El botón se activa cuando todo está marcado, y al cliente de domicilio le llega "su pedido ya salió" por WhatsApp.</p>`;
}

function vReservas() {
  const lbl = d => d === 0 ? "Hoy" : d === 1 ? "Mañana" : DAYS[(today + d) % 7];
  const pers = resHoy().reduce((a, r) => a + r[3], 0);
  return `${PH("Reservaciones", "Cumpleaños, cenas románticas, familias y empresas. Se reservan por WhatsApp y quedan anotadas aquí con hora y personas. El día de la reservación el asistente le escribe al cliente para confirmar.")}
  <div class="stack">
    <section class="card"><div class="kpis">
      <div class="kpi"><span>Reservaciones hoy</span><b class="num">${resHoy().length}</b><small>${pers} personas</small></div>
      <div class="kpi"><span>Esta semana</span><b class="num">${RESV.length}</b><small>${RESV.filter(r => r[4] === "Cumpleaños" || r[4] === "Aniversario").length} celebraciones</small></div>
      <div class="kpi"><span>Confirmadas</span><b class="num" style="color:var(--ok)">${RESV.filter(r => r[6]).length} de ${RESV.length}</b><small>contestaron al recordatorio</small></div>

    </div></section>
    <div class="g2">
      <section class="card"><header>${CT("i-cal","#BA0517")}<h2>Próximas reservaciones</h2><div class="r">ejemplo</div></header><div class="scrollx"><table class="tbl resv">
        <thead><tr><th>Día</th><th>Nombre</th><th>Hora</th><th>Ocasión</th><th>Llegó por</th><th></th></tr></thead>
        <tbody>${RESV.map(r => `<tr><td>${lbl(r[0])}</td><td>${r[2]} · ${r[3]} pers.</td><td class="num" style="white-space:nowrap">${r[1]}</td><td>${r[4]}</td><td>${chn(r[5])}</td><td>${r[6] ? `<span class="status s-ok"><i></i>Confirmada</span>` : `<span class="status s-amber"><i></i>Sin confirmar</span>`}</td></tr>`).join("")}</tbody></table></div></section>

        <div class="tables">${[...Array(MESAS)].map((_, i) => `<span class="${OCUP.includes(i + 1) ? "oc" : RESM.includes(i + 1) ? "rs" : ""}">${i + 1}</span>`).join("")}</div>

        <div class="pad" style="border-top:1px solid var(--line);display:grid;gap:8px"><div class="msg out" style="max-width:100%">¡Buenos días! Le esperamos hoy a las 8:00 pm en Libby's Cajun, mesa para 2. ¿Nos confirma? 🦞<small>recordatorio del asistente · ejemplo</small></div></div></section>

      <thead><tr><th>Proveedor</th><th>Le compra</th><th>WhatsApp</th><th>Aviso automático</th><th>Ahora</th><th></th></tr></thead>
      <tbody>${PROV.map(pv => { const fl = faltas(pv.id); const c = PCFG[pv.id]; const txt = provMsg(pv.id);
        const st = fl.length ? `<span class="status s-red"><i></i>Falta ${fl.map(x => x.n.toLowerCase()).join(" y ")}</span>` : `<span class="status s-ok"><i></i>Todo arriba del mínimo</span>`;
        return `<tr><td><b>${pv.n}</b></td><td>${pv.what}</td><td><input class="tin" data-ptel="${pv.id}" id="pt-${pv.id}" inputmode="tel" placeholder="Número" value="${c.tel}"></td>
        <td><label class="sw"><input type="checkbox" data-pauto="${pv.id}" ${c.auto ? "checked" : ""}><i></i><span>${c.auto ? "Activo" : "Apagado"}</span></label></td><td>${st}</td>
        <td class="r">${txt ? `<a class="btn sm wa" target="_blank" rel="noopener" href="${provWa(pv.id, txt)}">${icon("i-wa")}Avisar ahora</a>` : ""}</td></tr>`; }).join("")}</tbody></table></div>
      <div class="pad" style="border-top:1px solid var(--line)"><p class="hint">Escriba el WhatsApp de cada proveedor una vez. Con el aviso automático, el pedido le llega en cuanto algo baja del mínimo y la respuesta queda anotada. Proveedores y avisos son de ejemplo.</p></div></section>
    <section class="card"><header>${CT("i-clock","#5A6872")}<h2>Avisos a proveedores hoy</h2><div class="r">ejemplo</div></header><div class="scrollx"><table class="tbl prov avi">
      <thead><tr><th>Hora</th><th>A quién</th><th>Qué se le pidió</th><th>Respuesta</th></tr></thead>
      <tbody>${AVISOS.map(a => `<tr><td class="num">${a.h}</td><td>${PROV.find(x => x.id === a.p).n}</td><td>${a.t}</td><td><span class="status ${a.r.startsWith("Confirm") ? "s-ok" : "s-amber"}"><i></i>${a.r}</span></td></tr>`).join("")}</tbody></table></div></section>
  </div>`;
}

function vCaja() {
  const lbl = d => d === 1 ? "Ayer" : DAYS[(today - d + 7) % 7];
  return `${PH("Cierre de caja", "Cada noche se cuenta desde el celular. El panel compara con lo que se vendió en mesas, para llevar y domicilios, y avisa si no cuadra.")}
  <div class="g2">
    <section class="card"><header>${CT("i-cash","#3BA755")}<h2>Últimos 6 días</h2></header><div class="scrollx"><table class="tbl">
      <thead><tr><th>Día</th><th class="r">Efectivo esperado</th><th class="r">Contado</th><th>Cerró</th><th>Resultado</th></tr></thead>
      <tbody>${CAJA.filter(c => c.d > 0).map(c => `<tr><td>${lbl(c.d)}</td><td class="r num">${L(c.ef)}</td><td class="r num">${L(c.cont)}</td><td>${c.who}</td><td>${cajaTag(c)}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="card"><header>${CT("i-check","#3BA755")}<h2>Cerrar caja de hoy</h2></header><div class="pad form">
      <div class="f2"><label>Efectivo contado (L)<input id="cef" inputmode="decimal" placeholder="0"></label><label>Gastos pagados de caja (L)<input id="cga" inputmode="decimal" placeholder="0"></label></div>
      <div id="cres"></div>
      <button class="btn pri" id="cok">Guardar cierre</button>
      <p class="hint">El efectivo esperado sale de las cuentas de mesa pagadas en efectivo y de los domicilios que se pagan al recibir. Tarjeta y transferencias se cuadran aparte.</p>
    </div></section>
  </div>`;
}
function cajaCalc() {
  const exp = Math.round(SALES.reduce((a, x) => a + x.total, 0) * .45);
  const ef = +($("#cef").value || 0), ga = +($("#cga").value || 0); const d = ef + ga - exp; const k = Math.abs(d) < 30 ? "ok" : d < 0 ? "red" : "amber";
  $("#cres").innerHTML = `<div class="res" style="background:var(--sunk)"><span>Efectivo esperado</span><span class="big">${L(exp)}</span></div>` + (ef ? `<div class="res" style="background:var(--${k}-bg);color:var(--${k})"><span>${k === "ok" ? "Cuadra" : d < 0 ? "Faltan" : "Sobran"}</span><span class="big">${k === "ok" ? "✓" : L(Math.abs(d))}</span></div>` : "");
}

function vVentas() {
  const wk = HIST.slice(21).reduce((q, h) => q + h.ventas, 0); const wo = HIST.slice(21).reduce((q, h) => q + h.o, 0);
  const t = SALES.reduce((a, x) => a + x.total, 0) || 1;
  const byCh = CH.map(c => [c, SALES.filter(x => x.ch === c).reduce((a, x) => a + x.total, 0)]);
  const items = itemsSold(); const mxI = Math.max(...items.map(i => i[2]));
  const days = HIST.slice(21); const mxD = Math.max(...days.map(d => d.ventas));
  return `${PH("Ventas", "Lo que se vendió cada día y lo más pedido, sin sacar cuentas a mano.")}
  <div class="stack">
    <section class="card"><div class="kpis">
      <div class="kpi"><span>Ventas últimos 7 días</span><b class="num">${L(wk)}</b><small>${wo.toLocaleString("en-US")} pedidos</small></div>
      <div class="kpi"><span>Ticket promedio</span><b class="num">${L(wk / wo)}</b><small>por mesa o pedido</small></div>
      <div class="kpi"><span>WhatsApp hoy</span><b class="num">${L(byCh[1][1] + byCh[2][1])}</b><small>${Math.round((byCh[1][1] + byCh[2][1]) / t * 100)}% de las ventas</small></div>
      <div class="kpi"><span>Salón hoy</span><b class="num">${L(byCh[0][1])}</b><small>${Math.round(byCh[0][1] / t * 100)}% de las ventas</small></div>
    </div></section>
    <div class="g2">
      <section class="card"><header>${CT("i-chart","#0B827C")}<h2>Lo más vendido hoy</h2><div class="r">precios de ejemplo</div></header><div class="bars">${items.map(([m, q, v]) => `<div class="hb"><b>${m.s}<em class="num">${q} · ${L(v)}</em></b><div class="trk"><i style="width:${v / mxI * 100}%;background:var(--c1)"></i></div></div>`).join("")}</div></section>
      <section class="card"><header>${CT("i-chart","#0B827C")}<h2>Cada día de la semana</h2></header><div class="bars">${days.map(d => `<div class="hb"><b>${d.d === 1 ? "Ayer" : DAYS[d.wd]}<em class="num">${d.o} pedidos · ${L(d.ventas)}</em></b><div class="trk"><i style="width:${d.ventas / mxD * 100}%;background:var(--c3)"></i></div></div>`).join("")}</div></section>
    </div>
    <section class="card"><header>${CT("i-chart","#0B827C")}<h2>Hoy por canal</h2></header><div class="bars">${byCh.map(([c, v]) => `<div class="hb"><b>${c}<em class="num">${L(v)} · ${Math.round(v / t * 100)}%</em></b><div class="trk"><i style="width:${v / t * 100}%;background:${col(CHC[c])}"></i></div></div>`).join("")}</div></section>
  </div>`;
}

function vClientes() {
  const avg = (OPIN.reduce((a, o) => a + o.s, 0) / OPIN.length).toFixed(1);
  return `${PH("Clientes", "Quién le compra más, qué pide y hace cuánto no vuelve. Después de cada visita o domicilio el asistente pregunta \"¿Cómo le fue?\", y si algo faltó usted se entera ese mismo día.")}
  <div class="stack">
    <section class="card"><div class="kpis">
      <div class="kpi"><span>Calificación de hoy</span><b class="num">${avg} <span class="stars" style="font-size:18px">★</span></b><small>${OPIN.length} respuestas de ejemplo</small></div>
      <div class="kpi"><span>Me gusta en TikTok</span><b class="num">667.7K</b><small>real</small></div>
      <div class="kpi"><span>Clientes que volvieron este mes</span><b class="num">138</b><small>ejemplo</small></div>
      <div class="kpi"><span>Faltó algo</span><b class="num late">${OPIN.filter(o => o.s <= 3).length}</b><small>para resolver hoy</small></div>
    </div></section>
    <div class="g2">
      <section class="card"><header>${CT("i-users","#7526E3")}<h2>Respuestas de hoy</h2><div class="r">ejemplo</div></header><div class="scrollx"><table class="tbl resv">
        <thead><tr><th>Hora</th><th>Cliente</th><th>Calificación</th><th>Dijo</th><th>Pedido</th><th></th></tr></thead>
        <tbody>${OPIN.map(o => `<tr><td class="num">${o.h}</td><td>${o.who}</td><td><span class="stars">${"★".repeat(o.s)}${"☆".repeat(5 - o.s)}</span></td><td>${o.t}</td><td>#${o.id}</td><td class="r">${o.s <= 3 ? (o.fix ? `<span class="status s-ok"><i></i>Resuelto</span>` : `<a class="btn sm wa" target="_blank" rel="noopener" data-fix="${o.id}" href="${waLink(`Hola ${first(o.who)}, le escribe Libby's Cajun. Disculpe que en su pedido #${o.id} faltó la mantequilla aparte. ¿Cómo le podemos compensar?`, "")}">${icon("i-wa")}Resolver</a>`) : ""}</td></tr>`).join("")}</tbody></table></div></section>
      <section class="card"><header>${CT("i-users","#7526E3")}<h2>Clientes frecuentes</h2><div class="r">ejemplo</div></header><div class="scrollx"><table class="tbl">
        <thead><tr><th>Cliente</th><th class="r">Visitas</th><th>Su favorito</th><th>Último</th><th></th></tr></thead>
        <tbody>${FREQ.map(c => `<tr><td>${c.who} ${chn(c.ch)}</td><td class="r num">${c.n}</td><td>${c.fav}</td><td class="${c.last.includes("21") ? "late" : ""}">${c.last}</td><td class="r">${c.last.includes("21") ? `<a class="btn sm wa" target="_blank" rel="noopener" href="${waLink(`Hola ${first(c.who)}, le escribe Libby's Cajun. ¡Le extrañamos! ¿Le apartamos mesa este fin de semana?`, "")}">${icon("i-wa")}Escribirle</a>` : ""}</td></tr>`).join("")}</tbody></table></div>
        <div class="pad" style="border-top:1px solid var(--line)"><p class="hint">Cada pedido y cada reservación de WhatsApp queda guardado con el nombre y lo que pidió. Así se sabe quién dejó de venir y se le puede escribir.</p></div></section>
    </div>
  </div>`;
}

function vTiktok() {
  const ts = VIDS.slice().sort((a, b) => b.ven - a.ven); const mx = ts[0].ven;
  return `${PH("TikTok", `Sus videos traen la gente. En la descripción va "pide al ${WA}" con un código, el asistente lo anota y aquí se ve cuánto vendió cada video.`)}
  <div class="stack">
    <section class="card"><div class="kpis">
      <div class="kpi"><span>Seguidores</span><b class="num">39.9K</b><small>@libbyscajun · real</small></div>
      <div class="kpi"><span>Me gusta</span><b class="num">667.7K</b><small>398 videos · real</small></div>
      <div class="kpi"><span>Su video más visto</span><b class="num">1.1M</b><small>Nueva mariscada Catracha Louisiana · real</small></div>
      <div class="kpi"><span>Pedidos con código esta semana</span><b class="num">${VIDS.reduce((a, t) => a + t.ped, 0)}</b><small>ejemplo</small></div>
    </div></section>
    <section class="card"><header>${CT("i-play","#181818")}<h2>Sus videos</h2><div class="r">vistas y comentarios reales · pedidos de ejemplo</div></header><div class="scrollx"><table class="tbl">
      <thead><tr><th>Video</th><th>Fecha</th><th>Código</th><th class="r">Vistas</th><th class="r">Pedidos</th><th style="min-width:160px">Ventas</th></tr></thead>
      <tbody>${ts.map(t => `<tr><td style="min-width:240px">${t[0]}</td><td style="white-space:nowrap">${t[1]}</td><td><span class="status s-gray">${t[4]}</span></td><td class="r num">${K(t[2])} · ${t[3]} com.</td><td class="r num">${t.ped}</td><td><div style="display:flex;gap:10px;align-items:center"><div class="trk" style="flex:1"><i style="width:${t.ven / mx * 100}%;background:var(--c1)"></i></div><span class="num">${L(t.ven)}</span></div></td></tr>`).join("")}</tbody></table></div></section>
    <div class="g2">
      <section class="card"><header>${CT("i-chat","#181818")}<h2>Lo que pregunta la gente en sus comentarios</h2><div class="r">comentarios reales</div></header><div class="pad" style="display:grid;gap:8px">
        ${PREG.map(([q, w]) => `<div class="q">"${q}"<small>${w}</small></div>`).join("")}</div></section>
      <section class="card"><header>${CT("i-wa","#2E844A")}<h2>De TikTok a la mesa</h2></header><div class="pad" style="display:grid;gap:10px">
        <p style="margin:0">En su video más visto la cuenta contestó 57 de los 94 comentarios que se pudieron leer: le dedican tiempo. Precio, ubicación, menú y "¿para cuántas personas?" son las mismas preguntas una y otra vez.</p>
        <p class="hint" style="margin:0">Cuando alguien escribe al ${WA} desde un video, el asistente contesta eso al instante, toma el pedido o la reservación, y el panel anota de qué video vino.</p></div></section>
    </div>
  </div>`;
}

// ---------- render & events ----------
const VIEWS = {hoy: vHoy, whatsapp: vWhatsapp, pedidos: vPedidos, reservas: vReservas, insumos: vInsumos, caja: vCaja, ventas: vVentas, clientes: vClientes, tiktok: vTiktok};
function render() { nav(); $("#main").innerHTML = VIEWS[VIEW](); if (VIEW === "caja") cajaCalc(); window.scrollTo(0, 0); }
const keep = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
function go(v) { if (!VIEWS[v]) return; const rs = $("#results"); if (rs) { rs.hidden = true; $("#q").value = ""; } VIEW = v; KMODE = false; history.replaceState(null, "", "#" + v); render(); }
document.addEventListener("click", e => {
  const cs = e.target.closest("[data-cs]"); if (cs) CSEL = +cs.dataset.cs;
  const v = e.target.closest("[data-v]"); if (v) { e.preventDefault(); go(v.dataset.v); return; }
  const cv = e.target.closest("[data-c]"); if (cv) { CSEL = +cv.dataset.c; keep(); return; }
  const d = e.target.closest("[data-done]"); if (d) { DONE.add(d.dataset.done); setTimeout(render, 300); }
  const fx = e.target.closest("[data-fix]"); if (fx) { const o = OPIN.find(x => x.id === +fx.dataset.fix); o.fix = true; setTimeout(keep, 300); }
  const m = e.target.closest("[data-mv]"); if (m && !m.disabled) { const p = PICK.find(x => x.id === +m.dataset.mv);
    const nx = {nuevo: "cocina", cocina: "revision", revision: p.src === "Domicilio" ? "camino" : "entregado", camino: "entregado"}[p.st];
    p.st = nx; p.min = 0; p.late = false;
    toast(nx === "camino" ? `#${p.id} salió. El asistente le avisó a ${first(p.who)} (demo)` : nx === "revision" ? `#${p.id} listo, a revisar` : nx === "cocina" ? `#${p.id} pasó a cocina` : p.src === "Mesa" ? `#${p.id} servido en mesa ${p.mesa}` : `#${p.id} entregado`);
    if (nx === "entregado") PICK.splice(PICK.indexOf(p), 1); keep(); }
  if (e.target.closest("#kmode")) { KMODE = !KMODE; render(); }
  if (e.target.closest("#cok")) { if (!$("#cef").value) { toast("Escriba el efectivo contado"); return; } toast("Cierre de hoy guardado (demo)"); $("#cef").value = ""; $("#cga").value = ""; cajaCalc(); }
  if (e.target.closest("#tema")) { const dk = document.documentElement.dataset.theme === "dark"; if (dk) delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = "dark"; try { localStorage.setItem("lc-tema", dk ? "light" : "dark"); } catch (er) {} }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { const q = e.target.value.trim().toLowerCase().replace("#", ""); const r = $("#results"); if (!q) { r.hidden = true; return; }
    const hits = [...PICK.filter(p => String(p.id).includes(q) || p.who.toLowerCase().includes(q) || p.col.toLowerCase().includes(q)).map(p => `<a href="#pedidos" data-v="pedidos"><span>Pedido #${p.id} · ${p.who}</span><small>${where(p)}</small></a>`),
      ...CONV.filter(x => x.who.toLowerCase().includes(q) || x.q.toLowerCase().includes(q)).map(x => `<a href="#whatsapp" data-v="whatsapp" data-cs="${x.id}"><span>${x.who}</span><small>WhatsApp</small></a>`),
      ...RESV.filter(x => x[2].toLowerCase().includes(q)).map(x => `<a href="#reservas" data-v="reservas"><span>${x[2]}</span><small>reservación · ${x[3]} pers.</small></a>`),
      ...FREQ.filter(c => c.who.toLowerCase().includes(q)).map(c => `<a href="#clientes" data-v="clientes"><span>${c.who}</span><small>${c.n} visitas</small></a>`),
      ...INS.filter(i => i[0].toLowerCase().includes(q)).map(i => `<a href="#insumos" data-v="insumos"><span>${i[0]}</span><small>quedan ${i[2]} ${i[1]}</small></a>`)].slice(0, 8);
    r.innerHTML = hits.join("") || `<div class="empty">Sin resultados</div>`; r.hidden = false; }
  if (e.target.id === "cef" || e.target.id === "cga") cajaCalc();
  if (e.target.dataset.bot) { BOTTXT[e.target.dataset.bot] = e.target.value; saveBot(); }
  if (e.target.dataset.ptel) { PCFG[e.target.dataset.ptel].tel = e.target.value; savePC(); const id = e.target.id, pos = e.target.selectionStart; render(); const i = document.getElementById(id); i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => {
  if (e.target.dataset.ck) { const [id, k] = e.target.dataset.ck.split(":"); PICK.find(x => x.id === +id).chk[k] = e.target.checked; keep(); }
  if (e.target.dataset.pauto) { const pv = e.target.dataset.pauto; PCFG[pv].auto = e.target.checked; savePC(); toast(e.target.checked ? `Aviso automático a ${PROV.find(x => x.id === pv).n} activado` : `Aviso automático a ${PROV.find(x => x.id === pv).n} apagado`); render(); } });
document.addEventListener("pointerover", e => { const r = e.target.closest("[data-tip]"); const old = document.querySelector(".tip"); if (old) old.remove(); if (!r) return;
  const ch = r.closest(".chart"); const bb = r.getBoundingClientRect(), cb = ch.getBoundingClientRect(); const [a, b] = r.dataset.tip.split("|");
  const t = document.createElement("div"); t.className = "tip"; t.innerHTML = `<b>${b}</b>${a}`; t.style.left = (bb.left + bb.width / 2 - cb.left) + "px"; t.style.top = (bb.top - cb.top) + "px"; ch.append(t); });
const h0 = location.hash.slice(1); if (VIEWS[h0]) VIEW = h0;
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== VIEW) go(h); });
render();
</script>
</body>
