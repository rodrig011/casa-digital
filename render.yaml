# Botón «Deploy to Render» (https://render.com/deploy?repo=https://github.com/rodrig011/casa-digital): crea el servicio
# de la demo con IA. Es el mismo que bot-restaurante/render-demo.yaml; Render solo pide ANTHROPIC_API_KEY.
services:
  - type: web
    name: clientia-demo-ia
    runtime: node
    region: virginia
    plan: free                  # se duerme sin visitas; la página lo despierta al abrir y mientras tanto contesta el menú
    rootDir: bot-restaurante
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Tegucigalpa
      - key: DATA_DIR
        value: ""
      - key: NEGOCIO
        value: negocios/ejemplo.json
      - key: PANEL_SECRET
        generateValue: true
      - key: DEMO_IA
        value: "on"
      - key: DEMO_ORIGENES
        value: https://clientiatech.com,https://www.clientiatech.com
      - key: DEMO_LIMITE_VISITANTE   # mensajes por visitante cada 10 minutos
        value: "15"
      - key: DEMO_LIMITE_DIA         # respuestas con IA por día en todo el sitio
        value: "400"
      - key: ANTHROPIC_API_KEY       # se pega solo aquí, en Render > Environment
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: BOT_IA                  # sin Twilio no hay WhatsApp en este servicio
        value: "off"

  # Prueba real del bot de Con Sabor a Pueblo por WhatsApp (número de prueba gratis de Meta, nunca el del negocio).
  # Gratis y sin disco: se duerme sin mensajes y los pedidos se borran al reiniciar. Para el cliente de verdad
  # se pasa al plan pagado con disco (bot-restaurante/render.yaml).
  - type: web
    name: con-sabor-bot-prueba
    runtime: node
    region: virginia
    plan: free
    rootDir: bot-restaurante
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Tegucigalpa
      - key: DATA_DIR
        value: ""
      - key: NEGOCIO
        value: negocios/con-sabor-a-pueblo.json
      - key: META_PHONE_ID         # Meta > WhatsApp > Configuración de la API > Identificador del número de teléfono
        sync: false
      - key: META_TOKEN            # el token de esa misma pantalla (el temporal dura 24 h)
        sync: false
      - key: META_APP_SECRET       # Meta > Configuración de la app > Básica > Clave secreta de la app
        sync: false
      - key: META_VERIFY_TOKEN     # se copia en Meta > WhatsApp > Configuración > Webhook
        generateValue: true
      - key: OWNER_WHATSAPP        # el celular de Rodrigo haciendo de dueño (nunca el del negocio)
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: BOT_IA
        value: "on"
      - key: PANEL_SECRET
        generateValue: true
      - key: DATA_KEY
        generateValue: true
      - key: PANEL_USUARIOS        # opcional, para entrar al panel: npm run usuario -- linea ...
        sync: false
