entColor\" stroke-width=\"2\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/></svg></button>\n  <button class=\"avatar solo-cel\" id=\"quien2\" title=\"\" aria-label=\"Seguridad y acceso\"></button>\n</header>\n<main>\n  <div id=\"vista\"><div class=\"kpis\"><div class=\"card kpi\"><div class=\"sk\" style=\"height:12px;width:60%\"></div><div class=\"sk\" style=\"height:26px;width:40%;margin-bottom:4px\"></div></div><div class=\"card kpi\"><div class=\"sk\" style=\"height:12px;width:60%\"></div><div class=\"sk\" style=\"height:26px;width:40%;margin-bottom:4px\"></div></div><div class=\"card kpi\"><div class=\"sk\" style=\"height:12px;width:60%\"></div><div class=\"sk\" style=\"height:26px;width:40%;margin-bottom:4px\"></div></div><div class=\"card kpi\"><div class=\"sk\" style=\"height:12px;width:60%\"></div><div class=\"sk\" style=\"height:26px;width:40%;margin-bottom:4px\"></div></div></div><div class=\"grid2\"><div class=\"card\"><div class=\"sk\" style=\"height:180px;margin:12px\"></div></div><div class=\"card\"><div class=\"sk\" style=\"height:180px;margin:12px\"></div></div></div></div>\n</main>\n<nav class=\"tabs\" id=\"nav2\" aria-label=\"Secciones\"></nav>\n<div class=\"mas\" id=\"mas\"></div>\n<div class=\"velo\" id=\"velo\"></div>\n<aside class=\"ficha\" id=\"ficha\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"f-t\" tabindex=\"-1\"></aside>\n<script>window.fetch=async(u,o)=>{const r=await window.parent.DEMO.api(String(u),o||{});return new Response(JSON.stringify(r.body),{status:r.status,headers:{\"Content-Type\":\"application/json\"}})};<\/script><script>document.addEventListener(\"click\",e=>{const a=e.target.closest('a[href=\"/panel/salir\"],a[href=\"/panel/entrar\"]');if(a){e.preventDefault();window.parent.DEMO.salir()}})<\/script><script>\nconst VISTAS = [[\"hoy\", \"Hoy\"], [\"pedidos\", \"Pedidos\"], [\"cocina\", \"Cocina\"], [\"personas\", \"Por atender\"], [\"menu\", \"Menú\"]];\nconst CORTO = { personas: \"Atender\", reservas: \"Mesas\", repartidores: \"Envíos\", proveedores: \"Compras\", cupos: \"Apartados\" };\n// Seguridad va arriba en la compu; en el celular se abre tocando las iniciales\nconst EXTRA = [[\"ajustes\", \"Configuración\"], [\"seguridad\", \"Seguridad\"]];\nconst todas = () => VISTAS.concat(EXTRA);\n// íconos en mosaico, como Lightning: [trazo SVG, color]\nconst ICONO = {\n  hoy: [\"M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\", \"#0176D3\"], cupos: [\"M4 5h16v15H4zM4 9h16M8 3v4M16 3v4\", \"#FE9339\"],\n  pedidos: [\"M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6\", \"#3BA755\"], cocina: [\"M6 8h12l-1 12H7zM9 8V6a3 3 0 0 1 6 0v2\", \"#BA0517\"],\n  personas: [\"M4 5h16v11H8l-4 4z\", \"#7526E3\"], menu: [\"M5 4h14v16H5zM9 8h6M9 12h6M9 16h4\", \"#0B827C\"], reservas: [\"M4 10h16M6 10v9M18 10v9M8 6h8\", \"#032D60\"],\n  ventas: [\"M4 20V10M10 20V4M16 20v-7M22 20H2\", \"#0B827C\"], seguridad: [\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4\", \"#032D60\"],\n  llave: [\"M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4\", \"#032D60\"], ajustes: [\"M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4\", \"#444\"], repartidores: [\"M5 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM15 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM9 17h6M3 13h11l2-5h3l2 4v5h-2M7 8h5\", \"#E3066A\"], proveedores: [\"M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10\", \"#8C4B02\"], actividad: [\"M3 12h4l3-8 4 16 3-8h4\", \"#0176D3\"], espera: [\"M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z\", \"#FE9339\"], mas: [\"M5 12h.01M12 12h.01M19 12h.01\", \"#706E6B\"],\n};\nconst svg = k => `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"${ICONO[k][0]}\"/></svg>`;\nconst H = (t, k, r = \"\") => `<h2><span class=\"ct\">${svg(k)}</span>${t}${r}</h2>`;\nconst ESTADO_TXT = { por_pagar: \"Esperando pago\", nuevo: \"Nuevo\", cocina: \"En cocina\", listo: \"Listo\", en_camino: \"En camino\", por_envio: \"Esperando envío\", entregado: \"Entregado\", no_vino: \"No vino\", cancelado: \"Cancelado\", atendido: \"Atendido\", por_confirmar: \"Por confirmar\", confirmada: \"Confirmada\", sin_cupo: \"Sin cupo\", en_espera: \"Lista de espera\" };\nlet editRep = null, repError = \"\", repGuardando = false;\nlet N = null, P = [], vista = \"hoy\", vistos = null, sonido = false, modoPedidos = \"tablero\", busca = \"\";\ntry { modoPedidos = localStorage.getItem(\"modoPedidos\") || \"tablero\"; } catch {}\n// tema claro u oscuro: el que eligió, o el del celular\nconst ponerTema = t => document.documentElement.setAttribute(\"data-theme\", t);\ntry { ponerTema(localStorage.getItem(\"tema\") || (matchMedia(\"(prefers-color-scheme: dark)\").matches ? \"dark\" : \"light\")); } catch { ponerTema(\"light\"); }\ndocument.getElementById(\"tema\").onclick = () => { const t = document.documentElement.getAttribute(\"data-theme\") === \"dark\" ? \"light\" : \"dark\"; ponerTema(t); try { localStorage.setItem(\"tema\", t); } catch {} };\ntry { vista = localStorage.getItem(\"vista\") || \"hoy\"; } catch {}\n\n\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s == null ? \"\" : s).replace(/[&<>\"]/g, c => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\" }[c]));\nconst MONEDAS = { HNL: [\"L \", \"es-HN\", 0], GTQ: [\"Q\", \"es-GT\", 0], USD: [\"$\", \"en-US\", 2] };\nconst L = n => { const [s, loc, min] = MONEDAS[(N && N.moneda) || \"HNL\"] || MONEDAS.HNL; return s + (+n || 0).toLocaleString(loc, { minimumFractionDigits: min, maximumFractionDigits: 2 }); };\nconst hora = iso => new Date(iso).toLocaleTimeString(\"es-HN\", { hour: \"numeric\", minute: \"2-digit\", timeZone: \"America/Tegucigalpa\" });\nconst dia = iso => new Date(iso).toLocaleDateString(\"en-CA\", { timeZone: \"America/Tegucigalpa\" });\nconst hoy = () => dia(new Date().toISOString());\nconst hace = iso => { const m = Math.round((Date.now() - new Date(iso)) / 6e4); return m < 1 ? \"ahora\" : m < 60 ? `hace ${m} n    return cargarSeguridad();\n  }\n  const semana = Date.now() - 7 * 864e5;\n  const malos = S.eventos.filter(e => MALOS.includes(e.evento) && new Date(e.en) > semana).length;\n  const que = e => e.evento === \"estado\" ? `${esc(e.pedido)}: <span class=\"tag t-${esc(e.de)}\">${ESTADO_TXT[e.de] || esc(e.de)}</span> → <span class=\"tag t-${esc(e.a)}\">${ESTADO_TXT[e.a] || esc(e.a)}</span>` : `${MALOS.includes(e.evento) ? `<b style=\"color:var(--red)\">${EVENTO[e.evento]}</b>` : EVENTO[e.evento] || esc(e.evento)}${e.como ? ` <small style=\"color:var(--tx3)\">(${esc(e.como)})</small>` : \"\"}`;\n  v.innerHTML = `<p class=\"ayuda\">Así está protegido el panel. Solo entran los correos de abajo; cada entrada, intento fallido y cambio de pedido queda anotado aquí con la hora y el equipo.</p>\n    <div class=\"kpis\">\n      <div class=\"card kpi\"><b>${S.cifrado ? \"AES-256\" : \"No\"}</b><span>${S.cifrado ? \"Datos de clientes cifrados en el servidor\" : S.disco ? \"Datos sin cifrar: falta la llave\" : \"Datos solo en memoria\"}</span></div>\n      <div class=\"card kpi\"><b>${S.dosPasos && S.usuarios.every(u => u.whatsapp) ? \"2 pasos\" : S.dosPasos ? \"Mixto\" : \"Contraseña\"}</b><span>${S.dosPasos ? \"Contraseña + código por WhatsApp\" : \"Entrada solo con contraseña\"}</span></div>\n      <div class=\"card kpi\"><b>${S.sesionHoras} h</b><span>La sesión se cierra sola</span></div>\n      <div class=\"card kpi\" style=\"${malos ? \"border-top-color:var(--red)\" : \"\"}\"><b>${malos}</b><span>Intentos fallidos en 7 días</span></div></div>\n    <div class=\"grid-seg\">\n      <div class=\"card\">${H(\"Quién tiene acceso\", \"llave\")}<table><tr><th>Persona</th><th>Código a</th></tr>${S.usuarios.map(u => `<tr><td>${esc(u.nombre)}<small style=\"display:block;color:var(--tx3)\">${esc(u.correo)}</small></td><td>${u.whatsapp ? esc(u.whatsapp) : `<span class=\"tag t-por_pagar\">Solo contraseña</span>`}</td></tr>`).join(\"\")}</table>\n        <p class=\"vacio\" style=\"padding:12px 16px;text-align:left;font-size:12px\">Para dar o quitar acceso, avísele a Casa Digital. Quitar a alguien cierra su sesión al instante.</p></div>\n      <div class=\"card\">${H(\"Actividad reciente\", \"actividad\")}${S.eventos.length ? `<div class=\"solo-pc\" style=\"overflow-x:auto\"><table><tr><th>Cuándo</th><th>Quién</th><th>Qué pasó</th><th>Desde</th></tr>${S.eventos.slice(0, 80).map(e => `<tr><td style=\"white-space:nowrap\">${fechaHora(e.en)}</td><td>${esc(e.correo || \"—\")}</td><td>${que(e)}</td><td style=\"white-space:nowrap;color:var(--tx3)\">${desde(e)}</td></tr>`).join(\"\")}</table></div>\n        <div class=\"solo-cel\">${S.eventos.slice(0, 50).map(e => `<div class=\"fila\"><div>${que(e)}<small>${esc(e.correo || \"—\")} · ${fechaHora(e.en)}${desde(e) ? ` · ${desde(e)}` : \"\"}</small></div></div>`).join(\"\")}</div>` : `<div class=\"vacio\">Todavía no hay actividad.</div>`}</div>\n    </div>`;\n}\n\nasync function cambiar(n, estado, b) {\n  b.disabled = true;\n  try {\n    const r = await fetch(`/api/pedidos/${encodeURIComponent(n)}/estado`, { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify({ estado }) });\n    if (r.status === 401) return location.href = \"/panel/entrar\";\n    if (!r.ok) throw new Error();\n    const p = await r.json(); P = P.map(x => x.n === p.n ? p : x); pintar();\n  } catch { b.disabled = false; alert(\"No se pudo guardar. Revise la conexión e intente otra vez.\"); }\n}\n\n// the bot passes the order to the next driver (never back to one who said no) and tells him by WhatsApp\nasync function otroRepartidor(n, b) {\n  b.disabled = true;\n  try {\n    const r = await fetch(`/api/pedidos/${encodeURIComponent(n)}/repartidor`, { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: \"{}\" });\n    if (r.status === 401) return location.href = \"/panel/entrar\";\n    if (!r.ok) throw new Error();\n    const p = await r.json(); P = P.map(x => x.n === p.n ? p : x); pintar();\n    if (!p.repartidor) alert(\"No hay otro repartidor disponible para esta sucursal. Escríbale a uno directamente.\");\n  } catch { b.disabled = false; alert(\"No se pudo cambiar el repartidor. Revise la conexión e intente otra vez.\"); }\n}\n\nfunction beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.2, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .6); o.start(); o.stop(c.currentTime + .6); } catch {} }\n\nasync function cargar() {\n  try {\n    const r = await fetch(\"/api/pedidos\", { cache: \"no-store\" });\n    if (r.status === 401) return location.href = \"/panel/entrar\";\n    P = await r.json();\n    const nuevos = new Set(P.filter(p => p.tipo === \"pedido\" && p.estado === \"nuevo\").map(p => p.n));\n    if (vistos && sonido && [...nuevos].some(n => !vistos.has(n))) beep();\n    vistos = nuevos;\n    $(\"#vivo\").className = \"vivo\"; $(\"#vivo\").lastChild.textContent = \"Actualizado \" + new Date().toLocaleTimeString(\"es-HN\", { hour: \"numeric\", minute: \"2-digit\", timeZone: \"America/Tegucigalpa\" });\n    if (vista === \"seguridad\") cargarSeguridad();\n    pintar();\n  } catch { $(\"#vivo\").className = \"vivo off\"; $(\"#vivo\").lastChild.textContent = \"Sin conexión, reintentando\"; }\n}\n\n(async () => {\n  const r = await fetch(\"/api/negocio\", { cache: \"no-store\" });\n  if (r.status === 401) return location.href = \"/panel/entrar\";\n  N = await r.json();\n  if (N.reservaciones) VISTAS.splice(3, 0, [\"reservas\", \"Reservaciones\"]);\n  if (N.cupos) VISTAS.splice(1, 0, [\"cupos\", \"Apartados\"]);\n  if ((N.repartidores && N.repartidores.length) || N.domicilioPropio) VISTAS.splice(VISTAS.findIndex(v => v[0] === \"cocina\") + 1, 0, [\"repartidores\", \"Repartidores\"]);\n  if (N.proveedores) VISTAS.splice(VISTAS.findIndex(v => v[0] === \"menu\"), 0, [\"proveedores\", \"Proveedores\"]);\n  if (!todas().some(v => v[0] === vista)) vista = \"hoy\";\n  $(\"#quien\").onclick = $(\"#quien2\").onclick = () => { vista = \"seguridad\"; try { localStorage.setItem(\"vista\", vista); } catch {} pintar(); };\n  document.title = `Panel · ${N.nombre}`;\n  $(\"#marca\").textContent = $(\"#marca2\").textContent = N.nombre;\n  $(\"#sub\").textContent = $(\"#sub2\").textContent = `Panel del dueño${N.modoIA ? \" · asistente con IA\" : \"\"}`;\n  for (const l of [$(\"#logo\"), $(\"#logo2\")]) { if (N.logo) { l.innerHTML = `<img src=\"${esc(N.logo)}\" alt=\"\">`; l.classList.add(\"img\"); } else l.textContent = (N.nombre || \"?\").trim()[0].toUpperCase(); l.style.setProperty(\"--marca\", N.color); }\n  const ini = String(N.usuario || \"?\").split(/\\s+/).map(w => w[0]).join(\"\").slice(0, 2).toUpperCase();\n  for (const q of [$(\"#quien\"), $(\"#quien2\")]) { q.textContent = ini; q.title = N.usuario || \"\"; }\n  $(\"#quien-n\").textContent = N.usuario || \"Dueño\";\n  // en el celular la opción larga no cabe en la barra de arriba\n  const sucCorta = () => { $(\"#suc\").options[0].text = matchMedia(\"(max-width:900px)\").matches ? \"Todas\" : \"Todas las sucursales\"; }; sucCorta(); matchMedia(\"(max-width:900px)\").addEventListener(\"change\", sucCorta);\n  $(\"#suc\").innerHTML += N.sucursales.map(s => `<option value=\"${esc(s.id)}\">${esc(s.nombre)}</option>`).join(\"\");\n  if (N.sucursales.length < 2) $(\"#suc\").style.display = \"none\";\n  try { $(\"#suc\").value = localStorage.getItem(\"suc\") || \"\"; } catch {}\n  $(\"#suc\").onchange = () => { try { localStorage.setItem(\"suc\", $(\"#suc\").value); } catch {} pintar(); };\n  await cargar();\n  setInterval(cargar, 8000);\n  setInterval(() => { if (!document.hidden) pintar(); }, 60000);\n})();\n<\/script>\n</body>\n</html>\n";
const marco = document.getElementById("panel"), espera = document.getElementById("espera");
let canal = null; const pendientes = new Map(); let sig = 1, conectado = false;
try { canal = new BroadcastChannel("loca-luna-demo"); } catch (e) {}
function pedir(m, ms = 5000) {
  return new Promise((ok, mal) => {
    if (!canal) return mal(new Error("sin canal"));
    const id = "p" + Date.now() + "-" + sig++;
    const t = setTimeout(() => { pendientes.delete(id); mal(new Error("sin demo")); }, ms);
    pendientes.set(id, r => { clearTimeout(t); ok(r); });
    canal.postMessage({ ...m, id });
  });
}
if (canal) canal.onmessage = e => {
  const m = e.data || {};
  if (m.re && pendientes.has(m.re)) { pendientes.get(m.re)(m.r); pendientes.delete(m.re); return; }
  if (m.tipo === "refrescar") { try { const w = marco.contentWindow; if (w && w.cargar) w.cargar(); } catch (x) {} }
};
function mostrar(s) {
  const h = s.k === "panel" ? PANEL_HTML : (ENTRAR[s.k] || ENTRAR.entrar).replace("ERROR_DEMO", s.error || "");
  marco.srcdoc = h.replaceAll("LOGO_DEMO", LOGO);
}
function sinDemo() { conectado = false; marco.hidden = true; espera.hidden = false; }
window.DEMO = {
  api: async (url, o) => { try { return await pedir({ tipo: "api", url, o: { method: o.method, body: o.body } }); } catch (e) { sinDemo(); throw e; } },
  // the demo login is checked here (email and password, no WhatsApp code), so it never depends on the other tab's version
  entrar: d => mostrar(String(d.correo || "").trim().toLowerCase() === "dueno@localuna.demo" && d.clave === "LocaLuna-2026-demo" ? { k: "panel" } : { k: "entrarError", error: "Correo o contraseña incorrectos." }),
  salir: () => mostrar({ k: "entrar" }),
};
async function conectar() {
  if (conectado) return;
  try { await pedir({ tipo: "hola" }, 1500); conectado = true; espera.hidden = true; marco.hidden = false; mostrar({ k: "entrar" }); }
  catch (e) { sinDemo(); }
}
conectar();
setInterval(() => { if (canal) canal.postMessage({ tipo: "latido" }); if (!conectado) conectar(); }, 4000);
</script>
