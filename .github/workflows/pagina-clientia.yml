# Publica la página de Clientia Tech (clientia-tech/index.html) en GitHub Pages.
# Una sola vez: Settings > Pages > Source: "GitHub Actions".
name: Página Clientia Tech
on:
  push:
    branches: [main]
    paths: ["clientia-tech/**", "steelworks/dist/steelworks-panel.html", "libbys-cajun/panel/dist/libbys-cajun-panel.html", ".github/workflows/pagina-clientia.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio (la página y las demos publicadas, nada más del repositorio)
        run: |
          mkdir -p _sitio
          cp clientia-tech/index.html clientia-tech/terminos.html clientia-tech/privacidad.html clientia-tech/cookies.html clientia-tech/reembolsos.html clientia-tech/legal.html clientia-tech/prueba.html clientia-tech/prueba-ibm.html _sitio/
          mkdir -p _sitio/demos
          cp steelworks/dist/steelworks-panel.html _sitio/demos/steelworks-panel.html
          cp libbys-cajun/panel/dist/libbys-cajun-panel.html _sitio/demos/libbys-cajun-panel.html
          touch _sitio/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deploy
        uses: actions/deploy-pages@v4
