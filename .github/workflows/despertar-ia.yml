# El servidor gratis de la IA (Render) se duerme a los 15 minutos sin visitas y tarda hasta un minuto en despertar:
# en una demo eso se ve como que el bot no contesta. GitHub no corre los horarios de cada 10 minutos a tiempo
# (a veces los salta), así que cada hora arranca un trabajo que lo toca cada 4 minutos durante 80 minutos; los
# trabajos se traslapan y si uno llega tarde el anterior sigue cubriendo. De 6 a. m. a medianoche de Honduras.
# Este repositorio es público: los minutos de Actions no cuestan.
name: Mantener despierta la IA de las demos
on:
  schedule:
    - cron: "0 0-5,12-23 * * *"      # UTC: 6:00 a. m. a 11:59 p. m. en Honduras (UTC-6)
  workflow_dispatch:
permissions: {}
jobs:
  tocar:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Tocar el servidor cada 4 minutos durante 80 minutos
        run: |
          fin=$((SECONDS + 80*60))
          while [ $SECONDS -lt $fin ]; do
            curl -sS -m 90 --retry 2 -o /dev/null -w "$(date -u +%H:%M) %{http_code} %{time_total}s\n" https://clientia-demo-ia.onrender.com/demo/estado || true
            sleep 240
          done
